<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F2EE">
<title>Deixis</title>
<link rel="icon" href="assets/remote-icon.png">
<link rel="apple-touch-icon" href="assets/remote-icon.png">
<!-- Демо-экраны в этом же окне (hub.js); PDF.js — только для своего PDF, QR — для экрана зрителей. -->
<script src="hub.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Приложение Deixis в браузере — копия пульта для Android на демо-данных: вид и устройство экранов —
   android/phone/.../ShowScreen.kt, Screens.kt, Sheets.kt, ThemePanel.kt, OverlayUi.kt. Показ идёт на демо-экраны
   (hub.js) тем же протоколом, что у настоящего приёмника. Токены — DESIGN.md. */
@font-face { font-family: "Deixis Mark"; src: url("assets/GFSDidot-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Deixis Slide"; src: url("assets/NotoSans-SemiBold.ttf") format("truetype"); font-display: swap; }
:root {
  /* Цвета интерфейса */
  --bg: #F3F2EE; --cell: #FFFFFF; --ink: #161514; --l2: #6E6B65; --l3: #C6C3BC;
  --tint: #9C7242; --tint-text: #765A38; --red: #A75750; --live: #A75750; --on-tint: #FFFFFF;
  --sep: rgba(60,55,45,.15); --fill: rgba(120,115,105,.12); --fill2: rgba(120,115,105,.2);
  --scrim: rgba(0,0,0,.35); --scrim-strong: rgba(0,0,0,.45); --shadow-seg: 0 1px 3px rgba(0,0,0,.12); --shadow-toast: 0 6px 20px rgba(0,0,0,.18);
  --knob: #FFFFFF; --shadow-knob: 0 2px 4px rgba(0,0,0,.2); --notify: #2C2B29;
  /* Вывод и полноэкранный просмотр: всегда тёмные, как зал */
  --slide-bg: #000000; --slide-ink: #FFFFFF; --slide-num: rgba(255,255,255,.75); --slide-glyph: #F3F2EE; --slide-glyph-frame: #333333;
  --slide-glyph-line: #D8D4CC; --slide-mark: #BC9361; --slide-shadow: rgba(0,0,0,.8); --slide-stroke: rgba(0,0,0,.9);
  --full-bg: #000000; --full-ink: #FFFFFF; --full-btn: rgba(255,255,255,.14); --full-press: rgba(255,255,255,.15); --full-tint: #BC9361; --full-live: #B96E65;
  --full-dim: rgba(255,255,255,.6); --full-line: rgba(255,255,255,.3);
  --qr-bg: #FFFFFF; --qr-ink: #000000;
  /* Образцы оформления слайда (те же значения уходят на экран в ARGB) */
  --sw-black: #000000; --sw-navy: #18233A; --sw-warm: #4A3420; --sw-green: #20443A;
  --sw-white: #FFFFFF; --sw-paper: #F4EFE6; --sw-gold: #FFD43B;
  /* Размеры */
  --g1: 2px; --g2: 4px; --g3: 6px; --g4: 8px; --g5: 10px; --g6: 12px; --g7: 14px; --gutter: 16px; --g10: 20px; --g12: 24px;
  --h-tab: 50px; --h-btn: 50px; --h-hero: 64px; --h-icon: 44px; --h-pill: 36px; --h-seg: 32px; --h-search: 40px; --h-dev: 36px;
  --h-go: 26px; --h-top: 56px; --h-row: 44px; --h-num: 44px; --h-bar: 50px; --h-step: 32px; --w-step: 44px;
  --w-tile: 116px; --h-tile: 84px; --w-kind: 28px; --w-sw: 30px; --w-switch: 51px; --h-switch: 31px; --w-knob: 27px; --knob-move: 20px;
  --w-qr: 148px; --w-qr-big: 220px; --w-dot: 8px; --w-grab: 36px; --h-grab: 5px; --w-badge: 14px;
  --i-m: 22px; --i-s: 17px; --i-bar: 20px; --i-tile: 24px; --i-search: 18px; --h-key: 44px; --i-key: 24px;
  --w-mark: 3px; --w-list: 760px; --empty-pre: .62fr;
  --page-shift: 18%; --swap-from: .35; --swap-scale: .985; --tab-lift: 1.14; --pop-from: .92; --sheet-close: 110px; --swipe-tab: 70px;
  --w-strip: 72px; --w-num: 22px; --w-ghost: 72px; --w-wide: 700px; --w-left: 440px; --hold: 380ms; --ghost-alpha: .85;
  --line: .5px; --ring: 2px;
  --fs-xs: 10px; --fs-tab: 12px; --fs-s: 12px; --fs-sm: 13px; --fs-sub: 14px; --fs-m: 15px; --fs-body: 17px; --fs-big: 18px; --fs-h2: 20px;
  --fs-mark: 22px; --fs-h1: 28px; --fs-code: 28px; --fs-room: 30px; --fs-screen-mark: 40px; --fs-pin: 34px;
  --r-card: 12px; --r-btn: 14px; --r-seg: 9px; --r-seg-in: 7px; --r-pill: 999px; --r-sheet: 14px; --r-slide: 8px; --r-kind: 8px;
  --r-field: 10px; --r-full: 4px; --r-dialog: 14px; --r-qr: 10px;
  --sheet-max: 88%; --dialog-w: 340px;
  --f-mark: "Deixis Mark", "Didot", Georgia, serif;
  --f-ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --f-slide: "Deixis Slide", "Noto Sans", system-ui, sans-serif;
  /* Движение */
  --t-fast: 140ms; --t-mid: 240ms; --t-slow: 340ms; --t-spin: 1.2s;
  --e-out: cubic-bezier(.2,.8,.2,1); --e-in: cubic-bezier(.4,0,1,1); --e-spring: cubic-bezier(.3,1.35,.55,1);
  --press: .95; --press-soft: .97; --press-bar: .94; --press-icon: .92;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg: #000000; --cell: #1C1C1E; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
  --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --notify: #2C2C2E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1C1C1E; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
  --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --notify: #2C2C2E; color-scheme: dark }
:root[data-theme="paper"] { --bg: #F4EFE6; --cell: #FBF8F2; --ink: #2B2620; }
:root[data-theme="oled"] {
  --bg: #000000; --cell: #0E0E10; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
  --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --notify: #2C2C2E; color-scheme: dark }
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; --t-mid: 0ms; --t-slow: 0ms; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
/* Во весь экран телефона: под чёлкой и над полосой «домой» — отступы безопасной зоны; двойное касание не масштабирует. */
html { height: 100dvh; }
body { background: var(--bg); color: var(--ink); font: var(--fs-body)/1.35 var(--f-ui); letter-spacing: -.01em; overflow: hidden; user-select: none;
       -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;
       padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); box-sizing: border-box;
       transition: background var(--t-mid) var(--e-out), color var(--t-mid) var(--e-out); }
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--ink); letter-spacing: inherit; user-select: text; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [role="button"]:focus-visible { outline: var(--ring) solid var(--tint); outline-offset: var(--ring); }
svg { display: block; }
.ico { width: var(--i-m); height: var(--i-m); stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hidden { display: none !important; }

/* Каркас */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
/* Плашка трансляции бывает скрыта: строки сетки заданы явно, иначе вкладки растягиваются на свободное место. */
#notify { grid-row: 1; } .app > main { grid-row: 2; } .app > .tabs { grid-row: 3; }
main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; will-change: transform; }
.tabs { display: flex; background: var(--cell); border-top: var(--line) solid var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--g1); padding: var(--g3) 0; font-size: var(--fs-tab); color: var(--l2); min-height: var(--h-tab); }
.tab[aria-current="page"] { color: var(--tint); }
.top { display: flex; align-items: center; gap: var(--g4); padding: var(--g5) var(--gutter) var(--g4); min-height: var(--h-top); flex: none; }
.top h1 { font-size: var(--fs-h1); line-height: 1.1; margin: 0; font-weight: 700; flex: 1; letter-spacing: -.02em; }
.scroll { overflow: auto; min-height: 0; flex: 1; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.pad { padding: 0 var(--gutter) var(--g12); }
.mark { font-family: var(--f-mark); letter-spacing: .18em; font-weight: 400; font-size: var(--fs-mark); line-height: 1; white-space: nowrap; }

.iconbtn { width: var(--h-icon); height: var(--h-icon); border-radius: var(--r-pill); display: grid; place-items: center; flex: none; transition: transform var(--t-fast) var(--e-spring), background var(--t-fast); }
.iconbtn:active { transform: scale(var(--press-icon)); background: var(--fill); }
.pill { height: var(--h-pill); padding: 0 var(--g7); border-radius: var(--r-pill); background: var(--fill); font-size: var(--fs-m); font-weight: 600; display: inline-flex; align-items: center; gap: var(--g3); white-space: nowrap; flex: none; transition: transform var(--t-fast) var(--e-spring); }
.pill:active { transform: scale(var(--press)); }
.pill.tint { background: var(--tint); color: var(--on-tint); }
.pill.icon { width: var(--h-icon); height: var(--h-icon); padding: 0; justify-content: center; }
.btn { min-height: var(--h-btn); border-radius: var(--r-btn); background: var(--fill); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: var(--g4); width: 100%; padding: 0 var(--g6); text-align: center; transition: transform var(--t-fast) var(--e-spring), background var(--t-fast); }
.btn:active { transform: scale(var(--press-soft)); }
.btn.tint { background: var(--tint); color: var(--on-tint); }
.btn.red { color: var(--red); }
.btn.danger { background: var(--red); color: var(--on-tint); }
.btn[disabled] { opacity: .4; pointer-events: none; }

.group { background: var(--cell); border-radius: var(--r-card); overflow: hidden; margin: 0 0 var(--g10); }
.ghead { font-size: var(--fs-sm); color: var(--l2); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 var(--g3) var(--gutter); }
.row { display: flex; align-items: center; gap: var(--g6); padding: var(--g5) var(--gutter); min-height: var(--h-row); width: 100%; text-align: left; position: relative; }
.iwrap + .iwrap > .row::before, .row + .row::before, .row + .slides + .row::before { content: ""; position: absolute; top: 0; left: calc(var(--gutter) + var(--w-kind) + var(--g6)); right: 0; border-top: var(--line) solid var(--sep); }
.row .main { flex: 1; min-width: 0; text-align: left; }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s, .s { font-size: var(--fs-sub); color: var(--l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s.wrap { white-space: normal; }
.row .kind { width: var(--w-kind); height: var(--w-kind); border-radius: var(--r-kind); display: grid; place-items: center; background: var(--fill); color: var(--tint-text); flex: none; }
.row .kind .ico { width: var(--i-s); height: var(--i-s); }
.row.open { background: var(--fill); }
.row[disabled] { opacity: .45; pointer-events: none; }
.tag { font-size: var(--fs-s); font-weight: 600; padding: var(--g1) var(--g4); border-radius: var(--r-pill); flex: none; }
.tag.live { background: var(--live); color: var(--on-tint); }
.tag.pre { background: var(--fill2); color: var(--tint-text); }
.chev { color: var(--l3); flex: none; }

.seg { display: flex; background: var(--fill); border-radius: var(--r-seg); padding: var(--g1); gap: var(--g1); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1; min-height: var(--h-seg); border-radius: var(--r-seg-in); font-size: var(--fs-sub); font-weight: 500; padding: 0 var(--g5); white-space: nowrap; transition: background var(--t-fast); }
.seg button[aria-pressed="true"] { background: var(--cell); box-shadow: var(--shadow-seg); }
.search { display: flex; align-items: center; gap: var(--g4); background: var(--fill); border-radius: var(--r-field); padding: 0 var(--g5); height: var(--h-search); margin: 0 0 var(--g5); }
.search input { flex: 1; border: 0; background: none; outline: none; min-width: 0; font-size: var(--fs-body); }
.search .ico { color: var(--l2); width: var(--i-search); height: var(--i-search); }

.switch { width: var(--w-switch); height: var(--h-switch); border-radius: var(--r-pill); background: var(--fill2); position: relative; flex: none; transition: background var(--t-mid) var(--e-out); }
.switch::after { content: ""; position: absolute; top: var(--g1); left: var(--g1); width: var(--w-knob); height: var(--w-knob); border-radius: var(--r-pill); background: var(--knob); box-shadow: var(--shadow-knob); transition: transform var(--t-mid) var(--e-spring); }
.switch[aria-checked="true"] { background: var(--tint); }
.switch[aria-checked="true"]::after { transform: translateX(var(--knob-move)); }
.stepper { display: flex; background: var(--fill); border-radius: var(--r-seg); flex: none; }
.stepper button { width: var(--w-step); height: var(--h-step); font-size: var(--fs-h2); }
.stepper span { min-width: var(--h-step); display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: var(--fs-m); }
.swatches { display: flex; gap: var(--g4); flex: none; }
.sw { width: var(--w-sw); height: var(--w-sw); border-radius: var(--r-pill); border: var(--line) solid var(--sep); }
.sw[aria-pressed="true"] { outline: var(--ring) solid var(--tint); outline-offset: var(--ring); }
.sw.black { background: var(--sw-black); } .sw.navy { background: var(--sw-navy); } .sw.warm { background: var(--sw-warm); } .sw.green { background: var(--sw-green); }
.sw.white { background: var(--sw-white); } .sw.paper { background: var(--sw-paper); } .sw.gold { background: var(--sw-gold); }

/* Слайд: пропорции вывода 16:9, размер текста — доля ширины */
.slide { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: var(--r-slide); overflow: hidden; background: var(--sl-bg, var(--slide-bg)) center / cover no-repeat;
         color: var(--sl-ink, var(--slide-ink)); container-type: inline-size; display: grid; place-items: center; font-family: var(--f-slide); }
.slide img, .slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.slide.cover img { object-fit: cover; }
.slide .txt { padding: 4cqw 5cqw; text-align: center; white-space: pre-line; line-height: 1.2; font-size: calc(var(--fs, 8) * .5625cqw); max-width: 100%; overflow-wrap: break-word; }
.slide.shadow .txt, .slide.shadow .sc { text-shadow: 0 .3cqw 1.2cqw var(--slide-shadow); }
.slide.outline .txt, .slide.outline .sc { -webkit-text-stroke: .15cqw var(--slide-stroke); paint-order: stroke fill; }
.slide.caps .txt, .slide.caps .sc { text-transform: uppercase; }
.slide .sc { padding: 5cqw; display: flex; flex-direction: column; gap: 2cqw; text-align: center; font-size: calc(var(--fs, 8) * .36cqw); line-height: 1.25; width: 100%; }
.slide .sc.side { flex-direction: row; text-align: left; }
.slide .sc.side > div { flex: 1; }
.slide .sc .r { font-size: .7em; opacity: .75; }
.slide .mk { font-family: var(--f-mark); letter-spacing: .18em; font-size: 7cqw; color: var(--slide-ink); }
.slide .num { position: absolute; left: var(--g3); top: var(--g2); font-size: var(--fs-tab); color: var(--slide-num); font-weight: 600; font-family: var(--f-ui); z-index: 1; }
.slide .vid { position: absolute; right: 3cqw; bottom: 3cqw; font-size: 4cqw; font-family: var(--f-ui); color: var(--slide-num); }
.slide .glyph { width: 22%; aspect-ratio: 9 / 19; border-radius: 2.4cqw; background: var(--slide-glyph); border: .6cqw solid var(--slide-glyph-frame); display: flex; flex-direction: column; gap: 1cqw; padding: 2cqw 1.6cqw; }
.slide .glyph i { display: block; height: 1.4cqw; border-radius: 1cqw; background: var(--slide-glyph-line); }
.slide .glyph b { display: block; flex: 1; border-radius: 1cqw; background: var(--slide-mark); opacity: .7; }
.slide .empty { font-family: var(--f-ui); font-size: 5cqw; color: var(--slide-num); }

.mons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g5); padding: 0 var(--gutter) var(--g6); }
.mon { display: flex; flex-direction: column; gap: var(--g3); min-width: 0; }
.mons { transition: grid-template-columns var(--t-slow) var(--e-out); }
.mons.pre-empty { grid-template-columns: 1fr var(--empty-pre); }
.mons.pre-empty .go { display: none; } /* пустому предпросмотру нечего отправлять в зал */
/* Строка сетлиста: в зале — красная полоска слева и подпись, в предпросмотре — акцентом. */
.row.m-live { box-shadow: inset var(--w-mark) 0 0 var(--live); }
.row.m-live .s { color: var(--live); font-weight: 500; }
.row.m-pre { box-shadow: inset var(--w-mark) 0 0 var(--tint); }
.row.m-pre .s { color: var(--tint-text); font-weight: 500; }
/* На широком экране сетлист и библиотека не растягиваются шире удобного для чтения. */
#main .pad { max-width: var(--w-list); margin-inline: auto; width: 100%; box-sizing: border-box; }
.mon .lbl { display: flex; align-items: center; gap: var(--g3); font-size: var(--fs-sm); color: var(--l2); font-weight: 600; min-height: var(--h-go); }
.mon .lbl .dot { width: var(--w-dot); height: var(--w-dot); border-radius: var(--r-pill); background: var(--live); }
.mon .slide { touch-action: none; cursor: pointer; transition: transform var(--t-fast) var(--e-spring); }
.mon .slide:active { transform: scale(.98); }
.mon.now .slide { outline: var(--ring) solid var(--live); outline-offset: var(--ring); }
.mon.pre .slide { outline: var(--ring) dashed var(--l3); outline-offset: var(--ring); }
.mon .hint { font-size: var(--fs-s); color: var(--l2); min-height: var(--gutter); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mon .go { margin-left: auto; height: var(--h-go); padding: 0 var(--g5); font-size: var(--fs-sm); border-radius: var(--r-pill); background: var(--tint); color: var(--on-tint); font-weight: 600; }
.mon .go[disabled] { opacity: .35; pointer-events: none; }
.changed { color: var(--tint-text); }
.progress { font-size: var(--fs-sm); color: var(--tint-text); padding: 0 var(--gutter) var(--g6); margin-top: calc(-1 * var(--g3)); }

.slides { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--g5); padding: var(--g2) var(--gutter) var(--g7); }
.slides > div { cursor: pointer; transition: transform var(--t-fast) var(--e-spring); min-width: 0; }
.slides > div:active { transform: scale(var(--press-soft)); }
.slides .slide.is-live { outline: var(--ring) solid var(--live); outline-offset: var(--ring); }
.slides .slide.is-pre { outline: var(--ring) dashed var(--tint); outline-offset: var(--ring); }

.devs { display: flex; align-items: center; gap: var(--g1); margin-left: auto; min-width: 0; overflow: hidden; }
.dev { position: relative; width: var(--h-dev); height: var(--h-dev); display: grid; place-items: center; border-radius: var(--r-pill); color: var(--ink); flex: none; }
.dev.offline, .dev.pin { color: var(--l3); }
/* Экран на связи — значок акцентом в мягком круге; пока идёт показ — красная точка «в эфире». Тема пульта не меняется. */
.dev { transition: background var(--t-mid) var(--e-out), color var(--t-mid) var(--e-out); }
.dev.online, .dev.sync { background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint-text); }
.dev.onair::after { content: ""; position: absolute; top: 5px; right: 5px; width: var(--w-dot); height: var(--w-dot); border-radius: var(--r-pill); background: var(--live); border: var(--ring) solid var(--bg); }
.dev.sync::before, .dev.connecting::before { content: ""; position: absolute; inset: 3px; border-radius: var(--r-pill); border: var(--ring) solid var(--tint); border-right-color: transparent; animation: spin var(--t-spin) linear infinite; }
.dev.error::after { content: ""; position: absolute; top: 5px; right: 5px; width: var(--w-dot); height: var(--w-dot); border-radius: var(--r-pill); background: var(--red); border: var(--ring) solid var(--bg); }
.dev .n { position: absolute; bottom: var(--g1); right: 0; font-size: var(--fs-xs); font-weight: 700; background: var(--ink); color: var(--bg); border-radius: var(--r-pill); padding: 0 var(--g2); line-height: var(--w-badge); }
@keyframes spin { to { transform: rotate(360deg); } }
.setpick { display: flex; align-items: center; gap: var(--g2); font-weight: 700; font-size: var(--fs-body); min-height: var(--h-row); min-width: 0; max-width: 100%; padding: 0 var(--g2) var(--g3); }
.setpick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.show { display: flex; flex-direction: column; min-height: 0; flex: 1; }
/* Главный экран: окна показа сверху, под ними сетлист и панель тем, внизу кнопки. Планшет и окно шире —
   окна и кнопки слева колонкой, сетлист справа (ShowScreen.kt). */
.showgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "mons" "body" "bar"; }
.showgrid > .monsbox { grid-area: mons; min-height: 0; }
.showgrid > .body { grid-area: body; min-height: 0; display: flex; flex-direction: column; }
.showgrid > .bar, .showgrid > .vbar { grid-area: bar; }
@media (min-width: 700px) {
  .showgrid { grid-template-columns: minmax(0, min(42%, var(--w-left))) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "mons body" "bar body"; }
  .showgrid > .monsbox { overflow: auto; border-right: var(--line) solid var(--sep); }
  .showgrid > .body { border-left: 0; }
  .showgrid .mons, .showgrid .mons.pre-empty { grid-template-columns: minmax(0, 1fr); gap: var(--g6); padding-top: var(--g2); }
  .showgrid > .bar, .showgrid > .vbar { border-right: var(--line) solid var(--sep); }
}
.lhead { display: flex; align-items: center; gap: var(--g2); padding: 0 var(--g4) var(--g5) var(--gutter); flex: none; }
.lhead .seg { flex: 1; }
.setrow { flex: 1; min-height: 0; display: flex; }
.setrow > .scroll { flex: 1; }

/* Панель тем: узкая полоса справа от сетлиста, сетка на всё место или значок в строке сетлиста */
.tstrip { width: var(--w-strip); flex: none; background: var(--cell); display: flex; flex-direction: column; align-items: stretch; min-height: 0; }
.tstrip .tbtns { display: flex; flex-direction: column; align-items: center; flex: none; }
.tstrip .scroll { padding: 0 var(--g2) var(--gutter); display: flex; flex-direction: column; gap: var(--g3); }
.tgrid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tgrid .gh { display: flex; align-items: center; padding: 0 var(--g4) var(--g3) var(--gutter); font-weight: 700; }
.tgrid .gh span { flex: 1; }
.tgrid .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--g5); padding: 0 var(--gutter); }
.ttile { display: flex; flex-direction: column; align-items: center; gap: var(--g1); cursor: pointer; touch-action: pan-y; -webkit-touch-callout: none; transition: transform var(--t-fast) var(--e-spring); }
.ttile:active { transform: scale(var(--press)); }
.ttile .slide { border-radius: var(--r-kind); }
.ttile .slide .txt { padding: 0; }
.ttile .nm { font-size: var(--fs-tab); color: var(--l2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttile.on .slide { outline: var(--ring) dashed var(--tint); outline-offset: var(--ring); }
.ttile.on .nm { color: var(--tint-text); font-weight: 600; }
.ttile.lifted { opacity: .4; }
.ghost { position: fixed; width: var(--w-ghost); z-index: 45; pointer-events: none; opacity: var(--ghost-alpha); transform: translate(-50%, -70%); }
[data-drop].drop-on { outline: var(--ring) solid var(--tint) !important; outline-offset: calc(-1 * var(--ring)); border-radius: var(--r-slide); }
body.dragging, body.dragging * { cursor: grabbing !important; }

/* Песня, текст, Писание в сетлисте — строками: номер, подпись, текст */
.trows { display: grid; gap: var(--g3); padding: var(--g2) var(--gutter) var(--g7); background: var(--fill); }
.trow { display: flex; gap: var(--g4); padding: var(--g4); border-radius: var(--r-slide); background: var(--cell); cursor: pointer; text-align: left; width: 100%; transition: transform var(--t-fast) var(--e-spring); }
.trow:active { transform: scale(var(--press-soft)); }
.trow .n { width: var(--w-num); flex: none; font-size: var(--fs-sm); font-weight: 600; color: var(--l2); font-variant-numeric: tabular-nums; }
.trow .tx { flex: 1; min-width: 0; font-size: var(--fs-sub); white-space: pre-line; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.trow .lb { display: block; font-size: var(--fs-tab); font-weight: 600; color: var(--tint-text); }
.trow.is-live { outline: var(--ring) solid var(--live); outline-offset: calc(-1 * var(--ring)); }
.trow.is-live .n { color: var(--live); }
.trow.is-pre { outline: var(--ring) solid var(--tint); outline-offset: calc(-1 * var(--ring)); }
.trow.is-pre .n { color: var(--tint); }
.slides.c3 { grid-template-columns: repeat(3, 1fr); }
/* Файл на экранах: значок в строке библиотеки и сетлиста */
.fbadge { display: inline-flex; align-items: center; gap: var(--g2); font-size: var(--fs-s); font-weight: 600; color: var(--tint-text); flex: none; white-space: nowrap; }
.fbadge.todo { color: var(--l2); padding: var(--g2); border-radius: var(--r-pill); }
.fbadge.todo:active { background: var(--fill); }
.fbadge .ico { width: var(--i-s); height: var(--i-s); }
.lthumb { width: var(--w-kind); height: var(--w-kind); border-radius: var(--r-kind); overflow: hidden; flex: none; background: var(--fill); }
.lthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--g2); background: var(--scrim-strong); color: var(--on-tint); font-size: var(--fs-sm); font-weight: 600; border-radius: var(--r-slide); }
.loading::before { content: ""; width: var(--g12); height: var(--g12); border-radius: var(--r-pill); border: var(--ring) solid var(--tint); border-right-color: transparent; animation: spin var(--t-spin) linear infinite; }
.mon .wrapnow { position: relative; }
.preview-sheet { margin-bottom: var(--g6); }
.edslide { background: var(--cell); border-radius: var(--r-card); padding: var(--g5); display: grid; gap: var(--g4); }
.edslide .hd { display: flex; align-items: center; gap: var(--g3); }
.edslide .hd b { font-size: var(--fs-sm); color: var(--l2); min-width: var(--w-num); }
.edslide .hd input { flex: 1; min-width: 0; border: 0; background: var(--fill); border-radius: var(--r-field); padding: var(--g3) var(--g5); outline: none; font-size: var(--fs-sub); }
.edslide textarea { width: 100%; min-height: 84px; border: 0; background: var(--fill); border-radius: var(--r-field); padding: var(--g4) var(--g5); outline: none; resize: vertical; font-size: var(--fs-m); }
.edslide .acts { display: flex; gap: var(--g2); flex-wrap: wrap; }
.edslide .acts .pill { height: var(--h-seg); font-size: var(--fs-sm); padding: 0 var(--g5); }
.trow .tx.empty { color: var(--l3); }

.bar { display: flex; gap: var(--g3); padding: var(--g4) var(--g6); background: var(--cell); border-top: var(--line) solid var(--sep); flex: none; }
.bar button { flex: 1; min-width: 0; height: var(--h-key); border-radius: var(--r-btn); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--g1); font-size: var(--fs-s); font-weight: 600; background: var(--fill); transition: transform var(--t-fast) var(--e-spring), background var(--t-fast); white-space: nowrap; }
.bar.keys button .ico { width: var(--i-key); height: var(--i-key); }
.bar button.on-layers { color: var(--tint-text); }
.bar button:active { transform: scale(var(--press-bar)); }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.bar button.wide { flex: 2; }
.bar .ico { width: var(--i-bar); height: var(--i-bar); }
.vbar { display: flex; flex-direction: column; gap: var(--g3); padding: var(--g4) var(--g6); background: var(--cell); border-top: var(--line) solid var(--sep); flex: none; }
.vbar .bar { padding: 0; border: 0; background: none; }
.vrow { display: flex; align-items: center; gap: var(--g5); font-size: var(--fs-sm); color: var(--l2); font-variant-numeric: tabular-nums; }
.vrow input[type=range] { flex: 1; accent-color: var(--tint); min-width: 0; }

/* Шторки */
.backdrop { position: fixed; inset: 0; background: var(--scrim); opacity: 0; transition: opacity var(--t-mid) var(--e-out); z-index: 20; }
.backdrop.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: var(--sheet-max); background: var(--bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; z-index: 21;
         display: flex; flex-direction: column; transform: translateY(100%); transition: transform var(--t-slow) var(--e-out); }
.sheet.on { transform: none; }
.sheet.closing { transition: transform var(--t-mid) var(--e-in); }
.sheet .grab { padding: var(--g4) 0 var(--g2); touch-action: none; cursor: grab; }
.sheet .grab i { display: block; width: var(--w-grab); height: var(--h-grab); border-radius: var(--r-pill); background: var(--l3); margin: 0 auto; }
.sheet .sh { display: flex; align-items: center; padding: var(--g2) var(--gutter) var(--g6); gap: var(--g4); }
.sheet .sh h2 { flex: 1; margin: 0; font-size: var(--fs-h2); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .sb { overflow: auto; padding: 0 var(--gutter) var(--g10); }
textarea.big { width: 100%; min-height: 150px; border: 0; border-radius: var(--r-card); background: var(--cell); padding: var(--g6) var(--g7); resize: vertical; outline: none; }
.field { width: 100%; height: var(--h-btn); border: 0; border-radius: var(--r-card); background: var(--cell); padding: 0 var(--g7); outline: none; font-size: var(--fs-body); }
.field::placeholder, textarea::placeholder { color: var(--l3); }
.code { font-size: var(--fs-code); letter-spacing: .2em; text-align: center; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: var(--g5); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g5); }
.note { font-size: var(--fs-sub); color: var(--l2); margin: var(--g3) var(--g2) var(--gutter); line-height: 1.35; }
.note.tight { margin: 0 var(--g2); }
.gap { height: var(--g6); }
.chips { display: flex; gap: var(--g4); overflow-x: auto; padding-bottom: var(--g5); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.crumbs { display: flex; gap: var(--g4); padding-bottom: var(--g5); flex-wrap: wrap; }
.grid { display: grid; gap: var(--g4); }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }
.grid.c6 { grid-template-columns: repeat(6, 1fr); }
.gcell { min-height: var(--h-num); border-radius: var(--r-field); background: var(--cell); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: var(--g3) var(--g4); text-align: left; min-width: 0; }
.gcell b { font-size: var(--fs-m); font-weight: 600; }
.gcell span { font-size: var(--fs-s); color: var(--l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gcell.num { align-items: center; font-size: var(--fs-body); font-weight: 500; font-variant-numeric: tabular-nums; }
.gcell.on { background: var(--tint); color: var(--on-tint); }
.gcell.on span { color: var(--on-tint); }
.gcell[disabled] { color: var(--l3); cursor: default; }
.verses { padding: var(--g6) var(--gutter); display: grid; gap: var(--g2); font-size: var(--fs-sub); user-select: text; }
.verses b { color: var(--tint-text); font-weight: 600; margin-right: var(--g2); }

/* Полный просмотр и зритель */
.full { position: fixed; inset: 0; background: var(--full-bg); z-index: 30; display: flex; flex-direction: column; opacity: 0; transform: translateY(var(--g12)) scale(.98);
        transition: opacity var(--t-slow) var(--e-out), transform var(--t-slow) var(--e-out); color: var(--full-ink); }
.full.on { opacity: 1; transform: none; }
.full .ft { display: flex; align-items: center; gap: var(--g4); padding: var(--g5) var(--g6); }
.full .ft .ttl { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.full .stage { flex: 1; display: grid; place-items: center; padding: var(--g4) var(--g6); min-height: 0; touch-action: none; }
.full .stage .slide { border-radius: var(--r-full); }
.full .stage iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; background: var(--full-bg); }
.full .fb { display: flex; gap: var(--g4); padding: var(--g5) var(--g6) var(--g6); }
.full .fb .btn { background: var(--full-btn); color: var(--full-ink); }
.full .fb .btn.tint { background: var(--full-tint); }
.full .cnt { font-size: var(--fs-sub); opacity: .7; font-variant-numeric: tabular-nums; }
.full .iconbtn { color: var(--full-ink); }
.full .iconbtn:active { background: var(--full-press); }
.full .tag.live { background: var(--full-live); }
.full .note { color: var(--full-dim); text-align: center; }

.toasts { position: fixed; top: var(--g5); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: var(--g3); z-index: 40; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: var(--g5) var(--gutter); border-radius: var(--r-pill); font-size: var(--fs-m); font-weight: 500; box-shadow: var(--shadow-toast);
         max-width: calc(100% - 2 * var(--gutter)); text-align: center; }
@keyframes tin { from { opacity: 0; transform: translateY(calc(-1 * var(--g6))) scale(var(--pop-from)); } }
.toast { animation: tin var(--t-slow) var(--e-spring); }
.toast.out { opacity: 0; transform: scale(var(--pop-from)); transition: opacity var(--t-mid) var(--e-in), transform var(--t-mid) var(--e-in); }

/* Движение (DESIGN.md → «Движение интерфейса»): страницы вкладок въезжают со стороны листания, слайд в окнах
   показа перетекает, раскрытый элемент разворачивается, выбранная вкладка чуть подпрыгивает. */
@keyframes pageR { from { opacity: 0; transform: translateX(var(--page-shift)); } }
@keyframes pageL { from { opacity: 0; transform: translateX(calc(-1 * var(--page-shift))); } }
@keyframes swap { from { opacity: var(--swap-from); transform: scale(var(--swap-scale)); } }
@keyframes grow { from { opacity: 0; transform: translateY(calc(-1 * var(--g4))); } }
@keyframes lift { 50% { transform: scale(var(--tab-lift)); } }
@keyframes slideR { from { opacity: var(--swap-from); transform: translateX(var(--g12)); } }
@keyframes slideL { from { opacity: var(--swap-from); transform: translateX(calc(-1 * var(--g12))); } }
#main.in-r { animation: pageR var(--t-slow) var(--e-out); }
#main.in-l { animation: pageL var(--t-slow) var(--e-out); }
#main.dragging { transition: none; }
/* Списки прокручиваются только вверх-вниз: смахивание вбок остаётся странице (листание вкладок). */
#main .scroll { touch-action: pan-y; }
#main.settle { transition: transform var(--t-mid) var(--e-spring), opacity var(--t-mid) var(--e-out); }
.swap { animation: swap var(--t-mid) var(--e-out); }
.grow { animation: grow var(--t-mid) var(--e-out); transform-origin: top; }
.tab.lift .ico { animation: lift var(--t-mid) var(--e-spring); }
.tab .ico, .tab span { transition: color var(--t-mid) var(--e-out); }
.full .stage .in-r { animation: slideR var(--t-mid) var(--e-out); }
.full .stage .in-l { animation: slideL var(--t-mid) var(--e-out); }
.row, .trow, .gcell, .ttile { transition: background var(--t-fast) var(--e-out), transform var(--t-fast) var(--e-spring); }
button.row:active, .row:has(> button.main:active) { background: var(--fill); }
.sheet.drag { transition: none; }
.sheet.back { transition: transform var(--t-mid) var(--e-spring); }
.chev .ico { transition: transform var(--t-mid) var(--e-out); }

.hero { display: grid; gap: var(--g5); margin: var(--g2) 0 var(--g10); }
.hero .btn { height: var(--h-hero); font-size: var(--fs-big); }
.qr { width: var(--w-qr); height: var(--w-qr); background: var(--qr-bg); border-radius: var(--r-qr); padding: var(--g4); flex: none; }
.qr svg { width: 100%; height: 100%; }
.room { display: flex; gap: var(--gutter); align-items: center; padding: var(--gutter); }
.room .big { font-size: var(--fs-room); font-weight: 700; font-variant-numeric: tabular-nums; }
.mono { font-size: var(--fs-sm); word-break: break-all; white-space: normal; }

/* Системные окна Android: разрешение на трансляцию, плашка трансляции, проигрыватель, режим экрана */
#notify { position: relative; z-index: 18; display: none; align-items: center; gap: var(--g4); background: var(--notify); color: var(--on-tint); font-size: var(--fs-sm); padding: var(--g4) var(--g6); }
#notify.on { display: flex; }
#notify .dot { width: var(--w-dot); height: var(--w-dot); border-radius: 50%; background: var(--red); }
#notify button { margin-left: auto; color: var(--on-tint); font-weight: 700; font-size: var(--fs-sm); }
#player { position: fixed; inset: 0; background: var(--full-bg); z-index: 15; display: none; flex-direction: column; }
#player.on { display: flex; }
#player video { flex: 1; width: 100%; min-height: 0; object-fit: contain; }
#player .ptitle { color: var(--full-ink); font-size: var(--fs-sub); padding: var(--g6) var(--gutter); }
#player .pclose { color: var(--full-ink); font-size: var(--fs-m); font-weight: 600; padding: var(--g7); }
.dialogwrap { position: fixed; inset: 0; background: var(--scrim-strong); display: none; align-items: center; justify-content: center; padding: var(--g12); z-index: 35; }
.dialogwrap.on { display: flex; }
.dialog { background: var(--bg); border-radius: var(--r-dialog); padding: var(--gutter); width: var(--dialog-w); max-width: 100%; }
.dialog h2 { margin: 0; font-size: var(--fs-h2); font-weight: 700; }
#screenMode { position: fixed; inset: 0; background: var(--full-bg); color: var(--full-ink); z-index: 25; display: none; flex-direction: column; align-items: center; justify-content: center;
              text-align: center; padding: var(--g12); gap: var(--g7); }
#screenMode.on { display: flex; }
#screenMode .big { font-family: var(--f-mark); font-size: var(--fs-screen-mark); letter-spacing: .18em; }
#screenMode .pin { font-family: var(--f-slide); font-size: var(--fs-pin); letter-spacing: .3em; }
#screenMode .dim { color: var(--full-dim); font-size: var(--fs-sm); }
#screenMode .qr { width: 120px; height: 120px; }
#screenMode .back { position: absolute; bottom: var(--g10); left: 50%; transform: translateX(-50%); color: var(--full-ink); opacity: .75; font-size: var(--fs-sub);
                    border: 1px solid var(--full-line); border-radius: var(--r-pill); padding: var(--g4) var(--gutter); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-property: opacity !important; }
  .sheet { transform: none; opacity: 0; } .sheet.on { opacity: 1; }
  .full { transform: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="notify"><span class="dot"></span><span>Экран транслируется</span><button data-act="mirrorstop">Остановить</button></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="player"><div class="ptitle" id="ptitle"></div><video id="pvideo" playsinline muted loop></video><button class="pclose" data-act="pclose">Закрыть проигрыватель</button></div>
<div class="dialogwrap" id="syscap"><div class="dialog"><h2>Начать запись или трансляцию через Deixis?</h2>
  <p class="note">Deixis получит доступ ко всему, что видно на экране телефона, пока идёт трансляция.</p>
  <div class="two"><button class="btn" data-act="capno">Отмена</button><button class="btn tint" data-act="capyes">Начать</button></div></div></div>
<div id="screenMode"></div>
<input type="file" id="pickDevice" class="hidden">

<script>
// ——— Демо-экраны (hub.js): в этом окне или, если страница вложена, в окне выше ———
function findHub() {
  let w = window;
  for (let i = 0; i < 4; i++) {
    try { if (w.DeixisDemo) return w.DeixisDemo; } catch (e) { return null; }
    if (w.parent === w) return null;

  return null;
}

// Передача файла: проценты, как в Controller.upload. Пока файл идёт, в зале остаётся прежний слайд.
function transfer(name, size, devs) {
  devs.forEach((d) => { if (d.state === "online") d.state = "sync"; });
  return new Promise((done) => {
    let p = 0;
    S.progress = `«${name}»: подготовка`;
    render();
    const speed = 18; // МБ/с по Wi-Fi
    const steps = Math.max(3, Math.min(20, Math.round(size / (speed * MB) * 4)));
    const t = setInterval(() => {
      p = Math.min(100, p + Math.ceil(100 / steps));
      S.progress = `«${name}»: ${p}%`;
      render();
      if (p >= 100) { clearInterval(t); S.progress = null; devs.forEach((d) => { if (d.state === "sync") d.state = "online"; }); done(); }
    }, 250);
  });
}
// Подготовка элемента для экранов: перевод PPTX и DOCX в PDF на экране, который это умеет, и передача файла.
async function prepare(it, devs) {
  if (!fileItem(it)) return true;
  const sha = it.ref().sha256;
  // Файл уже идёт в фоне («на экраны заранее»): показ ждёт его, а не начинает заново.
  if (S.transfers[sha]) await S.transfers[sha].done;
  const need = devs.filter((d) => !d.sent.has(sha));
  if (need.length) {
    await transfer(it.title, it.size, need);
    need.forEach((d) => d.sent.add(sha));
  }
  return true;
}
// Показ слайда на каждом подключённом экране.
function sendLive(devs) {
  const cue = S.live;
  if (!cue || slideOf(cue).mirror) return;
  const targets = devs || ready();
  prepare(cue.src, targets).then((ok) => {
    if (!ok || S.live !== cue) return;
    const content = contentOf(cue);
    for (const d of targets) {
      const err = d.r.show(content);
      if (err) { d.state = "error"; toast(`${d.r.info.name}: ${err}`); }
      else if (d.state === "error") d.state = "online";
      if (S.mode !== "NORMAL") d.r.mode(S.mode);
    }
    render();
  });
}
let sendSeq = 0;
async function goLive(cue, quiet) {
  const it = cue.src;
  if (it.big) return sheetLarge(it);
  if (!ready().length) { toast("Сначала подключите экран"); return false; }
  if (S.sharing) stopShare(true);
  const seq = ++sendSeq;
  // Отсчёт, снова отправленный в зал, начинается сначала.
  if (slideOf(cue).countdown && !(S.live && S.live.src === it)) S.timer = null;
  const ok = await prepare(it, ready());
  if (!ok || seq !== sendSeq) return false;
  S.live = cue;
  S.mode = "NORMAL";
  if (it.id) S.recent = [it.id, ...S.recent.filter((x) => x !== it.id)].slice(0, 8);
  if (S.pre && sameCue(S.pre, cue)) S.pre = null;
  const content = contentOf(cue);
  for (const d of ready()) {
    const err = d.r.show(content);
    if (err) { d.state = "error"; toast(`${d.r.info.name}: ${err}`); } else if (d.state === "error") d.state = "online";
  }
  if (!quiet && FULL) FULL.update();
  render();
  return true;
}
function toPreview(cue) {
  if (cue.src.big) return sheetLarge(cue.src);
  S.pre = cue; render();
}
function tapSlide(src, idx) {
  const cue = { src, idx };
  if (S.live && S.live.src === src && !S.settings.alwaysPre) goLive(cue);
  else toPreview(cue);
}
function applyDraft(scope) {
  if (!S.draft) return;
  const st = S.draft, cue = S.pre || S.live;
  if (scope === "slide" && cue) S.styles.slide[(cue.src.id || cue.src.title) + ":" + cue.idx] = st;
  else if (scope === "item" && cue && cue.src.id) S.styles.item[cue.src.id] = st;
  else if (scope === "set") S.styles.set[S.active] = st;
  else { S.style = st; S.styles.set = {}; }
  S.draft = null;
}
async function preToLive() {
  if (S.draft) { applyDraft(S.draftScope); if (!S.pre && S.live) { sendLive(); render(); toast("Оформление в зале"); return; } }
  if (S.pre) { if (await goLive(S.pre)) toast("В зале"); } else render();
}
function step(d) {
  if (S.holy.remote && S.holy.status === "on") return holyStep(d);
  const cue = S.live;
  if (!cue || slideOf(cue).mirror) return;
  const i = cue.idx + d;
  if (i < 0 || i >= cue.src.slides.length) return;
  goLive({ src: cue.src, idx: i });
}
// «Чёрный», «Логотип», «Уйти с экранов»; повторное нажатие возвращает показ. Своя картинка «Логотипа» — вместе с режимом.
function setMode(m) {
  if (!ready().length) return toast("Сначала подключите экран");
  const back = S.mode === m;
  S.mode = back ? "NORMAL" : m;
  for (const d of ready()) d.r.mode(S.mode, S.settings.logoImage || null);
  if (m === "AWAY") toast(back ? "Deixis снова на экранах" : "Deixis ушёл с экранов: любой показ вернёт его");
  render();
}
function video(action, arg) {
  const v = rxVideo();
  if (!v) return;
  for (const d of ready()) {
    if (!d.r.state.video) continue;
    if (action === "SEEK") d.r.video("SEEK", arg);
    else if (action === "LOOP") d.r.video("LOOP", null, !v.loop);
    else if (action === "VOLUME") d.r.video("VOLUME", null, null, arg);
    else d.r.video(action);
  }
  if (action === "LOOP") toast(v.loop ? "Повтор выключен" : "Повтор включён");

function splitText(t) {
  const out = [];
  for (const block of t.replace(/\r\n/g, "\n").split(/\n\s*\n/)) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i += 4) out.push(lines.slice(i, i + 4).join("\n"));
  }
  return out;
}

// ——— Отрисовка слайда в окнах «Сейчас», «Предпросмотр», в сетке и во весь экран ———
function slideHTML(cue, st, o = {}) {
  const num = o.num ? `<span class="num">${o.num}</span>` : "";
  const cls = o.cls || "", m = o.mode || "NORMAL";
  if (m === "BLACK") return `<div class="slide ${cls}">${num}</div>`;
  // Deixis ушёл с экранов: в окне — чёрное и знак выхода, в зале — то, что под Deixis.
  if (m === "AWAY") return `<div class="slide ${cls}"><span class="empty">${ico("away")}</span>${num}</div>`;
  const pic = S.settings.logoImage && hub.files[S.settings.logoImage.sha256];
  if (m === "LOGO" && pic) return `<div class="slide ${cls}"><img src="${esc(pic.url)}" alt="">${num}</div>`;
  if (m === "LOGO") return `<div class="slide ${cls}"><div class="mk">ΔΕΙΞΙΣ</div>${num}</div>`;
  const sl = slideOf(cue);
  if (!sl) return `<div class="slide ${cls}">${o.empty ? `<span class="empty">${esc(o.empty)}</span>` : ""}${num}</div>`;
  const it = cue.src;
  if (sl.mirror) return `<div class="slide ${cls}"><div class="glyph"><i></i><i style="width:60%"></i><b></b><i></i><i style="width:70%"></i></div>${num}</div>`;
  if (sl.page != null) {
    const f = hubFile(it), u = f && f.pages && f.pages[sl.page];
    return `<div class="slide ${cls}">${u && m !== "CLEAR" ? `<img src="${esc(u)}" alt="">` : ""}${num}</div>`;
  }
  if (sl.image) {
    const f = hubFile(it);
    return `<div class="slide ${cls}">${f && m !== "CLEAR" ? `<img src="${esc(f.url)}" alt="">` : ""}${num}</div>`;
  }
  if (sl.video) {
    const f = hubFile(it);
    const v = o.live ? rxVideo() : null;
    return `<div class="slide ${cls}">${f && m !== "CLEAR" ? `<video src="${esc(f.url)}#t=0.5" muted playsinline preload="metadata"></video>` : ""}
      ${it.big ? `<span class="empty">${esc(sizeText(it.size))}</span>` : ""}<span class="vid">${v ? fmt(v.positionMs) : fmt(it.durationMs)}</span>${num}</div>`;
  }
  if (sl.countdown) {
    const run = S.timer && S.timer.itemKey === cdKey(it) ? S.timer : null;
    const face = m === "CLEAR" ? "" : cdFace(sl.countdown, run);
    const lbl = sl.countdown.label && m !== "CLEAR" ? `<div class="r">${esc(sl.countdown.label)}</div>` : "";
    return `<div class="slide ${cls}" style="--sl-bg:${argbCss(st.background ?? 0xFF000000)};--sl-ink:${argbCss(sl.countdown.color ?? st.color ?? 0xFFFFFFFF)}">
      <div class="sc" style="font-size:9cqw;gap:0">${sl.countdown.labelPosition === "BELOW" ? "" : lbl}<div data-cd="${esc(cdKey(it))}" style="font-variant-numeric:tabular-nums;font-size:${(sl.countdown.sizePercent || 34) / 2.6}cqw">${esc(face)}</div>${sl.countdown.labelPosition === "BELOW" ? lbl : ""}</div>${num}</div>`;
  }
  const bgImg = st.backgroundImage && hub.files[st.backgroundImage.sha256];
  const vars = `--fs:${(st.sizePercent || 20) / 2.5};--sl-bg:${argbCss(st.background ?? 0xFF000000)};--sl-ink:${argbCss(st.color ?? 0xFFFFFFFF)};${bgImg ? `background-image:url('${esc(bgImg.url)}');` : ""}`;
  const c = ["slide", st.shadow !== false ? "shadow" : "", st.outline ? "outline" : "", S.settings.caps ? "caps" : "", cls].join(" ");
  let inner = "";
  const sp = st.sizePercent || 20;
  // Плашка под текстом, выравнивание и положение — как в теме (Holyrics, «Нижняя треть»).
  const place = `${st.box ? `background:${argbCss(st.box)};border-radius:1cqw;` : ""}${st.align === "LEFT" ? "text-align:left;justify-self:start;" : st.align === "RIGHT" ? "text-align:right;justify-self:end;" : ""}${st.valign === "BOTTOM" ? "align-self:end;" : st.valign === "TOP" ? "align-self:start;" : ""}`;
  if (m !== "CLEAR" && sl.text != null) inner = `<div class="txt" data-sp="${sp}" style="${place}">${esc(sl.text)}</div>`;
  if (m !== "CLEAR" && sl.scripture) {
    const sc = sl.scripture, top = sc.refPosition === "TOP";
    const blocks = sc.blocks.map((b) => `<div>${esc(b.text)}${b.ref ? `<div class="r">${esc(b.ref)}</div>` : ""}</div>`).join("");
    const ref = sc.ref ? `<div class="r">${esc(sc.ref)}</div>` : "";
    inner = `<div class="sc ${sc.sideBySide ? "side" : ""}" data-sp="${sp}">${top ? ref : ""}${sc.sideBySide ? `<div style="display:flex;gap:3cqw">${blocks}</div>` : blocks}${top ? "" : ref}</div>`;
  }
  return `<div class="${c}" style="${vars}">${inner}${num}</div>`;
}

// Текст подбирается, как в зале: самый крупный, что помещается, но не больше доли высоты из оформления.
function fitSlides(root) {
  (root || document).querySelectorAll(".slide .txt, .slide .sc").forEach((el) => {
    const sl = el.closest(".slide"), W = sl.clientWidth, H = sl.clientHeight;
    if (!W) return;
    let size = H * Number(el.dataset.sp || 20) / 100;
    el.style.fontSize = size + "px";
    for (let i = 0; i < 16 && (el.scrollHeight > H * 0.94 || el.scrollWidth > W); i++) { size *= 0.88; el.style.fontSize = size + "px"; }
  });
}

// Устройства
function qrSvg(text) {
  const q0 = qrLib();
  if (!q0) return "";
  const q = q0(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount();
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR-код"><path d="${d}" fill="var(--qr-ink)"/></svg>`;
}

// Общий рендер с сохранением прокрутки
function render() {
  // Пока тема в пальце, экран не перерисовывается: иначе пропадёт то, на что её несут.
  if (DRAG) { renderLater = true; return; }
  const keep = {};
  document.querySelectorAll("#main [data-key]").forEach((el) => (keep[el.dataset.key] = [el.scrollTop, el.scrollLeft]));
  const th = S.settings.theme;
  const dark = S.settings.darkLive && S.live && ready().length && (th === "light" || th === "paper" || th === "auto");
  if (dark) document.documentElement.dataset.theme = "dark";
  else if (th === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = th;
  renderTabs();
  $("#main").innerHTML = { show: renderShow, library: renderLibrary, setlists: renderSetlists, devices: renderDevices }[S.tab]();
  document.querySelectorAll("#main [data-key]").forEach((el) => { const k = keep[el.dataset.key]; if (k) { el.scrollTop = k[0]; el.scrollLeft = k[1]; } });
  motion();
  const now = $('[data-g="now"]'), pre = $('[data-g="pre"]');
  if (now) gest(now, { tap: () => openFull("live"), left: () => step(1), right: () => step(-1) });
  if (pre) gest(pre, { tap: () => S.pre && openFull("pre"), up: preToLive });
  const q = $("#libq");
  if (q) q.addEventListener("input", (e) => { S.libQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#libq"); n.focus(); n.setSelectionRange(pos, pos); });
  const vr = $("#vrange");
  if (vr) {
    vr.addEventListener("input", () => { $("#vt").textContent = fmt(vr.value * 1000); });
    vr.addEventListener("change", () => video("SEEK", vr.value * 1000));
  }
  $("#notify").classList.toggle("on", S.sharing);
  fitSlides($("#main"));
  if (FULL) FULL.update();
  if (SHEET && SHEET.auto) SHEET.refresh();
  renderScreenMode();
  mirrorSoon();
}
function updateTicks() {
  const v = rxVideo();
  if (v) {
    const a = $("#vt"), b = $("#vt2"), r = $("#vrange");
    if (a && document.activeElement !== r) a.textContent = fmt(v.positionMs);
    if (b) b.textContent = fmt(v.positionMs);
    if (r && document.activeElement !== r) r.value = Math.round(v.positionMs / 1000);
    const play = document.querySelector('[data-act="vplay"]');
    if (play && play.textContent.includes("Пауза") !== v.playing) render();
  }
  const c = $("#vcount");
  if (c) c.textContent = viewerCount();
  document.querySelectorAll("[data-viewers]").forEach((el) => { const d = devOf(el.dataset.viewers); if (d) el.textContent = d.r.state.viewers || 0; });
}

// ——— Жесты: касание и смахивания ———
function gest(el, h) {
  let x0 = null, y0;
  el.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener("pointerup", (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0, ax = Math.abs(dx), ay = Math.abs(dy);
    x0 = null;
    if (ax < 10 && ay < 10) return h.tap && h.tap();
    if (ax > ay && ax > 40) { const f = dx < 0 ? h.left : h.right; if (f) f(); }
    else if (ay > 40) { const f = dy < 0 ? h.up : h.down; if (f) f(); }
  });
  el.addEventListener("pointercancel", () => (x0 = null));
}

let SHEET = null;
function openSheet(title, body, opts = {}) {
  closeSheet(true);
  const bd = document.createElement("div"); bd.className = "backdrop";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", title);
  const html = () => (typeof body === "function" ? body() : body);
  sh.innerHTML = `<div class="grab"><i></i></div><div class="sh"><h2>${esc(title)}</h2><button class="iconbtn" data-act="closesheet" aria-label="Закрыть">${ico("close")}</button></div><div class="sb">${html()}</div>`;
  document.body.append(bd, sh);
  // Отпущенный после удержания палец не закрывает только что открытое меню.
  bd.addEventListener("click", () => { if (!swallowClick) closeSheet(); });
  pullSheet(sh);
  requestAnimationFrame(() => { bd.classList.add("on"); sh.classList.add("on"); });
  SHEET = {
    bd, sh, title, auto: !!opts.auto, onClose: opts.onClose,
    refresh() { const sb = sh.querySelector(".sb"); const top = sb.scrollTop; sb.innerHTML = html(); sb.scrollTop = top; if (opts.mount) opts.mount(sh); },
  };
  if (opts.mount) opts.mount(sh);
  if (opts.focus) setTimeout(() => { const i = sh.querySelector(opts.focus); if (i) i.focus(); }, 300);
}
function closeSheet(now) {
  if (!SHEET) return;
  const { bd, sh, onClose } = SHEET;
  SHEET = null;
  if (onClose) onClose();
  if (now) { bd.remove(); sh.remove(); return; }
  sh.classList.add("closing"); sh.classList.remove("on"); bd.classList.remove("on");
  setTimeout(() => { bd.remove(); sh.remove(); }, 260);
}

// ——— Библия: книга → глава → стих или диапазон; до двух переводов ———
const NEW_TESTAMENT = 470; // в MyBible Новый Завет начинается с Евангелия от Матфея
let BP = null;
const normBook = (s) => s.toLowerCase().replace(/[.\s-]/g, "").replace(/ё/g, "е");
function bibleBooks() { return hub.bibleBooks(BP.selected[0]); }
function bibleBook() { return BP.book != null ? bibleBooks().find((b) => b.number === BP.book) : null; }
function parseQuick(q) {
  const m = String(q).trim().match(/^(.+?)\s*(\d+)(?:\s*:\s*(\d+)(?:\s*[-–—]\s*(\d+))?)?$/);
  if (!m) return null;
  const key = normBook(m[1]);
  const b = bibleBooks().find((x) => x.names.some((n) => n === key || (key.length > 2 && n.startsWith(key))));
  if (!b) return null;
  return { book: b, chapter: Number(m[2]), from: m[3] ? Number(m[3]) : null, to: m[4] ? Number(m[4]) : m[3] ? Number(m[3]) : null };
}
function quickHTML() {
  if (!BP.query.trim()) return "";
  const p = parseQuick(BP.query);
  if (!p) return `<div class="group"><div class="row"><span class="main s wrap">Пример: Ин 3:16 или Пс 22. В демо есть Ин 3:16–17, Пс 22:1–4 и 1 Кор 13:4–7.</span></div></div>`;
  const ok = p.chapter === p.book.chapter;
  const range = p.from ? `:${p.from}${p.to && p.to !== p.from ? "–" + p.to : ""}` : "";
  return `<div class="group"><button class="row" data-act="bquick" ${ok ? "" : "disabled"}><span class="kind">${ico("bible")}</span><span class="main"><div class="t">Открыть: ${esc(p.book.long)} ${p.chapter}${range}</div>${ok ? "" : `<div class="s">В демо есть глава ${p.book.chapter}</div>`}</span><span class="chev">${ico("chev")}</span></button></div>`;
}
function bibleOptionsText(o) {
  return [`по ${o.versesPerSlide} ст. на слайде`, o.refMode === "NONE" ? "без адреса" : o.refPosition === "TOP" ? "адрес сверху" : "адрес снизу",
    BP.selected.length > 1 && o.sideBySide ? "переводы рядом" : null].filter(Boolean).join(" · ");
}
function bibleHTML() {
  const mods = hub.bibleModules();
  const o = BP.options;
  let h = `<div class="chips">${mods.map((m) => { const i = BP.selected.indexOf(m.file); return `<button class="pill ${i >= 0 ? "tint" : ""}" data-act="bmod" data-id="${m.file}" aria-label="${esc(m.title)}">${i >= 0 && BP.selected.length > 1 ? i + 1 + " · " : ""}${esc(m.abbreviation)}</button>`; }).join("")}</div>
    <label class="search">${ico("search")}<input id="bq" type="search" placeholder="Быстро: Ин 3:16 или Пс 22" value="${esc(BP.query)}" aria-label="Быстрый ввод места" autocomplete="off"></label>
    <div id="bquick">${quickHTML()}</div>`;
  const bk = bibleBook();
  if (BP.step !== "book") h += `<div class="crumbs"><button class="pill" data-act="bstep" data-v="book">${ico("prev")}${esc(bk ? bk.long : "Книга")}</button>${BP.step === "verse" ? `<button class="pill" data-act="bstep" data-v="chapter">Глава ${BP.chapter}</button>` : ""}</div>`;
  if (BP.step === "book") {
    const books = bibleBooks().filter((b) => (BP.testament === 0 ? b.number < NEW_TESTAMENT : b.number >= NEW_TESTAMENT));
    h += `<div style="margin-bottom:var(--g5)">${seg("btest", [[0, "Ветхий Завет"], [1, "Новый Завет"]], BP.testament)}</div>
      <div class="grid c3">${books.map((b) => `<button class="gcell ${b.number === BP.book ? "on" : ""}" data-act="bbook" data-id="${b.number}" aria-label="${esc(b.long)}"><b>${esc(b.short)}</b><span>${esc(b.long)}</span></button>`).join("")}</div>
      <p class="note">В демо по одной главе из трёх книг: Псалтирь, От Иоанна, 1-е Коринфянам.</p>`;
  } else if (BP.step === "chapter") {
    h += `<div class="grid c6">${Array.from({ length: bk.chapters }, (_, i) => i + 1).map((c) => `<button class="gcell num ${c === BP.chapter ? "on" : ""}" data-act="bchap" data-id="${c}" ${c === bk.chapter ? "" : "disabled"} aria-label="Глава ${c}">${c}</button>`).join("")}</div>
      <p class="note">В демо есть глава ${bk.chapter}.</p>`;
  } else {
    const has = (v) => bk.verses[v] != null;
    const f = BP.from, t = BP.to ?? BP.from;
    h += `<p class="note tight" style="margin-bottom:var(--g4)">${f == null ? "Стих или диапазон: первое касание — начало, второе — конец" : `Выбрано: ${f === t ? "стих " + f : "стихи " + f + "–" + t}`}</p>
      <div class="grid c6">${Array.from({ length: bk.verseCount }, (_, i) => i + 1).map((v) => `<button class="gcell num ${f != null && v >= f && v <= t ? "on" : ""}" data-act="bverse" data-id="${v}" ${has(v) ? "" : "disabled"} aria-label="Стих ${v}">${v}</button>`).join("")}</div>`;
    const nums = Object.keys(bk.verses).map(Number);
    const first = f ?? nums[0], last = t ?? nums[nums.length - 1];
    const verses = nums.filter((n) => n >= first && n <= last);
    if (verses.length) h += `<div class="group" style="margin-top:var(--g6)"><div class="verses">${verses.slice(0, 6).map((n) => `<div><b>${n}</b>${esc(bk.verses[n])}</div>`).join("")}${verses.length > 6 ? `<div class="s">…и ещё ${verses.length - 6}</div>` : ""}</div></div>`;
    h += `<div class="group"><button class="row" data-act="bmore"><span class="kind">${ico("brush")}</span><span class="main"><div class="t">Оформление Писания</div>${BP.more ? "" : `<div class="s">${esc(bibleOptionsText(o))}</div>`}</span><span class="chev">${ico(BP.more ? "down" : "chev")}</span></button></div>`;
    if (BP.more) {
      const refSel = o.refMode === "NONE" ? "NONE" : o.refPosition;
      const sw = (k, t2, sub, on) => `<div class="row"><span class="main"><div>${t2}</div>${sub ? `<div class="s">${sub}</div>` : ""}</span>${toggle(on, "bopt", t2, `data-k="${k}"`)}</div>`;
      h += `<div class="ghead">Стихов на слайде</div><div style="margin-bottom:var(--g6)">${seg("bvps", [[1, "1"], [2, "2"], [3, "3"]], o.versesPerSlide)}</div>
        <div class="ghead">Адрес</div><div style="margin-bottom:var(--g6)">${seg("bref", [["TOP", "Сверху"], ["BOTTOM", "Снизу"], ["NONE", "Без адреса"]], refSel)}</div>
        <div class="group">${sw("fullBookName", "Полное название книги", "«От Иоанна» вместо «Ин»", o.fullBookName)}${sw("verseNumbers", "Номера стихов", "", o.verseNumbers)}
        ${BP.selected.length > 1 ? sw("sideBySide", "Два перевода рядом", "В две колонки, а не друг под другом", o.sideBySide) + sw("perTranslation", "Адрес у каждого перевода", "", o.refMode === "PER_TRANSLATION") : ""}</div>`;
    }
    h += `<div class="two"><button class="btn" data-act="bgo" data-v="pre">В предпросмотр</button><button class="btn tint" data-act="bgo" data-v="live">В зал</button></div>
      <div class="gap"></div><button class="btn" data-act="bgo" data-v="set">${ico("plus")}В сетлист</button>`;
  }
  return h;
}
function sheetBible() {
  BP = BP || { selected: S.bible.selected.slice(), testament: 1, book: null, chapter: null, from: null, to: null, step: "book", query: "", more: false, options: { ...S.bible.options } };

async function bibleGo(where) {
  const bk = bibleBook();
  if (!bk || BP.chapter == null) return;
  const nums = Object.keys(bk.verses).map(Number);
  const from = BP.from ?? nums[0], to = BP.to ?? BP.from ?? nums[nums.length - 1];
  const pick = { ref: `${bk.short} ${BP.chapter}:${from}-${to}`, modules: BP.selected.slice(), options: { ...BP.options } };
  S.bible = { selected: BP.selected.slice(), options: { ...BP.options } };
  const res = await scriptureSlides(pick);
  if (res.error || !res.slides.length) return toast("Стихи не найдены в выбранных переводах");
  const title = `${bk.short} ${BP.chapter}:${from === to ? from : from + "–" + to}`;
  if (where === "set") {
    const it = { id: "b" + Date.now(), type: "bible", title, pick, slides: res.slides };
    LIB.push(it);
    if (!activeSet().items.includes(it.id)) activeSet().items.push(it.id);
    closeSheet(); render();
    return toast("Добавлено в сетлист");
  }
  const src = { title, type: "bible", slides: res.slides };
  closeSheet();
  S.tab = "show";
  if (where === "live") { if (await goLive({ src, idx: 0 })) toast("В зале"); }
  else toPreview({ src, idx: 0 });
}

  const run = S.timer;

    type: "countdown", id: run.id, remainingMs: Math.round(timerLeft(run)), running: run.running, endsAt: run.running ? run.endsAt : 0,
    label: spec.label || null, labelPosition: spec.labelPosition || "ABOVE", format: spec.format || "AUTO", decimals: spec.decimals || 0,

// Тему зажимают в панели и переносят, как в Holyrics и EasyWorship: на песню или документ — всему элементу,
// на слайд — только ему, на окно «Сейчас» — тому, что в зале. Отпустили, почти не сдвинув, — изменить тему.

}
function startDrag(h) {

  document.body.append(ghost);
  fitSlides(ghost);
  DRAG = { t, ghost, x0: h.x0, y0: h.y0, moved: 0, over: null };
  document.body.classList.add("dragging");

}
function moveDrag(x, y) {
  DRAG.ghost.style.left = x + "px"; DRAG.ghost.style.top = y + "px";
  DRAG.moved = Math.max(DRAG.moved, Math.hypot(x - DRAG.x0, y - DRAG.y0));
  const over = dropAt(x, y);
  if (over !== DRAG.over) {
    if (DRAG.over) DRAG.over.classList.remove("drop-on");
    DRAG.over = over;
    if (over) over.classList.add("drop-on");
  }
}
function endDrag(x, y, cancel) {
  const d = DRAG;

  swallowClick = true;
  setTimeout(() => (swallowClick = false), 0);
  const target = cancel ? null : dropAt(x, y);
  if (target) {
    const [kind, id, i] = target.dataset.drop.split(":");
    if (kind === "live") applyTheme(d.t.style, d.t.name);
    else applyThemeTo(id, kind === "slide" ? Number(i) : null, d.t.style, d.t.name);

// Удержание: тема — перенос, строка сетлиста или библиотеки — меню элемента, кнопка-значок — её название.
document.addEventListener("pointerdown", (e) => {
  if (e.button > 0 || DRAG) return;
  const tile = e.target.closest("[data-theme]"), row = !tile && e.target.closest("[data-hold]"), tip = !tile && !row && e.target.closest(".bar.keys [aria-label]");
  if (!tile && !row && !tip) return;
  const h = { el: tile || row || tip, theme: tile && tile.dataset.theme, x0: e.clientX, y0: e.clientY, id: e.pointerId };
  h.timer = setTimeout(() => {
    HOLD = null;
    if (tile) return startDrag(h);
    swallowClick = true; setTimeout(() => (swallowClick = false), 400);
    if (tip) toast(tip.getAttribute("aria-label"));

});
document.addEventListener("pointermove", (e) => {

  if (HOLD && Math.hypot(e.clientX - HOLD.x0, e.clientY - HOLD.y0) > SLOP) { clearTimeout(HOLD.timer); HOLD = null; }

document.addEventListener("pointerup", (e) => {

// ——— Файлы на экраны заранее: в фоне, по очереди, в зале ничего не меняется ———
let aheadQueue = Promise.resolve();
function sendAhead(it, devs) {
  devs = devs || ready();
  if (!devs.length || !it.ref || it.big) return 0;
  const sha = it.ref().sha256;
  const need = devs.filter((d) => !d.sent.has(sha));
  if (!need.length || S.transfers[sha]) return 0;
  const t = { percent: 0, queued: true };
  t.done = aheadQueue = aheadQueue.then(() => new Promise((done) => {
    t.queued = false;
    const steps = Math.max(4, Math.min(24, Math.round(it.size / (18 * MB) * 4)));
    const tick = setInterval(() => {
      t.percent = Math.min(100, t.percent + Math.ceil(100 / steps));
      if (t.percent >= 100) { clearInterval(tick); need.forEach((d) => d.sent.add(sha)); delete S.transfers[sha]; done(); }
      render();
    }, 300);
  }));
  S.transfers[sha] = t;

// ——— Песня или текст, как в Holyrics: слайды делит ведущий; можно и одним текстом ———
let ED = null;
function parseWhole(text) {
  const out = [];
  for (const block of text.replace(/\r\n/g, "\n").split(/\n\s*\n/)) {
    const lines = block.split("\n");
    let label = null;
    const m = lines[0] && lines[0].trim().match(/^\[(.+)\]$/);
    if (m) { label = m[1]; lines.shift(); }
    const body = lines.map((l) => l.trim()).filter(Boolean).join("\n");
    if (body || label) out.push({ label, text: body });
  }
  return out;
}

// ——— Движение: вкладки листаются пальцем, шторка идёт за пальцем, слайды перетекают ———
const TABS_ORDER = () => TABS.map((t) => t[0]);
let justOpened = null, fullDir = 0, tabLift = false, shownKeys = {};
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function goTab(id, fromSwipe) {
  if (id === S.tab) return;
  const order = TABS_ORDER(), dir = order.indexOf(id) > order.indexOf(S.tab) ? "in-r" : "in-l";
  S.tab = id;
  closeFull(true);
  tabLift = true;
  render();
  const m = $("#main");
  m.classList.remove("in-r", "in-l", "settle", "dragging");
  m.style.transform = ""; m.style.opacity = "";
  void m.offsetWidth;
  if (!reduced()) m.classList.add(dir);
  setTimeout(() => m.classList.remove(dir), 400);
}
// После каждой отрисовки: что сменилось — то и движется; остальное стоит на месте.
function motion() {
  if (tabLift) { const t = document.querySelector('.tab[aria-current="page"]'); if (t) t.classList.add("lift"); tabLift = false; }
  if (justOpened) {
    const w = document.querySelector(`[data-drop="item:${justOpened}"] .slides, [data-drop="item:${justOpened}"] .trows`);
    if (w) w.classList.add("grow");
    justOpened = null;
  }
  for (const g of ["now", "pre"]) {
    const el = document.querySelector(`[data-g="${g}"]`);
    if (!el) continue;
    const key = el.innerHTML.replace(/<span id="vt2?">[^<]*<\/span>/g, "").replace(/data-cd="[^"]*">[^<]*</g, "");
    if (shownKeys[g] != null && shownKeys[g] !== key && el.firstElementChild) el.firstElementChild.classList.add("swap");
    shownKeys[g] = key;
  }
}
// Смахивание по странице вкладки — соседняя вкладка; страница идёт за пальцем. Окна показа, темы, поля ввода
// и полосы прокрутки со своими жестами не участвуют.
(() => {
  let sw = null;
  const skip = (t) => t.closest('[data-g], [data-theme], input, textarea, select, .seg, .chips, .vrow, .bar, .vbar, .tabs');
  document.addEventListener("pointerdown", (e) => {
    const m = $("#main");
    if (e.button > 0 || !m.contains(e.target) || skip(e.target) || SHEET || FULL || S.screenMode) return;
    sw = { x0: e.clientX, y0: e.clientY, t0: performance.now(), on: false };
  });
  document.addEventListener("pointermove", (e) => {
    if (!sw || DRAG) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.on) {
      if (Math.abs(dy) > SLOP && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (Math.abs(dx) < SLOP * 1.5 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      sw.on = true;
      if (HOLD) { clearTimeout(HOLD.timer); HOLD = null; }
    }
    const order = TABS_ORDER(), i = order.indexOf(S.tab), edge = (dx > 0 && i === 0) || (dx < 0 && i === order.length - 1);
    const m = $("#main");
    m.classList.add("dragging"); m.classList.remove("settle");
    // У края списка вкладок — с сопротивлением, как у резинки.
    m.style.transform = `translateX(${edge ? dx * 0.25 : dx * 0.6}px)`;
    m.style.opacity = String(1 - Math.min(0.35, Math.abs(dx) / innerWidth));
  });
  const end = (e, cancel) => {
    if (!sw) return;
    const s0 = sw; sw = null;
    if (!s0.on) return;
    swallowClick = true; setTimeout(() => (swallowClick = false), 0);
    const dx = e.clientX - s0.x0, v = Math.abs(dx) / Math.max(1, performance.now() - s0.t0);
    const order = TABS_ORDER(), i = order.indexOf(S.tab), m = $("#main");
    const far = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--swipe-tab")) || 70;
    const next = !cancel && (Math.abs(dx) > far || v > 0.6) ? order[i + (dx < 0 ? 1 : -1)] : null;
    m.classList.remove("dragging");
    if (next) return goTab(next, true);
    m.classList.add("settle"); m.style.transform = ""; m.style.opacity = "";
    setTimeout(() => m.classList.remove("settle"), 300);
  };
  document.addEventListener("pointerup", (e) => end(e, false));
  document.addEventListener("pointercancel", (e) => end(e, true));
})();
// Трекпад компьютера: смахивание двумя пальцами вбок тоже листает вкладки.
(() => {
  let acc = 0, lock = 0;
  document.addEventListener("wheel", (e) => {
    if (SHEET || FULL || !$("#main").contains(e.target) || e.target.closest(".seg, .chips, .vrow")) return;
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) * 1.5) { acc = 0; return; }
    if (performance.now() < lock) return;
    acc += e.deltaX;
    if (Math.abs(acc) < 120) return;
    const order = TABS_ORDER(), next = order[order.indexOf(S.tab) + (acc > 0 ? 1 : -1)];
    acc = 0; lock = performance.now() + 500;
    if (next) goTab(next, true);
  }, { passive: true });
})();
// Шторку тянут вниз за ручку или заголовок: она идёт за пальцем; далеко или резко — закрывается, иначе пружинит назад.
function pullSheet(sh) {
  const grip = [sh.querySelector(".grab"), sh.querySelector(".sh")];
  let p = null;
  grip.forEach((g) => g.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button") || e.button > 0) return;
    p = { y0: e.clientY, t0: performance.now(), dy: 0 };
    sh.classList.add("drag"); sh.classList.remove("back");
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
  }));
  grip.forEach((g) => g.addEventListener("pointermove", (e) => {
    if (!p) return;
    p.dy = Math.max(0, e.clientY - p.y0);
    sh.style.transform = `translateY(${p.dy}px)`;
  }));
  const done = () => {
    if (!p) return;
    const v = p.dy / Math.max(1, performance.now() - p.t0), far = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheet-close")) || 110;
    sh.classList.remove("drag");
    const close = p.dy > far || (v > 0.8 && p.dy > SLOP);
    p = null;
    if (close) { sh.style.transform = ""; return closeSheet(); }
    sh.classList.add("back"); sh.style.transform = "";
    setTimeout(() => sh.classList.remove("back"), 300);
  };
  grip.forEach((g) => { g.addEventListener("pointerup", done); g.addEventListener("pointercancel", done); });
  grip.forEach((g) => (g.style.touchAction = "none"));
}
