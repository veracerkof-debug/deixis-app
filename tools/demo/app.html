    if (d.live === "1") { if (await goLive({ src: it, idx: 0 })) toast("Отсчёт в зале"); } else toPreview({ src: it, idx: 0 });
  },
  tpause: () => { const r = S.timer; if (!r) return; if (r.running) { r.remaining = r.endsAt - Date.now(); r.running = false; } else { r.endsAt = Date.now() + r.remaining; r.running = true; } timerChanged(); },
  tadd: (d) => { const r = S.timer; if (!r) return; if (r.running) r.endsAt += Number(d.d); else r.remaining += Number(d.d); r.nexted = false; timerChanged(); },
  trestart: () => { const r = S.timer; if (!r) return; r.endsAt = Date.now() + cdStartMs(r.spec); r.running = true; r.nexted = false; timerChanged(); },
  tstop: () => { const r = S.timer; S.timer = null; if (S.live && r && cdKey(S.live.src) === r.itemKey) { S.live = null; S.mode = "BLACK"; for (const d of ready()) d.r.mode("BLACK"); } render(); },
  // Темы
  tapply: (d) => { const t = themeOf(d.tkey); if (t) applyTheme(t.style, t.name); },
  tpanel: (d) => { S.settings.themePanel = d.v; render(); refreshSheet(); },
  test: (d) => { TE.style[d.k] = Number(d.v); refreshSheet(); },
  tefs: (d) => { const fs = Math.min(14, Math.max(4, Math.round((TE.style.sizePercent || 20) / 2.5) + Number(d.d))); TE.style.sizePercent = fs * 2.5; refreshSheet(); },
  teflag: (d) => {
    const st = TE.style;
    if (d.k === "shadow") st.shadow = st.shadow === false;
    else if (d.k === "outline") st.outline = !st.outline;
    else if (d.k === "box") st.box = st.box ? 0 : 0xB4000000;
    else if (d.k === "valign") st.valign = st.valign === "BOTTOM" ? null : "BOTTOM";
    refreshSheet();
  },
  tesave: () => {
    const name = TE.name.trim() || "Своя тема", style = Object.assign({}, TE.style, { name });
    if (TE.own) { TE.own.name = name; TE.own.style = style; } else S.themes.push({ id: "u" + Date.now(), name, style });
    closeSheet(); render(); toast(`Тема «${name}» сохранена`);
  },
  tedel: () => { S.themes = S.themes.filter((t) => t !== TE.own); closeSheet(); render(); toast("Тема удалена"); },
  // Поверх показа
  layers: () => sheetLayers(),
  ovsample: (d) => {
    const x = OV_SAMPLES()[+d.i][1];
    if (x.lowerThird) { OVF.title = x.lowerThird.title; OVF.subtitle = x.lowerThird.subtitle || ""; }
    if (x.ticker) OVF.ticker = x.ticker.text;
    setOverlays(JSON.parse(JSON.stringify(x)));
  },
  ovlt: (d) => {
    const o = Object.assign({}, S.overlays);
    if (d.v === "off") delete o.lowerThird;
    else { if (!OVF.title.trim()) return toast("Нужно имя"); o.lowerThird = Object.assign({}, o.lowerThird || {}, { title: OVF.title.trim(), subtitle: OVF.subtitle.trim() || null }); }
    setOverlays(o);
  },
  ovltd: (d) => { const lt = S.drafts.lowerThirds[+d.i]; OVF.title = lt.title; OVF.subtitle = lt.subtitle || ""; setOverlays(Object.assign({}, S.overlays, { lowerThird: lt })); },
  ovtk: (d) => {
    const o = Object.assign({}, S.overlays);
    if (d.v === "off") delete o.ticker;
    else { if (!OVF.ticker.trim()) return toast("Нужен текст"); o.ticker = Object.assign({ speedPercent: 10 }, o.ticker || {}, { text: OVF.ticker.trim() }); }
    setOverlays(o);
  },
  ovspeed: (d) => { if (S.overlays.ticker) setOverlays(Object.assign({}, S.overlays, { ticker: Object.assign({}, S.overlays.ticker, { speedPercent: +d.v }) })); },
  ovclock: () => setOverlays(Object.assign({}, S.overlays, { clock: S.overlays.clock ? null : { corner: "TOP_LEFT", seconds: false } })),
  ovsec: () => setOverlays(Object.assign({}, S.overlays, { clock: Object.assign({}, S.overlays.clock, { seconds: !S.overlays.clock.seconds }) })),
  ovccorner: (d) => setOverlays(Object.assign({}, S.overlays, { clock: Object.assign({}, S.overlays.clock, { corner: d.v }) })),
  ovlogo: () => setOverlays(Object.assign({}, S.overlays, { logo: S.overlays.logo ? null : { file: hub.LOGO_DEIXIS, corner: "TOP_RIGHT", sizePercent: 10, opacity: 1 } })),
  ovlogopick: () => { pickMode = "logo"; const i = $("#pickDevice"); i.accept = "image/*"; i.click(); },
  ovlcorner: (d) => setOverlays(Object.assign({}, S.overlays, { logo: Object.assign({}, S.overlays.logo, { corner: d.v }) })),
  ovlsize: (d) => { const l = S.overlays.logo; setOverlays(Object.assign({}, S.overlays, { logo: Object.assign({}, l, { sizePercent: Math.max(4, Math.min(30, (l.sizePercent || 10) + Number(d.d))) }) })); },
  ovclear: () => setOverlays({}),
  logopic: () => { pickMode = "logopic"; const i = $("#pickDevice"); i.accept = "image/*"; i.click(); },
  logopicoff: () => { S.settings.logoImage = null; if (S.mode === "LOGO") for (const d of ready()) d.r.mode("LOGO", null); render(); refreshSheet(); },
  // «Показать», меню элемента, на экраны заранее
  showmenu: () => sheetShowMenu(),
  ahead: (d) => { const it = lib(d.id); if (it) toast(sendAhead(it) ? "Передаётся в фоне: в зале ничего не меняется" : "Нет подключённых экранов"); },
  imfull: (d) => { closeSheet(); openFull("lib", { src: lib(d.id), idx: 0 }); },
  impre: (d) => { const it = lib(d.id); closeSheet(); S.tab = "show"; if (it.big) return sheetLarge(it); S.open = it.id; toPreview({ src: it, idx: 0 }); },
  imedit: (d) => { const it = lib(d.id); sheetSong(it.type, it); },
  imstyle: (d) => { const it = lib(d.id); closeSheet(); S.tab = "show"; S.pre = { src: it, idx: 0 }; S.draftScope = "item"; S.draft = null; sheetStyle(); },
  imahead: (d) => { closeSheet(); A.ahead(d); },
  imup: (d) => { moveInSet(d.id, -1); },
  imdown: (d) => { moveInSet(d.id, 1); },
  imremove: (d) => { const s0 = activeSet(); s0.items = s0.items.filter((x) => x !== d.id); closeSheet(); render(); toast("Убрано из сетлиста"); },
  imdelete: (d) => {
    const it = lib(d.id);
    openSheet(`Удалить «${it.title}»?`, `<p class="note" style="margin-top:0">Элемент уберётся из библиотеки и всех сетлистов. Файл на телефоне останется.</p>
      <div class="two"><button class="btn" data-act="closesheet">Отмена</button><button class="btn danger" data-act="imdeletego" data-id="${d.id}">Удалить</button></div>`);
  },
  imdeletego: (d) => {
    const i = LIB.findIndex((x) => x.id === d.id);
    if (i >= 0) LIB.splice(i, 1);
    S.setlists.forEach((s0) => (s0.items = s0.items.filter((x) => x !== d.id)));
    S.recent = S.recent.filter((x) => x !== d.id);
    if (S.pre && S.pre.src.id === d.id) S.pre = null;
    closeSheet(); render(); toast("Удалено");
  },
  delsetgo: (d) => {
    closeSheet();
    const was = S.active === d.id;
    S.setlists = S.setlists.filter((x) => x.id !== d.id);
    if (was) { const next = S.setlists.find((x) => !x.past) || S.setlists[0]; S.active = next ? next.id : null; S.open = null; }
    render();
    toast(was && activeSet() ? `Сетлист удалён. На главном: ${activeSet().title}` : "Сетлист удалён");
  },
  rmdemo: () => {
    openSheet("Убрать демо-материалы?", `<p class="note" style="margin-top:0">Уберутся примеры: лекция, документы, фото, видео, песни, тексты и их сетлисты. Своё останется.</p>
      <div class="two"><button class="btn" data-act="closesheet">Отмена</button><button class="btn danger" data-act="rmdemogo">Убрать</button></div>`);
  },
  rmdemogo: () => { removeDemo(); closeSheet(); render(); toast("Демо-материалы убраны"); },
  backdemo: () => location.reload(),
  biblemods: () => sheetBibleMods(),
  addmod: () => toast("В демо модули не добавляются: на телефоне это файл MyBible .SQLite3"),
  // Оформление
  st: (d) => { S.draft[d.k] = Number(d.v); render(); refreshSheet(); },
  stheme: (d) => { const t = themeOf(d.tkey); if (!t) return; S.draft = Object.assign({}, t.style); render(); refreshSheet(); },
  fs: (d) => { const fs = Math.min(14, Math.max(4, Math.round((S.draft.sizePercent || 20) / 2.5) + Number(d.d))); S.draft.sizePercent = fs * 2.5; render(); refreshSheet(); },
  stflag: (d) => { S.draft[d.k] = d.k === "shadow" ? S.draft.shadow === false : !S.draft.outline; render(); refreshSheet(); },
  stscope: (d) => { S.draftScope = d.v; refreshSheet(); },
  stcancel: () => { S.draft = null; closeSheet(); render(); },
  stapply: () => {
    applyDraft(S.draftScope); closeSheet();
    const l = slideOf(S.live);
    if (l && (l.text != null || l.scripture)) sendLive();
    render(); toast("Оформление в зале");
  },
  // Настройки
  theme: (d) => { S.settings.theme = d.v; render(); },
  setting: (d) => { S.settings[d.k] = !S.settings[d.k]; if (d.k === "caps" && S.live) sendLive(); render(); },
  // Библия
  bmod: (d) => {
    const i = BP.selected.indexOf(d.id);
    BP.selected = i >= 0 && BP.selected.length > 1 ? BP.selected.filter((x) => x !== d.id) : i >= 0 ? BP.selected : BP.selected.length >= 2 ? [BP.selected[0], d.id] : BP.selected.concat(d.id);
    // Номер главы в разных переводах свой (Пс 22 и Ps 23): при смене основного перевода выбор начинается с главы.
    const bk = bibleBook();
    if (bk && BP.chapter !== bk.chapter) { BP.chapter = null; BP.from = BP.to = null; if (BP.step === "verse") BP.step = "chapter"; }
    refreshSheet();
  },
  bquick: () => {
    const p = parseQuick(BP.query);
    if (!p) return;
    BP.book = p.book.number; BP.chapter = p.chapter; BP.from = p.from; BP.to = p.to;
    BP.testament = p.book.number >= NEW_TESTAMENT ? 1 : 0; BP.step = "verse"; BP.query = "";
    refreshSheet();
  },
  bstep: (d) => { BP.step = d.v; refreshSheet(); },
  btest: (d) => { BP.testament = Number(d.v); refreshSheet(); },
  bbook: (d) => { BP.book = Number(d.id); BP.chapter = null; BP.from = BP.to = null; BP.step = "chapter"; refreshSheet(); },
  bchap: (d) => { BP.chapter = Number(d.id); BP.from = BP.to = null; BP.step = "verse"; refreshSheet(); },
  bverse: (d) => {
    const v = Number(d.id), f = BP.from, t = BP.to ?? f;
    if (f == null || t !== f || v < f) { BP.from = v; BP.to = v; } else BP.to = v;
    refreshSheet();
  },
  bmore: () => { BP.more = !BP.more; refreshSheet(); },
  bvps: (d) => { BP.options.versesPerSlide = Number(d.v); refreshSheet(); },
  bref: (d) => {
    const o = BP.options;
    if (d.v === "NONE") o.refMode = "NONE";
    else { if (o.refMode === "NONE") o.refMode = "ONE_LINE"; o.refPosition = d.v; }
    refreshSheet();
  },
  bopt: (d) => {
    const o = BP.options;
    if (d.k === "perTranslation") o.refMode = o.refMode === "PER_TRANSLATION" ? "ONE_LINE" : "PER_TRANSLATION";
    else o[d.k] = !o[d.k];
    refreshSheet();
  },
  bgo: (d) => bibleGo(d.v),
  // Holyrics
  holyrics: () => sheetHolyrics(),
  // Поиск Holyrics в сети: в демо он «находится» на ноутбуке преподавателя.
  // Перенос из Holyrics: свои копии с постоянным id (повторно — обновит), темы — в панель тем, плейлист — сетлист.
  himport: () => {
    if (S.holy.importing) return;
    const total = HOLY.songs.length + HOLY.texts.length;
    let n = 0;
    const tick = setInterval(() => {
      n++;
      S.holy.importing = n <= HOLY.songs.length ? `Песни: ${n} из ${HOLY.songs.length}` : `Тексты: ${n - HOLY.songs.length} из ${HOLY.texts.length}`;
      refreshSheet();
      if (n < total) return;
      clearInterval(tick);
      const put = (x, type) => {
        const it = buildSlides({ id: "hl-" + x.id, type, title: x.title, texts: x.slides });
        const i = LIB.findIndex((y) => y.id === it.id);
        if (i >= 0) LIB[i] = it; else LIB.unshift(it);
      };
      HOLY.songs.forEach((x) => put(x, "song"));
      HOLY.texts.forEach((x) => put(x, "text"));
      for (const t of HOLY.themes) if (!S.themes.some((m) => m.id === "hl-" + t.id)) S.themes.push({ id: "hl-" + t.id, name: t.name, style: holyStyle(t) });
      S.setlists = [{ id: "hl-playlist", title: "Плейлист Holyrics", date: "31 октября", items: HOLY.playlist.map((x) => "hl-" + x.id), past: false }, ...S.setlists.filter((s) => s.id !== "hl-playlist")];
      S.holy.importing = null;
      refreshSheet(); render();
      toast(`Из Holyrics в Deixis: песен ${HOLY.songs.length}, текстов ${HOLY.texts.length}, тем ${HOLY.themes.length}, плейлист — сетлист «Плейлист Holyrics»`);
    }, 220);
  },
  hfind: () => { S.holy.finding = true; refreshSheet(); setTimeout(() => { S.holy.finding = false; S.holy.found = true; refreshSheet(); }, 1200); },
  hpick: () => toast("Адрес подставлен: 192.168.1.31"),
  hconnect: () => { S.holy.status = "connecting"; refreshSheet(); setTimeout(() => { S.holy.status = "on"; refreshSheet(); render(); }, 700); },
  hoff: () => { Object.assign(S.holy, { status: "off", remote: false, live: null }); refreshSheet(); render(); },
  hremote: () => { S.holy.remote = !S.holy.remote; if (SHEET && SHEET.title === "Holyrics") refreshSheet(); render(); },
  htab: (d) => { S.holy.tab = d.v; S.holy.query = ""; refreshSheet(); },
  htheme: (d) => { S.holy.theme = d.id || null; refreshSheet(); },
  h2d: (d) => holyToDeixis(findHoly(d.id), d.k),
  h2h: (d) => { const x = findHoly(d.id); S.holy.live = { title: x.title, slides: x.slides || [x.title], index: 0 }; toast(`«${x.title}» показано в Holyrics`); render(); },
  // Полный просмотр
  closefull: () => closeFull(),
  fstep: (d) => FULL && FULL.move(+d.d),
  fgo: () => FULL && FULL.go(),
  fstyle: () => { closeFull(); sheetStyle(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (swallowClick) { e.preventDefault(); return; }
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
// Клавиши кликера: вперёд и назад, B — чёрный экран
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#syscap").classList.contains("on")) return A.capno(); if (SHEET) return closeSheet(); if (FULL) return closeFull(); }
  if (e.key === "Enter" && e.target.id === "pin") return A.pairgo({ id: document.querySelector('[data-act="pairgo"]').dataset.id });
  if (e.key === "Enter" && e.target.id === "addr") return A.manualgo();
  if (e.target.matches("input, textarea") || !S.settings.clicker) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); step(1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === "b" || e.key === "и") setMode("BLACK");
});

// ——— Старт ———
async function init() {
  LIB.forEach(buildSlides);
  for (const it of LIB.filter((x) => x.pick)) {
    const res = await scriptureSlides(it.pick);
    it.slides = res.slides || [];
  }
  // Как в приложении, которое помнит свой экран: проектор уже на связи, в зале — первый слайд лекции.
  const rx = hub.receivers.projector;
  rx.paired = true;
  const d = { key: "projector", r: rx, state: "online", sent: new Set([hub.LECTURE.sha256]), unsub: null };
  S.devices.push(d);
  connected(d, true);
  S.live = { src: lib("lec"), idx: 0 };
  S.recent = ["lec", ...S.recent.filter((x) => x !== "lec")];
  rx.show(contentOf(S.live));
  render();
  discover();
}
init();
</script>
</body>
</html>
