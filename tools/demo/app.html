<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deixis</title>
<style>
/* Копия экрана приложения Deixis для телефона (android/phone/.../PhoneUi.kt) для симулятора.
   Цвета и размеры — палитра Light/Dark и размеры из PhoneUi.kt. */
@font-face { font-family: "Deixis Mark"; src: url("assets/GFSDidot-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Deixis Slide"; src: url("assets/NotoSans-SemiBold.ttf") format("truetype"); font-display: swap; }
:root {
  --bg: #F3F2EE; --cell: #FFFFFF; --ink: #161514; --l2: #87847E; --l3: #C6C3BC; --tint: #9C7242; --tint-text: #765A38;
  --red: #A75750; --fill: rgba(120,115,106,.12); --white: #FFFFFF; --black: #000000; --scrim: rgba(0,0,0,.4);
  --toast: rgba(40,40,40,.92); --toast-ink: #FFFFFF; --notify: #2C2B29;
  --r-card: 12px; --r-btn: 14px; --r-seg: 9px; --r-seg-in: 7px; --r-pill: 999px; --r-dialog: 14px;
  --f-mark: "Deixis Mark", "Didot", Georgia, serif;
  --f-ui: system-ui, -apple-system, Roboto, "Segoe UI", "Noto Sans", sans-serif;
  --t-fast: 140ms; --e-out: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000000; --cell: #1C1C1E; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A; --tint: #BC9361; --tint-text: #BC9361;
  --red: #B96E65; --fill: rgba(118,118,128,.24); --toast: rgba(70,70,74,.95); --notify: #2C2C2E; color-scheme: dark } }
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-ui); }
body { display: flex; flex-direction: column; overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
header { display: flex; align-items: center; padding: 12px 16px; gap: 10px; flex: none; }
.mark { font-family: var(--f-mark); font-size: 22px; letter-spacing: .18em; }
#status { margin-left: auto; font-size: 13px; color: var(--l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { flex: 1; overflow-y: auto; padding-bottom: 24px; }
.section { font-size: 13px; color: var(--l2); letter-spacing: .02em; text-transform: uppercase; padding: 20px 32px 8px; }
.chips { display: flex; gap: 8px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); background: var(--cell); font-size: 15px; font-weight: 600; white-space: nowrap; }
.chip.sel { background: var(--tint); color: var(--white); }
.chip.live { box-shadow: inset 0 0 0 2px var(--red); }
.hint { font-size: 14px; color: var(--l2); padding: 8px 20px; line-height: 1.35; }
.now { margin: 0 16px; aspect-ratio: 16 / 9; border-radius: var(--r-card); background: var(--black); border: 2px solid var(--l3);
       display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--white);
       font-size: 17px; font-weight: 600; white-space: pre-line; overflow: hidden; line-height: 1.3; }
.now.live { border-color: var(--red); }
.now.logo { font-family: var(--f-mark); font-weight: 400; letter-spacing: .18em; }
.tiles { display: flex; gap: 10px; padding: 0 16px; }
.tiles + .tiles { margin-top: 10px; }
.tile { flex: 1 1 0; min-width: 0; height: 72px; border-radius: var(--r-card); background: var(--cell); padding: 12px; display: flex; align-items: flex-end;
        font-size: 15px; font-weight: 600; text-align: left; transition: transform var(--t-fast) var(--e-out); }
.tile:active, .bar button:active, .chip:active { transform: scale(.97); }
.tile.spacer { visibility: hidden; }
.bar { flex: none; background: var(--cell); padding: 8px 12px; display: grid; gap: 6px; }
.bar .row { display: flex; gap: 6px; }
.bar button { flex: 1 1 0; height: 50px; border-radius: var(--r-btn); background: var(--fill); font-size: 14px; font-weight: 600; transition: transform var(--t-fast) var(--e-out); }
.bar button.pressed { background: var(--ink); color: var(--bg); }
.bar button:disabled { color: var(--l3); cursor: default; }

/* Диалоги как Compose Dialog: карточка по центру на затемнении. */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.dialog { background: var(--bg); border-radius: var(--r-dialog); padding: 16px; width: 340px; max-width: 100%; max-height: calc(100% - 32px); overflow-y: auto; }
.dialog h2 { margin: 0; font-size: 20px; font-weight: 700; }
.dialog .note { font-size: 13px; color: var(--l2); margin: 6px 0 0; line-height: 1.35; }
.dialog .gap { height: 12px; }
.field { width: 100%; border: 0; border-radius: var(--r-card); background: var(--cell); padding: 14px; font: 17px var(--f-ui); color: var(--ink); }
.field::placeholder { color: var(--l3); }
textarea.field { min-height: 140px; resize: none; }
.btns { display: flex; gap: 10px; margin-top: 12px; }
.btn { flex: 1 1 0; height: 50px; border-radius: var(--r-btn); background: var(--fill); font-size: 17px; font-weight: 600; }
.btn.primary { background: var(--tint); color: var(--white); }
.btn.danger { background: var(--red); color: var(--white); }
.btn:disabled { background: var(--fill); color: var(--l3); cursor: default; }
.opt { font-size: 13px; color: var(--l2); margin: 12px 0 6px; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-seg); background: var(--fill); }
.seg button { flex: 1 1 0; min-height: 36px; border-radius: var(--r-seg-in); font-size: 14px; }
.seg button.sel { background: var(--cell); font-weight: 600; }
.flow { display: flex; flex-wrap: wrap; gap: 8px; }
.small { min-height: 34px; padding: 0 12px; font-size: 14px; }
.qr { width: 240px; height: 240px; margin: 12px auto; background: var(--white); border-radius: var(--r-card); padding: 20px; display: block; }
.center { text-align: center; }
.mono { font-size: 13px; word-break: break-all; }

/* Выбор файла Android: список недавних файлов снизу. */
.picker { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; z-index: 20; }
.picker .sheet { background: var(--bg); width: 100%; border-radius: 16px 16px 0 0; padding: 10px 0 16px; max-height: 80%; overflow-y: auto; }
.picker h3 { margin: 4px 20px 8px; font-size: 17px; }
.file { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 20px; text-align: left; }
.file:hover { background: var(--fill); }
.thumb { width: 48px; height: 48px; border-radius: 8px; background: var(--cell) center / cover no-repeat; flex: none; display: flex; align-items: center; justify-content: center;
         font-size: 11px; font-weight: 700; color: var(--l2); }
.file .name { font-size: 15px; font-weight: 600; }
.file .meta { font-size: 13px; color: var(--l2); }

/* Holyrics */
.hrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--fill); }
.hrow .t { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hscroll { max-height: 220px; overflow-y: auto; margin-top: 8px; }
.swatch { width: 34px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }

/* Тост Android */
#toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); max-width: calc(100% - 48px); background: var(--toast); color: var(--toast-ink);
         padding: 10px 16px; border-radius: 22px; font-size: 14px; line-height: 1.35; text-align: center; opacity: 0; pointer-events: none;
         transition: opacity var(--t-fast) var(--e-out); z-index: 40; }
#toast.on { opacity: 1; }

/* Демонстрация экрана: системная плашка и плеер телефона */
#notify { flex: none; position: relative; z-index: 18; display: none; align-items: center; gap: 8px; background: var(--notify); color: var(--white); font-size: 13px; padding: 8px 12px; }
#notify.on { display: flex; }
#notify .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
#notify button { margin-left: auto; color: var(--white); font-weight: 700; font-size: 13px; }
#player { position: fixed; inset: 0; background: var(--black); z-index: 15; display: none; flex-direction: column; }
#player.on { display: flex; }
#player video { flex: 1; width: 100%; min-height: 0; object-fit: contain; }
#player .ptitle { color: var(--white); font-size: 14px; padding: 12px 16px; }
#player .pclose { color: var(--white); font-size: 15px; font-weight: 600; padding: 14px; }
#syscap { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 30; }
#syscap.on { display: flex; }

/* Режим экрана на самом телефоне (ScreenActivity) */
#screenMode { position: fixed; inset: 0; background: var(--black); color: var(--white); z-index: 25; display: none; flex-direction: column; align-items: center; justify-content: center;
              text-align: center; padding: 24px; gap: 14px; }
#screenMode.on { display: flex; }
#screenMode .big { font-family: var(--f-mark); font-size: 40px; letter-spacing: .18em; }
#screenMode .pin { font-family: "Deixis Slide", var(--f-ui); font-size: 34px; letter-spacing: .3em; }
#screenMode .dim { color: rgba(255,255,255,.6); font-size: 13px; }
#screenMode .qrs { width: 120px; height: 120px; background: var(--white); padding: 8px; border-radius: 4px; }
#screenMode .back { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.75); font-size: 14px;
                    border: 1px solid rgba(255,255,255,.3); border-radius: var(--r-pill); padding: 8px 16px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="notify"><span class="dot"></span><span>Экран транслируется</span><button id="stopShare">Остановить</button></div>
<header><span class="mark">ΔΕΙΞΙΣ</span><span id="status"></span></header>
<main id="main"></main>
<div class="bar" id="bar"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="player"><div class="ptitle" id="ptitle"></div><video id="pvideo" playsinline muted loop></video><button class="pclose" id="pclose">Закрыть проигрыватель</button></div>
<div id="syscap"><div class="dialog"><h2>Начать запись или трансляцию через Deixis?</h2>
  <p class="note">Deixis получит доступ ко всему, что видно на экране телефона, пока идёт трансляция.</p>
  <div class="btns"><button class="btn" id="capNo">Отмена</button><button class="btn primary" id="capYes">Начать</button></div></div></div>
<div id="screenMode"></div>
<input type="file" id="pickDevice" class="hidden">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ——— Связь с симулятором: демо-экраны живут в окне витрины (hub.js) ———
function findHub() {
  let w = window;
  for (let i = 0; i < 4; i++) {
    try { if (w.DeixisDemo) return w.DeixisDemo; } catch (e) { return null; }
    if (w.parent === w) return null;
    w = w.parent;
  }
  return null;
}
const hub = findHub();
const sim = (() => { try { return parent.DeixisSim || null; } catch (e) { return null; } })();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ——— Состояние, как в Controller.kt ———
const S = {
  targets: [], active: null, connection: "none", item: null, rx: null, rxState: null, progress: null,
  caps: false, church: true, sharing: false, dialog: null, needPin: null, picker: null,
  bible: { selected: ["RST.SQLite3"], ref: "", options: { versesPerSlide: 1, refMode: "ONE_LINE", refPosition: "BOTTOM", fullBookName: false, verseNumbers: true, sideBySide: false } },
  holy: { status: "off", tab: "PLAYLIST", query: "", theme: null, remote: false, live: null, host: "192.168.1.10", port: "8091", token: "demo-token" },
  screenMode: false,
};
let unsub = null;

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toast.t);
  // Toast.LENGTH_LONG для длинных сообщений, как в MainActivity.
  toast.t = setTimeout(() => el.classList.remove("on"), text.length > 80 ? 3500 : 2000);
}

// Поиск экранов в сети: через секунду появляются демо-экраны.
function discover() {
  setTimeout(() => {
    S.targets = Object.values(hub.receivers).filter((r) => r.key !== "demo" && r.key !== "phone").map((r) => ({ id: r.key, name: r.info.name, kind: "DEIXIS" }));
    render();
  }, 1100);
}

function select(t) {
  if (S.active && S.active.id === t.id && S.connection === "connected") return;
  if (unsub) unsub();
  S.active = t;
  S.rx = hub.receivers[t.id];
  S.connection = "connecting";
  S.item = null;
  render();
  setTimeout(() => {
    if (S.active !== t) return;
    if (!S.rx.paired) { S.connection = "denied"; S.needPin = t; render(); return; }
    connected();
  }, 500);
}
function connected() {
  S.connection = "connected";
  S.rxState = S.rx.state;
  unsub = S.rx.onChange((st) => { S.rxState = st; render(); });
  if (sim) sim.focus(S.rx.key);
  render();
}
function pair(pin) {
  if (!S.rx.pair(pin)) { toast("Неверный PIN"); return false; }
  S.needPin = null;
  connected();
  return true;
}
function addManual(addr) {
  const a = addr.trim().replace(/^deixis:\/\//, "").split("?")[0];
  const r = Object.values(hub.receivers).find((x) => x.address && (x.address === a || x.address.split(":")[0] === a));
  if (!r) return toast(`Нет связи с «${a}»`);
  if (!S.targets.some((t) => t.id === r.key)) S.targets.push({ id: r.key, name: r.info.name, kind: "DEIXIS" });
  select(S.targets.find((t) => t.id === r.key));
}

function statusText() {
  const t = S.active;
  if (!t) return "Экран не выбран";
  return { connected: t.name, connecting: "Подключение…", lost: "Нет связи, переподключение…", denied: "Нужен PIN" }[S.connection] || t.name;
}

// ——— Показ: как Controller.show ———
function contentOf(it) {
  const caps = (st) => (S.caps ? Object.assign({}, st || {}, { caps: true }) : st || {});
  if (it.kind === "text") return { type: "text", text: it.slides[it.index], style: caps(it.style) };
  if (it.kind === "scripture") { const sc = it.slides[it.index]; return Object.assign({}, sc, { type: "scripture", style: caps(sc.style) }); }
  if (it.kind === "pdf") return { type: "pdf", file: it.ref, page: it.index };
  if (it.kind === "image") return { type: "image", file: it.ref };
  if (it.kind === "video") return { type: "video", file: it.ref };
  return null;
}
function show(it) {
  if (S.connection !== "connected") { toast("Нет связи с экраном"); return; }
  S.item = it;
  S.rx.show(contentOf(it));
  render();
}
function step(d) {
  const it = S.item;
  if (!it || !["text", "pdf", "scripture"].includes(it.kind)) return;
  const n = it.kind === "pdf" ? it.pages : it.slides.length;
  const i = Math.max(0, Math.min(n - 1, it.index + d));
  if (i !== it.index) show(Object.assign({}, it, { index: i }));
}
function mode(m) { if (S.connection === "connected") S.rx.mode(S.rxState && S.rxState.mode === m ? "NORMAL" : m); }
function video(action, delta) {
  if (S.connection !== "connected" || !S.rxState || !S.rxState.video) return;
  const v = S.rxState.video;
  if (action === "SEEK") S.rx.video("SEEK", v.positionMs + delta);
  else if (action === "LOOP") { S.rx.video("LOOP", null, !v.loop); toast(v.loop ? "Повтор выключен" : "Повтор включён"); }
  else S.rx.video(action);
}
function splitIntoSlides(text) {
  const out = [];
  for (const block of text.replace(/\r\n/g, "\n").split(/\n\s*\n/)) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i += 4) out.push(lines.slice(i, i + 4).join("\n"));
  }
  return out;
}
function showText(text, title, style) {
  const slides = splitIntoSlides(text);
  if (slides.length) show({ kind: "text", slides, index: 0, title: title || "Текст", style: style || null });
}

// Передача файла: проценты, как в Controller.upload.
function send(name, size, done) {
  let p = 0;
  S.progress = `«${name}»: подготовка`;
  render();
  const speed = 18; // МБ/с по Wi-Fi
  const steps = Math.max(3, Math.min(20, Math.round(size / (speed * 1048576) * 4)));
  const t = setInterval(() => {
    p = Math.min(100, p + Math.ceil(100 / steps));
    S.progress = `«${name}»: ${p}%`;
    render();
    if (p >= 100) { clearInterval(t); S.progress = null; done(); }
  }, 250);
}

// Файлы телефона в выборе файла: примеры и свой файл с этого устройства.
const GB = 1024 * 1024 * 1024, MB = 1024 * 1024;
const FILES = {
  image: [
    { name: "Горы на закате.jpg", size: 2.4 * MB, ref: () => hub.PHOTO, thumb: "media/mountains.jpg", date: "Сегодня" },
    { name: "Утро в горах.jpg", size: 1.9 * MB, ref: () => hub.MORNING, thumb: "media/morning.jpg", date: "Вчера" },
  ],
  video: [
    { name: "Демо-видео.mp4", size: 14 * MB, ref: () => hub.VIDEO, label: "MP4", date: "Сегодня" },
    { name: "Запись концерта.mp4", size: 2.4 * GB, big: true, label: "MP4", date: "12 окт." },
  ],
  file: [
    { name: "Лекция 3. Город 15 минут.pptx", size: 4.1 * MB, kind: "PRESENTATION", label: "PPTX", date: "Сегодня", ref: () => hub.LECTURE, pages: 5 },
    { name: "Город пятнадцати минут.pdf", size: 1.2 * MB, kind: "PDF", label: "PDF", date: "Сегодня", ref: () => hub.LECTURE, pages: 5 },
    { name: "Отчёт по практике.docx", size: 0.3 * MB, kind: "DOCUMENT", label: "DOCX", date: "Вчера", ref: () => hub.REPORT, pages: 1 },
    { name: "Объявления.txt", size: 0.01 * MB, kind: "TEXT", label: "TXT", date: "Вчера",
      text: "Семинар переносится\nна четверг, 15:00\n\nАудитория 214\nВзять ноутбуки" },
  ],
};
const sizeText = (b) => b >= GB ? (b / GB).toFixed(1).replace(".", ",") + " ГБ" : b >= MB ? Math.round(b / MB) + " МБ" : Math.max(1, Math.round(b / 1024)) + " КБ";

function openFile(f) {
  S.picker = null;
  if (!S.active || S.connection !== "connected") { render(); return toast("Сначала выберите экран"); }
  // Большие файлы не гоняются по Wi-Fi: долго, а место на приёмнике не бесконечно.
  if (f.big) { S.dialog = { type: "large", file: f }; return render(); }
  const info = S.rx.info;
  if (f.kind === "PRESENTATION" || f.kind === "DOCUMENT") {
    if (!info.convert) { render(); return toast("Этот экран не переводит презентации: сохраните файл как PDF или выберите компьютер"); }
    if (f.kind === "DOCUMENT" && !info.documents) { render(); return toast("Документы переводит компьютер с Microsoft Office или LibreOffice: сохраните файл как PDF"); }
    return send(f.name, f.size, () => {
      S.progress = `«${f.name}»: перевод в PDF…`;
      render();
      const title = f.name.replace(/\.[^.]+$/, "") + ".pdf";
      setTimeout(() => { S.progress = null; show({ kind: "pdf", ref: Object.assign({}, f.ref(), { name: title }), pages: f.pages, index: 0, title }); }, 1600);
    });
  }
  if (f.kind === "TEXT") return showText(f.text, f.name);
  if (f.kind === "PDF") return send(f.name, f.size, () => show({ kind: "pdf", ref: f.ref(), pages: f.pages, index: 0, title: f.name }));
  const ref = f.ref();
  const kind = ref.mime.startsWith("video/") ? "video" : "image";
  send(f.name, f.size, () => show({ kind, ref, title: f.name }));
}

// Свой файл с этого устройства: остаётся в браузере (hub.finishUpload).
$("pickDevice").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  if (!S.active || S.connection !== "connected") return toast("Сначала выберите экран");
  if (file.size > GB) { S.dialog = { type: "large", file: { name: file.name, size: file.size, own: file } }; return render(); }
  const n = file.name.toLowerCase();
  if (/\.(pptx?|odp|key|docx?|odt|rtf|xlsx?|ods)$/.test(n)) return toast("В симуляторе свои презентации и документы не переводятся: на ноутбуке это делает Deixis для компьютера");
  if (/\.txt$/.test(n) || file.type.startsWith("text/")) return showText(await file.text(), file.name);
  if (!/^(image|video|audio)\//.test(file.type) && !n.endsWith(".pdf")) return toast(`Формат «${file.name}» не поддерживается`);
  send(file.name, file.size, async () => {
    S.progress = `«${file.name}»: подготовка`; render();
    try {
      const ref = await hub.finishUpload({ name: file.name, chunks: [file] });
      S.progress = null;
      const f = hub.files[ref.sha256];
      if (ref.mime === "application/pdf") {
        if (!f.pages) return toast("PDF не открылся: библиотека PDF.js не загрузилась");
        show({ kind: "pdf", ref, pages: f.pages.length, index: 0, title: file.name });
      } else show({ kind: ref.mime.startsWith("image/") ? "image" : "video", ref, title: file.name });
    } catch (err) { S.progress = null; toast("Не удалось открыть файл"); }
  });
};

function qrSvg(text) {
  if (!window.qrcode) return `<svg viewBox="0 0 10 10" class="qr"></svg>`;
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount();
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}

  const r = hub.receivers.phone;
  el.innerHTML = `<div class="big">ΔΕΙΞΙΣ</div><div style="opacity:.85">${esc(r.info.name)}</div>
    <div style="display:flex;align-items:center;gap:16px;margin-top:10px"><div class="qrs">${qrSvg(`http://${r.address}/remote?pin=${r.pin}`)}</div>
    <div style="text-align:left"><div class="dim">PIN для подключения</div><div class="pin">${r.pin}</div><div class="dim">${r.address}</div></div></div>
    <div class="dim" style="margin-top:14px;max-width:260px">Наведите камеру телефона на QR-код — откроется пульт, приложение не нужно</div>
    <button class="back" data-act="screenBack">◁ Назад — выйти из режима экрана</button>`;
}

// ——— Нажатия ———
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, [data-close]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.close && (el.tagName === "BUTTON" || e.target === el)) {
    if (S.needPin) { S.needPin = null; S.connection = "denied"; }
    S.dialog = null; S.picker = null; render(); return;
  }
  if (ds.target) return select(S.targets.find((t) => t.id === ds.target));
  if (ds.pick) { S.picker = ds.pick; return render(); }
  if (ds.file) { const [k, i] = ds.file.split(":"); return openFile(FILES[k][Number(i)]); }
  if (ds.done) {
    const v = $("in-" + ds.done).value;
    if (!v.trim()) return;
    if (ds.done === "pin") { pair(v); return render(); }
    S.dialog = null;
    if (ds.done === "address") addManual(v);
    if (ds.done === "text") showText(v);
    return render();
  }
  if (ds.bar) {
    const a = ds.bar;
    if (a === "prev") step(-1); else if (a === "next") step(1);
    else if (a === "back10") video("SEEK", -10000); else if (a === "fwd10") video("SEEK", 10000);
    else if (a === "toggle") video(S.rxState && S.rxState.video && S.rxState.video.playing ? "PAUSE" : "PLAY");
    else if (a === "loop") video("LOOP");
    else if (a === "hprev" || a === "hnext") { const l = S.holy.live; if (l) { l.index = Math.max(0, Math.min(l.slides.length - 1, l.index + (a === "hnext" ? 1 : -1))); render(); } }
    else if (a === "hexit") { S.holy.remote = false; render(); }
    else mode(a);
    return;
  }
  if (ds.mod) {
    const b = S.bible, i = b.selected.indexOf(ds.mod);
    b.selected = i >= 0 ? b.selected.filter((x) => x !== ds.mod) : b.selected.length >= 2 ? [b.selected[0], ds.mod] : b.selected.concat(ds.mod);
    return render();
  }
  if (ds.v !== undefined) {
    const g = el.closest("[data-seg]").dataset.seg, v = ds.v;
    if (g === "caps") S.caps = v === "1";
    else if (g === "church") S.church = v === "1";
    else S.bible.options[g] = g === "versesPerSlide" ? Number(v) : v === "true" ? true : v === "false" ? false : v;
    return render();
  }
  if (ds.htab) { S.holy.tab = ds.htab; S.holy.query = ""; return render(); }
  if (ds.theme !== undefined) { S.holy.theme = ds.theme || null; return render(); }
  if (ds.h2d) { const [id, kind] = ds.h2d.split(":"); return holyToDeixis(findHoly(id), kind); }
  if (ds.h2h) return holyToHolyrics(findHoly(ds.h2h));
  const a = ds.act;
  if (!a) return;
  if (a === "address" || a === "text" || a === "settings" || a === "bible" || a === "holyrics") { S.dialog = a; return render(); }
  if (a === "viewers") { S.dialog = "viewers"; return render(); }
  if (a === "device") { S.picker = null; render(); return $("pickDevice").click(); }
  if (a === "share") return S.sharing ? stopShare() : startShare();
  if (a === "largeShare") { const f = S.dialog.file; S.dialog = null; render(); return startShare(f); }
  if (a === "screen") { S.screenMode = true; if (sim) sim.phoneScreen(true); return render(); }
  if (a === "screenBack") { S.screenMode = false; if (sim) sim.phoneScreen(false); return render(); }
  if (a === "addmod") return toast("В симуляторе модули не добавляются: на телефоне это файл MyBible .SQLite3");
  if (a === "bgo") return showScripture();
  if (a === "hconnect") {
    S.holy.status = "connecting"; render();
    return setTimeout(() => { S.holy.status = "on"; render(); }, 700);
  }
  if (a === "hoff") { S.holy = Object.assign(S.holy, { status: "off", remote: false, live: null }); return render(); }
  if (a === "hremote") { S.holy.remote = !S.holy.remote; return render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("input[data-input]")) { const b = document.querySelector("[data-done]"); if (b) b.click(); }
  if (e.key === "Enter" && e.target.id === "bref") showScripture();
  if (e.key === "Escape" && (S.dialog || S.picker || S.needPin)) { S.dialog = null; S.picker = null; S.needPin = null; render(); }
});
function findHoly(id) { return [...HOLY.songs, ...HOLY.texts, ...HOLY.images, ...HOLY.videos].find((x) => x.id === id); }
async function showScripture() {
  const b = S.bible;
  if (!b.selected.length) return toast("Выберите перевод");
  if (S.connection !== "connected") return toast("Сначала выберите экран");
  const r = await hub.bibleSlides({ ref: b.ref, modules: b.selected, options: b.options, style: {} });
  if (!r.ok) return toast(r.status === 422 ? `Не понял место «${b.ref}». Пример: Ин 3:16-18` : await r.text());
  const slides = await r.json();
  if (!slides.length) return toast("В переводе нет такого места");
  S.dialog = null;
  show({ kind: "scripture", slides, index: 0, title: b.ref });
}

// Зеркало для демонстрации экрана: в зал уходит копия того, что видно на телефоне.
let mirrorT = 0;
function mirrorSoon() {
  if (!sim || !S.sharing) return;
  clearTimeout(mirrorT);
  mirrorT = setTimeout(() => sim.mirror(document.documentElement.outerHTML, $("player").classList.contains("on") ? $("pvideo").currentTime : null), 60);
}
setInterval(mirrorSoon, 1000);

if (!hub) document.body.innerHTML = '<p class="hint">Эта страница работает внутри симулятора Deixis.</p>';
else { render(); discover(); }
</script>
</body>
