<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Deixis</title>
<style>
/* Токены вывода. Зал, титры и хромакей — содержимое; «Сцену» видит только ведущий, её подписи — оттенки тёмной темы. */
:root { --out-bg: #000000; --out-ink: #FFFFFF; --chroma: #00FF00; --tap-bg: rgba(0,0,0,.72); --l2: #8D8D93; --cell: #1C1C1E; --tint: #BC9361; --live: #B96E65;
        --t-mid: 240ms; --e-out: cubic-bezier(.2,.8,.2,1);
        --st-pad: 3.5vmin; --st-label: 3.2vmin; --st-clock: 17vmin; --st-timer: 8.5vmin; --st-note: 4.5vmin; --st-radius: 1.8vmin; --st-cur: 62%; }
@font-face { font-family: "Deixis Mark"; src: url("/view/assets/GFSDidot-Regular.ttf"); }
@font-face { font-family: "Deixis Slide"; src: url("/view/assets/NotoSans-SemiBold.ttf"); }
html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
body { font-family: -apple-system, "SF Pro Text", Roboto, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; background: #000; overflow: hidden; }
/* Видеофон под слайдом: свой элемент, не пересоздаётся при смене слайда — видео идёт без перерыва. */
#backdrop { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; opacity: 0; transition: opacity .5s; pointer-events: none; }
#backdrop.on { opacity: 1; }
#stage.over-video { background: transparent !important; }
#stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.mark { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2vh; }
.mark b { font-family: "Deixis Mark", Georgia, serif; font-weight: 400; letter-spacing: .18em; padding-left: .18em; }
.mark span { opacity: .55; font-size: 15px; }
.text { display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-align: center; text-wrap: balance; overflow-wrap: normal; hyphens: none;
        font-family: "Deixis Slide", system-ui, sans-serif; font-weight: 600; line-height: 1.2; white-space: pre-line; }
.text .t > div, .scripture .blocks > div > div { text-wrap: balance; }
.preview #bar, .preview #status { display: none !important; }
.text .ref { position: absolute; opacity: .75; text-transform: inherit; }
.scripture { display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; gap: .6em; text-align: center; text-wrap: balance; overflow-wrap: normal; hyphens: none;
             font-family: "Deixis Slide", system-ui, sans-serif; font-weight: 600; line-height: 1.2; overflow: hidden; }
.scripture .blocks { display: flex; flex-direction: column; gap: .6em; }
.scripture.side .blocks { flex-direction: row; gap: 4%; }
.scripture.side .blocks > div { flex: 1; }
.scripture .r { font-size: .55em; opacity: .75; }
img, video { object-fit: contain; background: #000; }
/* Обратный отсчёт: цифры одной ширины — строка не дрожит; поля — как у слайдов (5,5 % меньшей стороны). */
.cd { display: flex; flex-direction: column; padding: 5.5vmin; box-sizing: border-box; font-family: "Deixis Slide", system-ui, sans-serif; font-weight: 600; line-height: 1.1; }
.cd .num { font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; }
.cd .num.serif { font-family: "Deixis Mark", Georgia, serif; font-weight: 400; }
.cd .lbl { font-size: 7vmin; opacity: .9; }
/* Видео ложится как на остальных экранах: вписать, заполнить, растянуть, исходный размер; поля — чёрные, цвета темы или размытые. */
#stage video.fit-FILL { object-fit: cover; }
#stage video.fit-STRETCH { object-fit: fill; }
#stage video.fit-ORIGINAL { object-fit: none; }
#stage video.on-backdrop { background: transparent; }
#stage canvas.bd { filter: blur(3vmin) brightness(.55); transform: scale(1.1); }
.note { display: flex; align-items: center; justify-content: center; text-align: center; padding: 8%; box-sizing: border-box; opacity: .7; font-size: 16px; }
#bar { transition: opacity .24s; }
#bar.away { opacity: 0; }
#bar.away button { pointer-events: none; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px;
       padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
#bar button { pointer-events: auto; font: 600 15px/1 inherit; color: #fff; background: rgba(255,255,255,.16); border: 0;
       border-radius: 999px; height: 40px; padding: 0 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#status { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; font-size: 12px; opacity: 0; transition: opacity .24s; }
#status.on { opacity: .7; }
.hidden { display: none !important; }
/* Экран в браузере (?screen=1): только вывод — без кнопок, без подсказок связи, без курсора. */
.screen, .screen * { cursor: none !important; }
.screen #bar, .screen #status { display: none !important; }
.screen.layout-chroma, .screen.layout-chroma body { background: var(--chroma); }
#tap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8vmin; box-sizing: border-box; z-index: 2; }
#tap span { font-size: max(16px, 2.6vmin); text-align: center; color: var(--out-ink); background: var(--tap-bg); border-radius: 999px; padding: .6em 1.2em; }
/* На хромакее подпись непрозрачная: полупрозрачный текст после вырезания зелёного становится зелёным. */
.layout-chroma .text .ref, .layout-chroma .scripture .r { opacity: 1; }
/* Вид «Сцена»: сейчас крупно слева, далее справа, под ним часы и время показа. */
#stageView { position: absolute; inset: 0; display: flex; gap: var(--st-pad); padding: var(--st-pad); box-sizing: border-box; background: var(--out-bg); color: var(--out-ink); }
#stageView .col { display: flex; flex-direction: column; min-width: 0; }
#stageView .cur { flex: 0 0 calc(var(--st-cur) - var(--st-pad)); }
#stageView .side { flex: 1; }
#stageView .lbl { display: flex; justify-content: space-between; align-items: center; height: calc(var(--st-label) * 2); font-size: var(--st-label); color: var(--l2); }
#stageView .pill { background: var(--live); color: var(--out-ink); border-radius: 999px; padding: .15em .7em; }
#stageView .panel { position: relative; flex: 1; border-radius: var(--st-radius); background: var(--cell); overflow: hidden; }
#stageView .panel.slide { background: var(--out-bg); }
#stageView .next { flex: 0 0 auto; aspect-ratio: 16 / 9; max-height: 45%; }
#stageView .panel > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#stageView .panel > .text, #stageView .panel > .scripture { position: absolute; inset: 0; width: 100%; height: 100%; }
#stageView .pnote { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 5%; box-sizing: border-box; font-size: var(--st-note); color: var(--l2); }
#stageView .vid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.2em; padding: 0 8%; font-size: calc(var(--st-note) * 1.4); }
#stageView .vid .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stageView .vid .bar { height: .18em; border-radius: 999px; background: var(--l2); overflow: hidden; }
#stageView .vid .bar > div { height: 100%; width: 0; background: var(--tint); }
/* Квадратный и вертикальный экран: два перевода друг под другом, «Сцена» сверху вниз (как на компьютере). */
@media (max-aspect-ratio: 6/5) {
  .scripture.side .blocks { flex-direction: column; gap: .6em; }
  #stageView { flex-direction: column; }
  #stageView .cur { flex: 0 0 calc(var(--st-cur) - var(--st-pad)); }
  #stageView .next { aspect-ratio: auto; max-height: none; flex: 1; }
}
#stageView .clock { margin-top: auto; font-size: var(--st-clock); line-height: 1; font-variant-numeric: tabular-nums; }
#stageView .timer { font-size: var(--st-timer); line-height: 1.2; color: var(--tint); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<video id="backdrop" muted playsinline loop preload="auto"></video>
<div id="stage"></div>
<div id="status"></div>
<div id="bar"><button id="sound" class="hidden"></button><button id="full" class="hidden"></button></div>
<div id="tap" class="hidden"></div>
<script>
"use strict";
// Строки на трёх языках: русский (основной), узбекский латиницей, английский.
const STRINGS = {
  ru: { wait: "Ожидание показа", lost: "Нет связи, переподключение…", sound: "Включить звук", mute: "Выключить звук",
        full: "Во весь экран", videoHere: "Это видео идёт на основном экране", badKey: "Ссылка устарела. Отсканируйте QR-код заново.",
        screenHere: "Трансляция экрана идёт на основном экране",
        tap: "Нажмите, чтобы показывать на весь экран", now: "Сейчас", next: "Далее", noNext: "Нет следующего слайда",
        since: "С начала показа", black: "В зале чёрный экран", logo: "В зале логотип", clear: "В зале текст скрыт", screenShare: "Трансляция экрана" },
  uz: { wait: "Namoyish kutilmoqda", lost: "Aloqa yo‘q, qayta ulanmoqda…", sound: "Ovozni yoqish", mute: "Ovozni o‘chirish",
        full: "To‘liq ekran", videoHere: "Bu video asosiy ekranda ko‘rsatilmoqda", badKey: "Havola eskirgan. QR-kodni qayta skanerlang.",
        screenHere: "Ekran namoyishi asosiy ekranda ko‘rsatilmoqda",
        tap: "To‘liq ekranda ko‘rsatish uchun bosing", now: "Hozir", next: "Keyingi", noNext: "Keyingi slayd yo‘q",
        since: "Namoyish boshidan", black: "Zalda qora ekran", logo: "Zalda logotip", clear: "Zalda matn yashirilgan", screenShare: "Ekran namoyishi" },
  en: { wait: "Waiting for the show", lost: "Connection lost, reconnecting…", sound: "Turn sound on", mute: "Turn sound off",
        full: "Full screen", videoHere: "This video is playing on the main screen", badKey: "This link has expired. Scan the QR code again.",
        screenHere: "The screen is being shown on the main display",
        tap: "Tap to show full screen", now: "Now", next: "Next", noNext: "No next slide",
        since: "Since start", black: "Black screen in the hall", logo: "Logo in the hall", clear: "Text hidden in the hall", screenShare: "Screen sharing" },
};
const lang = (navigator.language || "ru").toLowerCase();
const t = STRINGS[lang.startsWith("uz") ? "uz" : lang.startsWith("ru") ? "ru" : (lang.startsWith("en") ? "en" : "ru")];
document.documentElement.lang = lang.slice(0, 2);

const params = new URLSearchParams(location.search);
const key = params.get("k") || "";
// Превью в пульте: та же картинка, что в зале, но без кнопок и без второй закачки видео по Wi-Fi.
const preview = params.get("preview") === "1";
if (preview) document.documentElement.classList.add("preview");
// Экран в браузере: страница становится выводом (ТВ с браузером, ноутбук, планшет). Раскладки — как у мониторов
// Deixis для компьютера: зал, «Сцена» (stage), титры на чёрном (lower) и на зелёном (chroma).
const screenMode = params.get("screen") === "1" && !preview;
const outLayout = screenMode ? ({ stage: "stage", lower: "lower", chroma: "chroma" }[params.get("layout")] || "hall") : "hall";
const captions = outLayout === "lower" || outLayout === "chroma";
if (screenMode) document.documentElement.classList.add("screen", "layout-" + outLayout);
const stage = document.getElementById("stage");
const status = document.getElementById("status");
const soundBtn = document.getElementById("sound");
const fullBtn = document.getElementById("full");
let lastKey = null, video = null, muted = true, current = null;

// Сцена 16:9 по центру экрана, как в зале. Текст занимает весь экран: так его удобно читать и с вертикального телефона.
function isText() { return current && current.content && (current.content.type === "text" || current.content.type === "scripture") && current.mode !== "BLACK" && current.mode !== "LOGO"; }
function layout() {
  const w = innerWidth, h = innerHeight;
  const full = isText() || captions || outLayout === "stage";
  const sw = full ? w : Math.min(w, h * 16 / 9), sh = full ? h : sw * 9 / 16;
  Object.assign(stage.style, { width: sw + "px", height: sh + "px", left: (w - sw) / 2 + "px", top: (h - sh) / 2 + "px" });
  if (current) fitText();
  if (outLayout === "stage") fitStage();
}
addEventListener("resize", layout);
// Шрифт слайда грузится с приёмника: после загрузки ширина букв другая, размер подбирается заново.
if (document.fonts) document.fonts.addEventListener("loadingdone", () => { fitText(); if (outLayout === "stage") fitStage(); });
layout();

const url = (path) => path + (path.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(key);
const argb = (n) => { const v = Number(n) >>> 0; return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${((v >>> 24) & 255) / 255})`; };

// «Логотип» — на всю ширину (как LogoMark в ядре); без показа — небольшой знак.
function mark(sub, full) {
  const d = document.createElement("div");
  d.className = "mark";
  const b = document.createElement("b");
  b.textContent = "ΔΕΙΞΙΣ";
  b.style.fontSize = (full ? Math.min(stage.clientWidth * 0.86 / 4.386, stage.clientHeight * 0.6) : stage.clientHeight * 0.13) + "px";
  d.append(b);
  if (sub) { const s = document.createElement("span"); s.textContent = sub; d.append(s); }
  return d;
}

function note(text) {
  const d = document.createElement("div");
  d.className = "note";
  // На экране вывода пояснений нет: вместо них чёрный экран.
  if (!screenMode) d.textContent = text;
  return d;
}

// Размер текста — доля высоты экрана, как на приёмнике; если не помещается, уменьшается.
function fitText() {
  const el = stage.querySelector(".text");
  const sc = stage.querySelector(".scripture");
  if (sc && current && current.content && current.content.type === "scripture") return fitBox(sc, current.content.style);
  if (!el || !current || !current.content || current.content.type !== "text") return;
  fitBox(el, current.content.style);
}

// Оформление слайда как в зале: цвет и картинка фона, выравнивание, обводка, тень, плашка под текстом.
const backdrop = document.getElementById("backdrop");
let backdropSha = null;
/** Видеофон слайда: тот же файл продолжает играть, другой — плавно сменяется, без фона — гаснет. */
function setBackdrop(ref) {
  const sha = ref && current && current.mode !== "BLACK" && current.mode !== "LOGO" && !preview ? ref.sha256 : null;
  stage.classList.toggle("over-video", !!sha);
  if (sha === backdropSha) return;
  backdropSha = sha;
  if (!sha) { backdrop.classList.remove("on"); setTimeout(() => { if (!backdropSha) { backdrop.pause(); backdrop.removeAttribute("src"); backdrop.load(); } }, 600); return; }
  backdrop.src = url("/view/file/" + sha);
  backdrop.play().catch(() => {});
  backdrop.classList.add("on");
}
function stageBackground(st) {
  stage.style.background = argb(st.background ?? 0xFF000000);
  if (st.backgroundImage) {
    stage.style.backgroundImage = `url("${url("/view/file/" + st.backgroundImage.sha256)}")`;
    stage.style.backgroundSize = "cover";
    stage.style.backgroundPosition = "center";
  }
}
function applyStyle(d, st, boxEl) {
  const flex = { LEFT: "flex-start", RIGHT: "flex-end", TOP: "flex-start", BOTTOM: "flex-end" };
  d.style.color = argb(st.color ?? 0xFFFFFFFF);
  d.style.textAlign = (st.align || "CENTER").toLowerCase();
  d.style.lineHeight = st.lineHeight || 1.2;
  if (d.classList.contains("text")) {
    d.style.justifyContent = flex[st.align] || "center";
    d.style.alignItems = flex[st.valign] || "center";
  } else {
    d.style.justifyContent = flex[st.valign] || "center";
  }
  if (st.outline) {
    d.style.webkitTextStroke = `${st.outlineWidth ?? 0.06}em ${argb(st.outlineColor ?? 0xE6000000)}`;
    d.style.paintOrder = "stroke fill";
  }
  if (st.shadow !== false) d.style.textShadow = `0 .04em .16em ${argb(st.shadowColor ?? 0xB4000000)}`;
  if (st.box != null && boxEl) {
    boxEl.style.background = argb(st.box);
    boxEl.style.padding = ".2em .35em";
    boxEl.style.borderRadius = ".1em";
    boxEl.style.boxDecorationBreak = boxEl.style.webkitBoxDecorationBreak = "clone";
  }
}

// Как в зале: поля от меньшей стороны экрана, одинаковые со всех краёв; наибольший размер, при котором
// текст помещается в поля без разрыва слов. Строки выравниваются по длине (text-wrap: balance).
function fitBox(el, style, box) {
  const st = style || {};
  const frame = box || stage;
  const short = Math.min(frame.clientWidth, frame.clientHeight);
  const pad = short * 0.055;
  // Поля оформления (тема Holyrics) соблюдаются, но не уже безопасных — как в зале.
  const m = st.margins || {}, W = frame.clientWidth, H = frame.clientHeight;
  const side = (p, of) => Math.max(pad, (p || 0) * of / 100);
  el.style.padding = `${side(m.top, H)}px ${side(m.right, W)}px ${side(m.bottom, H)}px ${side(m.left, W)}px`;
  // Подпись — своим кеглем от экрана, внутри полей; под неё оставлено место, как в зале.
  const refEl = el.querySelector(":scope > .ref");
  if (refEl) {
    const rs = short * 0.045;
    refEl.style.fontSize = rs + "px"; refEl.style.right = pad + "px"; refEl.style.bottom = pad + "px";
    el.style.paddingBottom = (side(m.bottom, H) + rs * 1.2 * 1.5) + "px";
  }
  el.style.textTransform = st.caps ? "uppercase" : "none";
  // Сравниваются настоящие границы текста с полем: центрированный текст вылезает и вверх, и вниз,
  // а scrollHeight видит только низ.
  const fits = (size) => {
    el.style.fontSize = size + "px";
    const box = el.getBoundingClientRect(), cs = getComputedStyle(el);
    const range = document.createRange();
    range.selectNodeContents(el);
    if (refEl) range.setEndBefore(refEl);
    const r = range.getBoundingClientRect();
    // Титры прижаты к низу: буквы шрифта выше строки 1.2 и выступают за неё на доли кегля — это не выход за поля.
    const tol = captions ? Math.max(1, size * 0.12) : 1;
    return r.top >= box.top + parseFloat(cs.paddingTop) - tol && r.bottom <= box.bottom - parseFloat(cs.paddingBottom) + tol
      && r.left >= box.left + parseFloat(cs.paddingLeft) - 1 && r.right <= box.right - parseFloat(cs.paddingRight) + 1
      && el.scrollWidth <= el.clientWidth + 1;
  };
  let lo = short * 0.015, hi = short * (st.sizePercent || 20) / 100;
  if (fits(hi)) return;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
  el.style.fontSize = lo + "px";
}

// Писание: один или два перевода (друг под другом или рядом), адрес у каждого или одной строкой, сверху или снизу.
function scripture(c, clear) {
  const st = c.style || {};
  stageBackground(st);
  if (clear) return;
  const d = scriptureEl(c, st);
  stage.append(d);
  fitBox(d, st);
}
function scriptureEl(c, st) {
  const d = document.createElement("div");
  d.className = "scripture" + (c.sideBySide ? " side" : "");
  const top = c.refPosition === "TOP";
  const ref = (text) => { const r = document.createElement("div"); r.className = "r"; r.textContent = text; return r; };
  if (c.ref && top) d.append(ref(c.ref));
  const blocks = document.createElement("div");
  blocks.className = "blocks";
  for (const b of c.blocks) {
    const bd = document.createElement("div");
    if (b.ref && top) bd.append(ref(b.ref));
    const t = document.createElement("div");
    t.textContent = b.text;
    bd.append(t);
    if (b.ref && !top) bd.append(ref(b.ref));
    blocks.append(bd);
  }
  d.append(blocks);
  if (c.ref && !top) d.append(ref(c.ref));
  applyStyle(d, st, blocks);
  return d;
}
function textEl(c, st) {
  const d = document.createElement("div");
  d.className = "text";
  const t = document.createElement("div");
  t.className = "t";
  // Каждая строка слайда — свой абзац: перенос выравнивается внутри него, как в зале.
  for (const line of c.text.split("\n")) { const p = document.createElement("div"); p.textContent = line; t.append(p); }
  d.append(t);
  applyStyle(d, st, t);
  if (c.ref) { const r = document.createElement("div"); r.className = "ref"; r.textContent = c.ref; d.append(r); }
  return d;
}

// Титры: текст и Писание внизу экрана на чёрном или на чистом зелёном; остальное в титры не попадает.
// Те же правила, что у монитора «Титры» и «Хромакей» в Deixis для компьютера.
function captionContent(c, mode) {
  if (mode !== "NORMAL" || !c || (c.type !== "text" && c.type !== "scripture")) return null;
  const chroma = outLayout === "chroma", src = c.style || {};
  const style = { background: chroma ? 0xFF00FF00 : 0xFF000000, color: 0xFFFFFFFF, sizePercent: 8, shadow: !chroma, outline: chroma,
