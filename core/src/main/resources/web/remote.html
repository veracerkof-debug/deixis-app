<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Deixis</title>
<link rel="apple-touch-icon" href="/remote/icon.png">
<link rel="manifest" href="/remote/manifest.webmanifest">
<style>
/* Пульт Deixis в браузере: тот же вид и те же функции, что у приложения на телефоне
   (prototype/index.html, android/phone/…/ShowScreen.kt, BibleScreen.kt, Sheets.kt, Themes.kt).
   Токены — DESIGN.md: цвета, размеры и движение задаются только здесь. */
@font-face { font-family: "Deixis Mark"; src: url("/view/assets/GFSDidot-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Deixis Slide"; src: url("/view/assets/NotoSans-SemiBold.ttf") format("truetype"); font-display: swap; }
:root {
  /* Цвета интерфейса */
  --bg: #F3F2EE; --cell: #FFFFFF; --ink: #161514; --l2: #87847E; --l3: #C6C3BC;
  --tint: #9C7242; --tint-text: #765A38; --red: #A75750; --live: #A75750; --gold: #A87A00; --on-tint: #FFFFFF;
  --sep: rgba(60,55,45,.15); --fill: rgba(120,115,105,.12); --fill2: rgba(120,115,105,.2);
  --scrim: rgba(0,0,0,.35); --scrim-strong: rgba(0,0,0,.45); --shadow-seg: 0 1px 3px rgba(0,0,0,.12); --shadow-toast: 0 6px 20px rgba(0,0,0,.18);
  --knob: #FFFFFF; --shadow-knob: 0 2px 4px rgba(0,0,0,.2); --mark-bg: rgba(120,115,105,.12);
  /* Вывод и полноэкранный просмотр: всегда тёмные, как зал */
  --slide-bg: #000000; --slide-ink: #FFFFFF; --slide-num: rgba(255,255,255,.75); --slide-shadow: rgba(0,0,0,.8); --slide-stroke: rgba(0,0,0,.9);
  --slide-glyph: #F3F2EE; --slide-glyph-frame: #333333; --slide-glyph-line: #D8D4CC; --slide-mark: #BC9361; --slide-num-bg: rgba(0,0,0,.45);
  --full-bg: #000000; --full-ink: #FFFFFF; --full-btn: rgba(255,255,255,.14); --full-press: rgba(255,255,255,.15); --full-tint: #BC9361; --full-live: #B96E65;
  --full-dim: rgba(255,255,255,.6); --full-line: rgba(255,255,255,.3); --load-bg: rgba(0,0,0,.62);
  --qr-bg: #FFFFFF;
  /* Образцы оформления слайда (те же значения уходят на экран в ARGB) */
  --sw-black: #000000; --sw-navy: #18233A; --sw-warm: #4A3420; --sw-green: #20443A; --sw-plum: #3A2A4A;
  --sw-white: #FFFFFF; --sw-paper: #F4EFE6; --sw-gold: #FFD43B; --sw-dark: #2B2620;
  /* Размеры */
  --g1: 2px; --g2: 4px; --g3: 6px; --g4: 8px; --g5: 10px; --g6: 12px; --g7: 14px; --gutter: 16px; --g10: 20px; --g12: 24px; --g16: 32px;
  --h-tab: 50px; --h-btn: 50px; --h-hero: 64px; --h-icon: 44px; --h-pill: 36px; --h-seg: 32px; --h-search: 40px; --h-dev: 36px;
  --h-go: 26px; --h-top: 56px; --h-row: 44px; --h-num: 44px; --h-bar: 50px; --h-step: 32px; --w-step: 44px;
  --w-tile: 116px; --h-tile: 84px; --w-kind: 28px; --w-sw: 30px; --w-switch: 51px; --h-switch: 31px; --w-knob: 27px; --knob-move: 20px;
  --w-qr: 148px; --w-qr-big: 220px; --w-dot: 8px; --w-grab: 36px; --h-grab: 5px; --w-badge: 14px;
  --w-rail: 92px; --h-rail-tab: 64px; --w-left: 400px; --w-set: 360px; --w-thumb: 180px; --w-theme: 112px; --w-side: 380px;
  --w-vnum: 36px; --w-liveline: 4px; --w-spin: 28px; --w-pair: 360px; --w-content: 900px; --w-ring: 3px;
  --i-m: 22px; --i-s: 17px; --i-bar: 20px; --i-tile: 24px; --i-search: 18px;
  --line: .5px; --ring: 2px;
  --fs-xs: 10px; --fs-tab: 11px; --fs-s: 12px; --fs-sm: 13px; --fs-sub: 14px; --fs-m: 15px; --fs-body: 17px; --fs-big: 18px; --fs-h2: 20px;
  --fs-mark: 22px; --fs-h1: 28px; --fs-code: 28px; --fs-room: 30px; --fs-pair-mark: 40px;
  --r-card: 12px; --r-btn: 14px; --r-seg: 9px; --r-seg-in: 7px; --r-pill: 999px; --r-sheet: 14px; --r-slide: 8px; --r-kind: 8px;
  --r-field: 10px; --r-full: 4px; --r-qr: 10px;
  --sheet-max: 88vh; --full-chrome: 200px; --sheet-w: 720px; --textarea-h: 150px; --editor-h: 260px;
  --f-mark: "Deixis Mark", "Didot", Georgia, serif;
  --f-ui: -apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --f-slide: "Deixis Slide", "Noto Sans", system-ui, sans-serif;
  /* Движение */
  --t-fast: 140ms; --t-mid: 240ms; --t-slow: 340ms; --t-spin: 1s;
  --e-out: cubic-bezier(.2,.8,.2,1); --e-in: cubic-bezier(.4,0,1,1); --e-spring: cubic-bezier(.3,1.35,.55,1);
  --press: .95; --press-soft: .97; --press-bar: .94; --press-icon: .92;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg: #000000; --cell: #1C1C1E; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
  --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65; --gold: #FFD43B;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1C1C1E; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
  --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65; --gold: #FFD43B;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); color-scheme: dark }
:root[data-theme="paper"] { --bg: #F4EFE6; --cell: #FBF8F2; --ink: #2B2620; }
:root[data-theme="oled"] {
  --bg: #000000; --cell: #0E0E10; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
  --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65; --gold: #FFD43B;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); color-scheme: dark }
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; --t-mid: 0ms; --t-slow: 0ms; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--fs-body)/1.35 var(--f-ui); letter-spacing: -.01em; overflow: hidden; user-select: none; -webkit-user-select: none;
       -webkit-text-size-adjust: 100%; transition: background var(--t-mid) var(--e-out), color var(--t-mid) var(--e-out);
       padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; cursor: pointer; padding: 0; touch-action: manipulation; }
input, textarea, select { font: inherit; color: var(--ink); letter-spacing: inherit; user-select: text; -webkit-user-select: text; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [role="button"]:focus-visible { outline: var(--ring) solid var(--tint); outline-offset: var(--ring); }
svg { display: block; }
.ico { width: var(--i-m); height: var(--i-m); stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hidden { display: none !important; }

/* Каркас: вкладки снизу на телефоне, полоса слева от 1024 px */
.app { display: grid; grid-template-rows: 1fr auto; height: 100%; }
main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.tabs { display: flex; background: var(--cell); border-top: var(--line) solid var(--sep); padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--g1); padding: var(--g3) 0; font-size: var(--fs-tab); color: var(--l2); min-height: var(--h-tab); min-width: 0; }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab[aria-current="page"] { color: var(--tint); }
.top { display: flex; align-items: center; gap: var(--g4); padding: var(--g5) var(--gutter) var(--g4); min-height: var(--h-top); flex: none; }
.top h1 { font-size: var(--fs-h1); line-height: 1.1; margin: 0; font-weight: 700; flex: 1; letter-spacing: -.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll { overflow: auto; min-height: 0; flex: 1; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.pad { padding: 0 var(--gutter) var(--g12); }
.wrapw { max-width: var(--w-content); }
.mark { font-family: var(--f-mark); letter-spacing: .18em; font-weight: 400; font-size: var(--fs-mark); line-height: 1; white-space: nowrap; }

.iconbtn { width: var(--h-icon); height: var(--h-icon); border-radius: var(--r-pill); display: grid; place-items: center; flex: none; transition: transform var(--t-fast) var(--e-spring), background var(--t-fast); }
.iconbtn:active { transform: scale(var(--press-icon)); background: var(--fill); }
.iconbtn.on { background: var(--fill2); color: var(--tint-text); }
.pill { height: var(--h-pill); padding: 0 var(--g7); border-radius: var(--r-pill); background: var(--fill); font-size: var(--fs-m); font-weight: 600; display: inline-flex; align-items: center; gap: var(--g3); white-space: nowrap; flex: none; transition: transform var(--t-fast) var(--e-spring); }
.pill:active { transform: scale(var(--press)); }
.pill.tint { background: var(--tint); color: var(--on-tint); }
.pill.live { background: var(--live); color: var(--on-tint); }
.pill.icon { width: var(--h-icon); height: var(--h-icon); padding: 0; justify-content: center; }
.pill .ico { width: var(--i-s); height: var(--i-s); }
.btn { min-height: var(--h-btn); border-radius: var(--r-btn); background: var(--fill); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: var(--g4); width: 100%; padding: 0 var(--g6); text-align: center; transition: transform var(--t-fast) var(--e-spring), background var(--t-fast); }
.btn:active { transform: scale(var(--press-soft)); }
.btn.tint { background: var(--tint); color: var(--on-tint); }
.btn.red { color: var(--red); }
.btn[disabled] { opacity: .4; pointer-events: none; }

.group { background: var(--cell); border-radius: var(--r-card); overflow: hidden; margin: 0 0 var(--g10); }
.ghead { font-size: var(--fs-sm); color: var(--l2); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 var(--g3) var(--gutter); }
.row { display: flex; align-items: center; gap: var(--g6); padding: var(--g5) var(--gutter); min-height: var(--h-row); width: 100%; text-align: left; position: relative; }
.row + .row::before, .row + .slides + .row::before { content: ""; position: absolute; top: 0; left: calc(var(--gutter) + var(--w-kind) + var(--g6)); right: 0; border-top: var(--line) solid var(--sep); }
.row .main { flex: 1; min-width: 0; text-align: left; }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s, .s { font-size: var(--fs-sub); color: var(--l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s.wrap, .row .s.wrap { white-space: normal; }
.row .kind { width: var(--w-kind); height: var(--w-kind); border-radius: var(--r-kind); display: grid; place-items: center; background: var(--fill); color: var(--tint-text); flex: none; font-size: var(--fs-s); font-weight: 700; }
.row .kind .ico { width: var(--i-s); height: var(--i-s); }
.row.open { background: var(--fill); }
.row[disabled] { opacity: .45; pointer-events: none; }
.tag { font-size: var(--fs-s); font-weight: 600; padding: var(--g1) var(--g4); border-radius: var(--r-pill); flex: none; white-space: nowrap; }
.tag.live { background: var(--live); color: var(--on-tint); }
.tag.pre { background: var(--fill2); color: var(--tint-text); }
.chev { color: var(--l3); flex: none; }

.seg { display: flex; background: var(--fill); border-radius: var(--r-seg); padding: var(--g1); gap: var(--g1); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1; min-height: var(--h-seg); border-radius: var(--r-seg-in); font-size: var(--fs-sub); font-weight: 500; padding: 0 var(--g5); white-space: nowrap; transition: background var(--t-fast); }
.seg button[aria-pressed="true"] { background: var(--cell); box-shadow: var(--shadow-seg); }
.mb { margin-bottom: var(--g10); }
.mbs { margin-bottom: var(--g6); }
.search { display: flex; align-items: center; gap: var(--g4); background: var(--fill); border-radius: var(--r-field); padding: 0 var(--g5); height: var(--h-search); margin: 0 0 var(--g5); }
.search input { flex: 1; border: 0; background: none; outline: none; min-width: 0; font-size: var(--fs-body); }
.search .ico { color: var(--l2); width: var(--i-search); height: var(--i-search); }

.switch { width: var(--w-switch); height: var(--h-switch); border-radius: var(--r-pill); background: var(--fill2); position: relative; flex: none; transition: background var(--t-mid) var(--e-out); }
.switch::after { content: ""; position: absolute; top: var(--g1); left: var(--g1); width: var(--w-knob); height: var(--w-knob); border-radius: var(--r-pill); background: var(--knob); box-shadow: var(--shadow-knob); transition: transform var(--t-mid) var(--e-spring); }
.switch[aria-checked="true"] { background: var(--tint); }
.switch[aria-checked="true"]::after { transform: translateX(var(--knob-move)); }
.stepper { display: flex; background: var(--fill); border-radius: var(--r-seg); flex: none; }
.stepper button { width: var(--w-step); height: var(--h-step); font-size: var(--fs-h2); }
.stepper span { min-width: var(--h-step); display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: var(--fs-m); }
.swatches { display: flex; gap: var(--g4); flex: none; flex-wrap: wrap; justify-content: flex-end; }
.sw { width: var(--w-sw); height: var(--w-sw); border-radius: var(--r-pill); border: var(--line) solid var(--sep); }
.sw[aria-pressed="true"] { outline: var(--ring) solid var(--tint); outline-offset: var(--ring); }

/* Слайд: пропорции вывода 16:9, текст подбирается под размер, как в зале */
.slide { position: relative; aspect-ratio: var(--screen-ratio, 16 / 9); width: 100%; border-radius: var(--r-slide); overflow: hidden; background: var(--sl-bg, var(--slide-bg)) center / cover no-repeat;
         color: var(--sl-ink, var(--slide-ink)); container-type: inline-size; display: flex; align-items: center; justify-content: center; font-family: var(--f-slide); }
.slide.v-TOP { align-items: flex-start; } .slide.v-BOTTOM { align-items: flex-end; }
.slide img, .slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.slide .bgimg { object-fit: cover; }
.slide .txt { position: relative; padding: 5cqw 5.5cqw; text-align: center; white-space: pre-line; line-height: 1.2; max-width: 100%; overflow-wrap: break-word; }
.slide.a-LEFT .txt, .slide.a-LEFT .sc { text-align: left; } .slide.a-RIGHT .txt, .slide.a-RIGHT .sc { text-align: right; }
.slide.a-LEFT { justify-content: flex-start; } .slide.a-RIGHT { justify-content: flex-end; }
.slide.boxed .txt, .slide.boxed .sc { background: var(--sl-box); border-radius: 1cqw; padding: 2cqw 3cqw; max-width: 92%; }
.slide.shadow .txt, .slide.shadow .sc { text-shadow: 0 .3cqw 1.2cqw var(--slide-shadow); }
.slide.outline .txt, .slide.outline .sc { -webkit-text-stroke: .15cqw var(--slide-stroke); paint-order: stroke fill; }
.slide.caps .txt, .slide.caps .sc { text-transform: uppercase; }
.slide .sc { position: relative; padding: 5.5cqw; display: flex; flex-direction: column; gap: 2cqw; text-align: center; line-height: 1.25; width: 100%; white-space: pre-line; }
.slide .sc .cols { display: flex; gap: 4cqw; text-align: left; }
.screen-tall .slide .sc .cols { flex-direction: column; text-align: inherit; }
.slide .sc .cols > div { flex: 1; min-width: 0; }
.slide .sc .r { font-size: .6em; opacity: .8; }
.slide .mk { font-family: var(--f-mark); letter-spacing: .18em; font-size: 7cqw; color: var(--slide-ink); }
.slide .num { position: absolute; left: var(--g3); top: var(--g2); font-size: var(--fs-tab); color: var(--slide-num); font-weight: 600; font-family: var(--f-ui); z-index: 2; background: var(--slide-num-bg); border-radius: var(--r-pill); padding: 0 var(--g3); }
.slide .lbl { position: absolute; right: var(--g3); top: var(--g2); font-size: var(--fs-xs); color: var(--slide-num); font-family: var(--f-ui); z-index: 2; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slide .vid { position: absolute; right: 3cqw; bottom: 3cqw; font-size: max(var(--fs-xs), 4cqw); font-family: var(--f-ui); color: var(--slide-num); z-index: 2; font-variant-numeric: tabular-nums; }
.slide .ph { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2cqw; font-family: var(--f-ui); font-size: max(var(--fs-xs), 4.5cqw); color: var(--slide-num); padding: 4cqw; text-align: center; overflow: hidden; }
.slide .ph .ico { width: 12cqw; height: 12cqw; min-width: var(--i-s); min-height: var(--i-s); }
.slide .ph span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80cqw; }
.slide .glyph { width: 22%; aspect-ratio: 9 / 19; border-radius: 2.4cqw; background: var(--slide-glyph); border: .6cqw solid var(--slide-glyph-frame); display: flex; flex-direction: column; gap: 1cqw; padding: 2cqw 1.6cqw; }
.slide .glyph i { display: block; height: 1.4cqw; border-radius: 1cqw; background: var(--slide-glyph-line); }
.slide .glyph b { display: block; flex: 1; border-radius: 1cqw; background: var(--slide-mark); opacity: .7; }
.slide .empty { font-family: var(--f-ui); font-size: max(var(--fs-s), 5cqw); color: var(--slide-num); padding: 4cqw; text-align: center; }
/* Загрузка файла поверх «Сейчас»: кольцо и проценты; в зале в это время остаётся прежний слайд */
.slide .load { position: absolute; inset: 0; background: var(--load-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--g2); z-index: 3; font-family: var(--f-ui); color: var(--full-ink); font-size: var(--fs-sm); font-weight: 600; }
.slide .load i { display: block; flex: none; width: var(--w-spin); height: var(--w-spin); border-radius: var(--r-pill); border: var(--w-ring) solid var(--tint); border-right-color: transparent; animation: spin var(--t-spin) linear infinite; }
.slide .load small { font-weight: 400; opacity: .8; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-s); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Окна «Сейчас» и «Предпросмотр» */
.mons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g5); padding: 0 var(--gutter) var(--g6); }
.mon { display: flex; flex-direction: column; gap: var(--g3); min-width: 0; }
.mon .lbl { display: flex; align-items: center; gap: var(--g3); font-size: var(--fs-sm); color: var(--l2); font-weight: 600; min-height: var(--h-go); }
.mon .lbl .dot { width: var(--w-dot); height: var(--w-dot); border-radius: var(--r-pill); background: var(--live); }
.mon .lbl .dot.off { background: var(--l3); }
.mon [data-g] { touch-action: none; cursor: pointer; transition: transform var(--t-fast) var(--e-spring); border-radius: var(--r-slide); }
.mon [data-g]:active { transform: scale(.98); }
.mon.now .slide { outline: var(--ring) solid var(--live); outline-offset: var(--ring); }
.mon.now.off .slide { outline-color: var(--l3); }
.mon.pre .slide { outline: var(--ring) dashed var(--l3); outline-offset: var(--ring); }
.mon .hint { font-size: var(--fs-s); color: var(--l2); min-height: var(--gutter); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mon .hint.warn { color: var(--red); }
.mon .go { margin-left: auto; height: var(--h-go); padding: 0 var(--g5); font-size: var(--fs-sm); border-radius: var(--r-pill); background: var(--tint); color: var(--on-tint); font-weight: 600; }
.mon .go[disabled] { opacity: .35; pointer-events: none; }
.changed { color: var(--tint-text); }
#net { display: none; margin: 0 var(--gutter) var(--g6); background: var(--fill2); border-radius: var(--r-card); padding: var(--g5) var(--g6); font-size: var(--fs-sub); }
#net.on { display: block; }
#net .btn { margin-top: var(--g4); min-height: var(--h-icon); }

/* Темы оформления */

         display: flex; flex-direction: column; transform: translateY(100%); transition: transform var(--t-slow) var(--e-out); padding-bottom: env(safe-area-inset-bottom); }
.sheet.on { transform: none; }
.sheet.closing { transition: transform var(--t-mid) var(--e-in), opacity var(--t-mid) var(--e-in); }
.sheet .grab { padding: var(--g4) 0 var(--g2); touch-action: none; cursor: grab; }

.sheet .sb { overflow: auto; padding: 0 var(--gutter) var(--g10); -webkit-overflow-scrolling: touch; }
textarea.big { width: 100%; min-height: var(--textarea-h); border: 0; border-radius: var(--r-card); background: var(--cell); padding: var(--g6) var(--g7); resize: vertical; outline: none; font-size: var(--fs-body); }
textarea.big.tall { min-height: var(--editor-h); }
.field { width: 100%; height: var(--h-btn); border: 0; border-radius: var(--r-card); background: var(--cell); padding: 0 var(--g7); outline: none; font-size: var(--fs-body); }
.field::placeholder, textarea::placeholder, .search input::placeholder { color: var(--l3); }

        transition: opacity var(--t-slow) var(--e-out), transform var(--t-slow) var(--e-out); color: var(--full-ink); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

.full .stage .fit { width: min(100%, calc((100vh - var(--full-chrome)) * var(--screen-ratio, 16 / 9))); }

.full .fb .btn { background: var(--full-btn); color: var(--full-ink); flex: 1; min-width: 0; }
.full .fb .btn.tint { background: var(--full-tint); }
.full .cnt { font-size: var(--fs-sub); opacity: .7; font-variant-numeric: tabular-nums; }
.full .iconbtn { color: var(--full-ink); }
.full .iconbtn:active { background: var(--full-press); }
.full .tag.live { background: var(--full-live); }
.full .note { color: var(--full-dim); text-align: center; }
.full .vrow { color: var(--full-dim); padding: 0 var(--g6); }

.toasts { position: fixed; top: calc(var(--g5) + env(safe-area-inset-top)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: var(--g3); z-index: 40; pointer-events: none; }

.qr { width: var(--w-qr); height: var(--w-qr); background: var(--qr-bg); border-radius: var(--r-qr); padding: var(--g2); flex: none; }

.room { display: flex; gap: var(--gutter); align-items: center; padding: var(--gutter); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-property: opacity !important; }
  .sheet { transform: none; opacity: 0; } .sheet.on { opacity: 1; }
  .full { transform: none; }
}

/* Телефон горизонтально и половина окна: две колонки */
@media (min-width: 700px) {
  .cols { flex-direction: row; }
  .cols > .left { width: 42%; max-width: var(--w-left); display: flex; flex-direction: column; border-right: var(--line) solid var(--sep); }

  .cols > .right { min-width: 0; }
  .sheet { left: 50%; right: auto; width: min(var(--sheet-w), calc(100% - 2 * var(--g12))); transform: translate(-50%, 100%); }
  .sheet.on { transform: translate(-50%, 0); }
}
@media (min-width: 700px) and (max-height: 500px) {
  .cols > .left .mons { grid-template-columns: 1fr 1fr; }
}
/* Окно от 1024 px (компьютер, планшет): полоса слева, три колонки — показ, слайды, сетлист */
@media (min-width: 1024px) {
  .app { grid-template-columns: var(--w-rail) 1fr; grid-template-rows: 1fr; }
  .tabs { order: -1; flex-direction: column; border-top: 0; border-right: var(--line) solid var(--sep); padding: var(--g6) 0; justify-content: flex-start; gap: var(--g3); }
  .tab { flex: none; min-height: var(--h-rail-tab); }
  .cols > .left { order: 3; border-right: 0; border-left: var(--line) solid var(--sep); width: var(--w-left); max-width: none; flex: none; }
  .cols > .right { order: 1; flex: none; width: var(--w-set); border-right: var(--line) solid var(--sep); }
  .colslides { display: block; order: 2; flex: 1; overflow: auto; min-width: 0; }

  .colslides .top { min-height: var(--h-icon); }
  .wide-hide { display: none !important; }
  .bcols > .bside { display: flex; flex-direction: column; width: var(--w-side); flex: none; border-left: var(--line) solid var(--sep); padding-top: var(--g6); }
  .bcols > .bside .mons { grid-template-columns: 1fr; }
  .sheet { top: 50%; bottom: auto; border-radius: var(--r-sheet); transform: translate(-50%, -46%); opacity: 0; transition: transform var(--t-slow) var(--e-out), opacity var(--t-slow) var(--e-out); }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .grab { display: none; }
  .sheet .sh { padding-top: var(--g6); }
  .pad, .top { padding-left: var(--g12); padding-right: var(--g12); }
}
@media (max-width: 1023px) { .wide-only { display: none !important; } }
@media (max-width: 380px) { .bar button { font-size: var(--fs-xs); } .tile { width: calc(var(--w-tile) - var(--g6)); } }
</style>

let shownKey = "";
function onState(s, welcome) {

// Экран подтвердил показ, если пришло то же содержимое (сравниваются тип, текст, файл и страница).
function matches(a, b) {
  if (!a || !b || a.type !== b.type) return false;
  if (a.type === "text") return a.text === b.text;
  if (a.type === "pdf") return a.file.sha256 === b.file.sha256 && a.page === b.page;
  if (a.file && b.file) return a.file.sha256 === b.file.sha256;
  if (a.type === "scripture") return JSON.stringify(a.blocks) === JSON.stringify(b.blocks);
  return true;
}
const mode = () => (state && state.mode) || "NORMAL";

const S = {

const typeName = (k) => ({ pres: t.tPres, video: t.tVideo, photo: t.tPhoto, file: t.tFile, song: t.tSong, text: t.tText, bible: t.tBible }[k] || k);

// Слайды элемента — не хранятся, а строятся: текст, место Писания, страница PDF, фото, видео.
function slidesOf(it) {
  if (!it) return [];
  if (it.texts) return it.texts.map((text, i) => ({ text, label: it.labels ? it.labels[i] : null }));
  if (it.type === "bible") return SCR[pickKey(it.pick)] || [];
  if (it.ref && it.ref.mime === "application/pdf") return Array.from({ length: Math.max(1, it.pages || 1) }, (_, page) => ({ page }));
  if (it.type === "photo") return [{ image: true }];
  if (it.type === "video") return [{ video: true }];
  return [];
}
/** Источник показа: элемент библиотеки или разовый (Библия, текст, Holyrics). */
const srcOf = (it) => ({ id: it.id, title: it.title, type: it.type, slides: slidesOf(it), style: it.style || null, pick: it.pick || null, ref: it.ref || null, item: it });
const fresh = (cue) => (cue && cue.src.id && item(cue.src.id) ? Object.assign({}, cue, { src: srcOf(item(cue.src.id)) }) : cue);
const slideOf = (cue) => cue && cue.src.slides[cue.idx];
const sameCue = (a, b) => !!(a && b && a.idx === b.idx && (a.src === b.src || (a.src.id && a.src.id === b.src.id) || (a.src.pick && b.src.pick && pickKey(a.src.pick) === pickKey(b.src.pick))));
const liveVisible = () => S.live && mode() !== "BLACK";

// Писание: слайды строит экран (одни правила для всех платформ), пульт их кэширует.
const SCR = {};
const pickKey = (p) => (p ? [p.book, p.chapter, p.from, p.to, (p.modules || []).join(","), JSON.stringify(p.options || {})].join("|") : "");
async function scripture(pick) {
  const k = pickKey(pick);
  if (SCR[k]) return SCR[k];
  const res = await postJson("/bible/slides", { book: pick.book, chapter: pick.chapter, from: pick.from, to: pick.to, modules: pick.modules, options: pick.options || BIBLE_OPTIONS, style: {} });
  return (SCR[k] = res.map((sc) => ({ scripture: sc })));
}
async function ensureScripture(it) {
  if (!it || it.type !== "bible" || !it.pick || SCR[pickKey(it.pick)]) return;
  try { await scripture(it.pick); render(); } catch (e) { /* модуль удалён — элемент останется без слайдов */ }
}

const DEFAULT_STYLE = { background: 0xFF000000, color: 0xFFFFFFFF, sizePercent: 20, shadow: true, outline: false, caps: false, align: "CENTER", valign: "MIDDLE", box: null, backgroundImage: null };
/** Оформление: слайд → элемент → сетлист → тема элемента → всегда (как Controller.styleFor). */
function styleFor(cue) {
  const id = cue && cue.src && cue.src.id, st = D.styles, set = activeSet();
  const base = (id && (st[`slide:${id}:${cue.idx}`] || st[`item:${id}`]))
    || (set && (!id || set.items.includes(id)) && st[`set:${set.id}`])
    || (cue && cue.src && cue.src.style) || st.all || DEFAULT_STYLE;
  return Object.assign({}, DEFAULT_STYLE, base);
}
const withCaps = (st) => (settings.caps ? Object.assign({}, st, { caps: true }) : st);

// Содержимое слайда в формате протокола (Controller.contentFor).
function contentOf(cue, st) {
  const sl = slideOf(cue);
  if (!sl) return null;
  const it = cue.src;
  const style = withCaps(st || styleFor(cue));
  if (sl.text != null) return { type: "text", text: sl.text, style };
  if (sl.scripture) return Object.assign({}, sl.scripture, { type: "scripture", style });
  if (sl.page != null && it.ref) return { type: "pdf", file: it.ref, page: sl.page };
  if (sl.image && it.ref) return { type: "image", file: it.ref };
  if (sl.video && it.ref) return { type: "video", file: it.ref, startMs: Math.max(0, Math.round(cue.startMs || 0)) };
  return null;
}
/** Следующий слайд для вида «Сцена»: только то, что не требует передачи файла. */
function nextOf(cue) {
  const n = { src: cue.src, idx: cue.idx + 1 };
  const sl = slideOf(n);
  if (!sl || sl.image || sl.video) return null;
  const c = contentOf(n);
  if (c && c.style) c.style = Object.assign({}, c.style, { backgroundImage: null });
  return c;
}
const filesOf = (c) => [c && c.file, c && c.style && c.style.backgroundImage].filter(Boolean);

// Файл должен быть на экране: если экран его удалил (хранит сутки), а файл ещё открыт в этом сеансе — передаётся снова.
async function ensureOnReceiver(ref) {
  if (DELIVERED.has(ref.sha256)) return true;
  try {
    const st = await getJson("/files/" + ref.sha256);
    if (st.complete) { DELIVERED.add(ref.sha256); return true; }
  } catch (e) { return true; }
  const f = LOCAL_FILE[ref.sha256];
  if (!f) { toast(tf("fileGone", ref.name)); return false; }
  try { await upload(f); DELIVERED.add(ref.sha256); return true; } catch (e) { toast(e.message || t.failed); return false; }
}

let sendSeq = 0;
async function goLive(cue, quiet) {
  if (!cue) return false;
  if (!online) { toast(t.lost); reconnectNow(); return false; }
  cue = fresh(cue);
  if (cue.src.type === "bible" && !cue.src.slides.length && cue.src.pick) {
    try { await scripture(cue.src.pick); cue = cue.src.id ? fresh(cue) : Object.assign({}, cue, { src: Object.assign({}, cue.src, { slides: SCR[pickKey(cue.src.pick)] }) }); }
    catch (e) { toast(e.message || t.failed); return false; }
  }
  const seq = ++sendSeq;
  const content = contentOf(cue);
  if (!content) { toast(t.notReady); return false; }
  for (const ref of filesOf(content)) if (!(await ensureOnReceiver(ref))) return false;
  // Пока файл шёл, в зал могли отправить другое: устаревший слайд не показывается.
  if (seq !== sendSeq) return false;
  if (!send({ type: "show", content, next: nextOf(cue) })) return false;
  S.live = cue;
  if (S.pre && sameCue(S.pre, cue)) S.pre = null;
  if (cue.src.id) D.recent = [cue.src.id, ...D.recent.filter((x) => x !== cue.src.id)].slice(0, 12), saveData();
  // Если экран не подтвердил показ за 4 секунды — подпись красным: оператор видит, что в зале не то.
  if (awaiting) clearTimeout(awaiting.timer);
  awaiting = { content, timer: setTimeout(() => { awaiting = null; S.warn = t.notConfirmed; render(); }, 4000) };
  S.warn = null;
  if (!quiet && FULL) FULL.update();
  render();
  return true;
}
function toPreview(cue) { S.pre = cue; render(); }
function tapSlide(src, idx) {
  const cue = { src, idx };
  if (S.live && S.live.src.id && S.live.src.id === src.id && !settings.alwaysPre) goLive(cue);
  else toPreview(cue);
}
function step(d) {
  if (S.tab === "bible" && BD.chapter && (!S.live || S.live.src.pick)) return bibleStep(d);
  const cue = fresh(S.live);
  if (!cue) return;
  const i = cue.idx + d;
  if (i < 0 || i >= cue.src.slides.length) return;
  goLive({ src: cue.src, idx: i });
}
function setMode(m) {
  if (!online) { toast(t.lost); return; }
  send({ type: "mode", mode: mode() === m ? "NORMAL" : m });
}
function video(action, arg) {
  const v = state && state.video;
  if (action === "SEEK") send({ type: "video", action, positionMs: Math.max(0, Math.round(arg)) });
  else if (action === "LOOP") send({ type: "video", action, loop: !(v && v.loop) });
  else if (action === "VOLUME") send({ type: "video", action, volume: arg });
  else send({ type: "video", action });
}
function applyDraft(scope) {
  const st = S.draft;
  if (!st) return;
  const cue = S.pre || S.live, id = cue && cue.src.id, set = activeSet();
  const key = scope === "slide" && id ? `slide:${id}:${cue.idx}` : scope === "item" && id ? `item:${id}` : scope === "set" && set ? `set:${set.id}` : "all";
  D.styles[key] = Object.assign({}, st, { caps: false });
  if (key === "all") for (const k of Object.keys(D.styles)) if (k.startsWith("set:")) delete D.styles[k];
  saveData();
  S.draft = null;
}
async function preToLive() {
  if (S.draft) {
    applyDraft(S.draftScope);
    if (!S.pre && S.live) { const l = slideOf(S.live); if (l && (l.text != null || l.scripture)) goLive(S.live, true); toast(t.styleLive); render(); return; }
  }
  if (S.pre) { if (await goLive(S.pre)) toast(t.inHall); } else render();
}

// Деление текста на слайды: пустая строка — новый слайд, не больше 4 строк на слайд (как в приложении).
function splitSlides(text) {
  const out = [];
  for (const block of String(text).replace(/\r\n/g, "\n").split(/\n\s*\n/)) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i += 4) out.push(lines.slice(i, i + 4).join("\n"));
  }
  return out;
}

// ——— Файлы: загрузка с докачкой, хэш считает экран ———
const kindOf = (f) => {
  const n = f.name.toLowerCase();
  if (/\.(pptx?|pptm|ppsx?|potx?|odp|key)$/.test(n)) return "pptx";
  if (/\.(docx?|odt|rtf|xlsx?|ods)$/.test(n)) return "doc";
  if (/\.sqlite3$/.test(n)) return "module";
  if (f.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/.test(n)) return "image";
  if (f.type.startsWith("video/") || f.type.startsWith("audio/") || /\.(mp4|mov|mkv|avi|webm|m4v|wmv|mp3|wav|m4a)$/.test(n)) return "video";
  if (f.type === "application/pdf" || n.endsWith(".pdf")) return "pdf";
  if (f.type.startsWith("text/") || n.endsWith(".txt")) return "text";
  return null;
};
function setProgress(name, text, pct) {
  S.progress = name == null ? null : { name, text, pct };
  const el = $("#loadNow");
  if (el && S.progress) { el.innerHTML = loadInner(); return; }
  render();
}
async function upload(file) {
  if (file.size > GB) throw new Error(t.tooBig);
  const key = "up:" + file.name + ":" + file.size + ":" + file.lastModified;
  let id = store.get(key, null);
  if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join(""); store.set(key, id); }
  setProgress(file.name, t.sending, 0);
  try {
    let offset = (await getJson("/upload/" + id)).bytes || 0;
    const CHUNK = 4 * 1024 * 1024;
    for (let attempt = 0; ; ) {
      setProgress(file.name, t.sending, Math.floor((offset / Math.max(1, file.size)) * 100));
      try {
        const end = Math.min(file.size, offset + CHUNK);
        const r = await authed(`/upload/${id}?offset=${offset}`, {
          method: "PUT", body: file.slice(offset, end),
          headers: { "Deixis-Size": String(file.size), "Deixis-Name": encodeURIComponent(file.name), "Content-Type": "application/octet-stream" },
        });
        const j = await r.json();
        if (j.file) { store.set(key, null); LOCAL_FILE[j.file.sha256] = file; DELIVERED.add(j.file.sha256); return j.file; }
        offset = j.bytes;
        attempt = 0;
      } catch (e) {
        // Обрыв Wi-Fi: спросить, сколько дошло, и продолжить с того места.
        if (++attempt > 5) throw e;
        await new Promise((res) => setTimeout(res, 800 * attempt));
        offset = (await getJson("/upload/" + id)).bytes || 0;
      }
    }
  } finally {
    setProgress(null);
  }
}
// Фото с iPhone: HEIC переводится в JPEG (его откроет любой экран), снимки больше 4K уменьшаются —
// передача в разы быстрее, а на экране зала разницы не видно. Поворот по EXIF браузер учитывает сам.
async function preparePhoto(file) {
  const heic = /\.(heic|heif)$/i.test(file.name) || /heic|heif/i.test(file.type);
  if (!heic && file.size < 6 * 1024 * 1024) return file;
  setProgress(file.name, t.preparing, null);
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await img.decode();
    URL.revokeObjectURL(url);
    const MAX = 3840;
    const k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    if (!heic && k === 1) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
    if (!blob) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg", lastModified: file.lastModified });
  } catch (e) {
    return file; // браузер не смог прочитать — отправляем как есть, экран попробует сам
  } finally {
    setProgress(null);
  }
}
function videoDuration(file) {
  return new Promise((res) => {
    const v = document.createElement("video");
    const url = URL.createObjectURL(file);
    const done = (ms) => { res(ms); v.removeAttribute("src"); v.load(); };
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => done(isFinite(v.duration) ? Math.round(v.duration * 1000) : 0);
    v.onerror = () => done(0);
    setTimeout(() => done(0), 4000);
    v.src = url;
    LOCAL_KEEP.push(url);
  });
}
const LOCAL_KEEP = [];

/** Файл с устройства в библиотеку: передаётся на экран; презентация и документ переводятся там в PDF. */
async function importFile(file) {
  const kind = kindOf(file);
  if (!kind) { toast(t.unsupported); return null; }
  if (kind === "module") { await installModule(file); return null; }
  if (kind === "text") {
    const texts = splitSlides(await file.text());
    if (!texts.length) { toast(t.empty); return null; }
    return addItem({ id: newId(), type: "text", title: file.name.replace(/\.[^.]+$/, ""), texts });
  }
  if (kind === "pptx" && !(receiver && receiver.convert)) { toast(t.pptx); return null; }
  if (kind === "doc" && !(receiver && receiver.documents)) { toast(t.docs); return null; }
  if (kind === "pptx" || kind === "doc") {
    // Презентацию или документ переводит в PDF сам экран; неточный перевод не прячется — пульт показывает предупреждение.
    const src = await upload(file);
    setProgress(file.name, t.converting, null);
    try {
      const r = await postJson("/convert", src);
      if (r.warning) toast(r.warning);
      DELIVERED.add(r.file.sha256);
      return addItem({ id: newId(), type: kind === "pptx" ? "pres" : "file", title: file.name, ref: r.file, pages: r.pages, src, size: file.size });
    } finally { setProgress(null); }
  }
  const ready = kind === "image" ? await preparePhoto(file) : file;
  const durationMs = kind === "video" ? await videoDuration(file) : 0;
  const ref = await upload(ready);
  if (kind === "image" || kind === "video") LOCAL[ref.sha256] = URL.createObjectURL(ready);
  if (kind === "pdf") {
    let pages = 1;
    try { pages = (await getJson(`/pdf/${ref.sha256}/pages`)).pages || 1; } catch (e) { toast(t.pdfPages); }
    return addItem({ id: newId(), type: "file", title: file.name, ref, pages, size: file.size });
  }
  return addItem({ id: newId(), type: kind === "image" ? "photo" : "video", title: file.name, ref, size: ready.size, durationMs });
}
function addItem(it) {
  D.items.unshift(it);
  saveData();
  return it;
}

// ——— Библия: открытая глава, выбранные стихи, переводы, поиск и история (BibleDesk.kt) ———
const NEW_TESTAMENT = 470; // в MyBible Новый Завет начинается с Евангелия от Матфея
const BD = { ready: false, selected: [], chapter: null, mark: null, query: "", hits: null, ref: null, more: false, searchOpen: false, searching: false, scrollTo: null, books: {} };
const bibleOptions = () => settings.bible.options;

async function loadModules(force) {
  if (S.mods && !force) return S.mods;
  try { S.mods = await getJson("/bible"); } catch (e) { S.mods = []; }
  return S.mods;
}
async function bibleEnsure() {
  if (BD.ready) return;
  const mods = await loadModules();
  if (!mods.length) { render(); return; }
  BD.ready = true;
  const has = (f) => mods.some((m) => m.file === f);
  let sel = settings.bible.selected.filter(has);
  if (!sel.length) sel = DEFAULT_BIBLES.filter(has);
  if (!sel.length) sel = [mods[0].file];
  BD.selected = sel.slice(0, 2);
  const [b, c] = settings.bible.last || [500, 3];
  await bibleOpen(b, c);
}
async function booksOf(file) {
  if (!BD.books[file]) BD.books[file] = await getJson("/bible/books?module=" + encodeURIComponent(file));
  return BD.books[file];
}
/** Открывает главу; [then] — после загрузки (например выбрать стихи и показать). */
async function bibleOpen(book, chapter, verse, then) {
  if (!BD.selected.length) return;
  try {
    const ch = await getJson(`/bible/chapter?modules=${encodeURIComponent(BD.selected.join(","))}&book=${book}&chapter=${chapter}`);
    BD.chapter = ch;
    settings.bible.last = [book, chapter]; save();
    BD.mark = verse ? [verse, verse] : null;
    BD.scrollTo = verse || null;
    if (then) await then();
    render();
  } catch (e) {
    // Книги нет во втором переводе или главы нет — открывается первая глава книги или первая книга.
    if (chapter !== 1) return bibleOpen(book, 1, null, then);
    const books = await booksOf(BD.selected[0]).catch(() => []);
    if (books.length && books[0].number !== book) return bibleOpen(books[0].number, 1);
    toast(e.message || t.failed);
  }
}
function bibleToggle(file) {
  const cur = BD.selected;
  BD.selected = cur.includes(file) ? (cur.length > 1 ? cur.filter((x) => x !== file) : cur) : cur.length >= 2 ? [cur[0], file] : cur.concat(file);
  settings.bible.selected = BD.selected; save();
  bibleReload();
}
function bibleSwap() {
  if (BD.selected.length < 2) return;
  BD.selected = BD.selected.slice().reverse();
  settings.bible.selected = BD.selected; save();
  bibleReload();
}
function bibleReload() {
  const ch = BD.chapter;
  if (!ch) return bibleEnsure();
  const keep = BD.mark;
  bibleOpen(ch.book, ch.chapter, keep && keep[0], () => { BD.mark = keep; return bibleRefreshLive(); });
}
function nextChapter(d) {
  const ch = BD.chapter;
  if (!ch) return;
  const n = ch.chapter + d;
  if (n >= 1 && n <= ch.chapters) return bibleOpen(ch.book, n);
  booksOf(BD.selected[0]).then((books) => {
    if (d > 0) { const b = books.find((x) => x.number > ch.book); if (b) bibleOpen(b.number, 1); }
    else { const b = books.filter((x) => x.number < ch.book).pop(); if (b) bibleOpen(b.number, b.chapters); }

  if (focus) { const el = document.getElementById(focus[0]); if (el) { el.focus(); try { if (focus[1] != null) el.setSelectionRange(focus[1], focus[1]); } catch (e) {} } }

function bindMonitors(root) {

  root.querySelectorAll('[data-g="pre"]').forEach((el) => gest(el, { tap: () => { if (S.pre && slideOf(S.pre) && slideOf(S.pre).video) openVideo(S.pre); else if (S.pre || S.draft) openFull("pre"); }, up: preToLive }));
}
function updateTicks() {

}

function slidesGrid(it) {

function hitsHTML() {

// ——— Жесты: касание и смахивания по окнам ———
function gest(el, h) {
  let x0 = null, y0;
  el.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener("pointerup", (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0, ax = Math.abs(dx), ay = Math.abs(dy);
    x0 = null;
    if (ax < 10 && ay < 10) return h.tap && h.tap();
    if (ax > ay && ax > 40) { const f = dx < 0 ? h.left : h.right; if (f) f(); }
    else if (ay > 40) { const f = dy < 0 ? h.up : h.down; if (f) f(); }
  });
  el.addEventListener("pointercancel", () => (x0 = null));
  el.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && h.tap) { e.preventDefault(); e.stopPropagation(); h.tap(); } });
}
// Касание, двойное касание и удержание на слайдах, стихах, темах и строках списков.
let TS = null, lastTap = null;
const tapKey = (el) => el.dataset.tap + ":" + JSON.stringify(el.dataset);
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-tap]");
  if (!el || e.button > 0) return;
  const h = TAP[el.dataset.tap];
  TS = { key: tapKey(el), x: e.clientX, y: e.clientY, long: false, d: Object.assign({}, el.dataset) };
  if (h && h.long) TS.timer = setTimeout(() => { if (!TS) return; TS.long = true; if (navigator.vibrate) navigator.vibrate(10); h.long(TS.d); }, 520);
});
document.addEventListener("pointermove", (e) => { if (TS && Math.hypot(e.clientX - TS.x, e.clientY - TS.y) > 10) { clearTimeout(TS.timer); TS = null; } }, { passive: true });
document.addEventListener("pointercancel", () => { if (TS) clearTimeout(TS.timer); TS = null; });
document.addEventListener("pointerup", (e) => {
  const s = TS; TS = null;
  if (!s) return;
  clearTimeout(s.timer);
  if (s.long) return;
  const el = e.target.closest("[data-tap]");
  if (!el || tapKey(el) !== s.key) return;
  fireTap(s.key, s.d);
});
function fireTap(key, d) {
  const h = TAP[d.tap];
  if (!h) return;
  const now = performance.now();
  if (h.double && lastTap && lastTap.key === key && now - lastTap.time < 350) { clearTimeout(lastTap.timer); lastTap = null; return h.double(d); }
  const wait = h.wait && h.wait(d);
  lastTap = { key, time: now, timer: wait ? setTimeout(() => h.single(d), 320) : 0 };
  if (!wait) h.single(d);
}
document.addEventListener("contextmenu", (e) => { if (e.target.closest("[data-tap]")) e.preventDefault(); });
document.addEventListener("keydown", (e) => {
  const el = e.target.closest && e.target.closest("[data-tap]");
  if (el && (e.key === "Enter" || e.key === " ") && !e.target.matches("input, textarea")) { e.preventDefault(); const h = TAP[el.dataset.tap]; if (h) h.single(Object.assign({}, el.dataset)); }
});

const TAP = {
  slide: {
    wait: (d) => { const sl = slidesOf(item(d.id))[+d.i]; return !!(sl && sl.video); },
    single: (d) => { const it = item(d.id); if (!it) return; const src = srcOf(it), sl = src.slides[+d.i]; if (sl && sl.video) return openVideo({ src, idx: +d.i }); tapSlide(src, +d.i); },
    double: async (d) => { const it = item(d.id); if (it && (await goLive({ src: srcOf(it), idx: +d.i }))) toast(t.inHall); },
  },
  setrow: { single: (d) => { S.open = S.open === d.id ? null : d.id; const it = item(d.id); if (it) ensureScripture(it); render(); }, long: (d) => sheetItemMenu(d.id, true) },
  recent: { single: (d) => { const it = item(d.id); if (it) toPreviewItem(it); }, long: (d) => sheetItemMenu(d.id, false) },
  lib: { single: (d) => { const it = item(d.id); if (it) { ensureScripture(it); openFull("lib", { src: srcOf(it), idx: 0 }); } }, long: (d) => sheetItemMenu(d.id, false) },
  verse: { single: (d) => bibleSelect(+d.v), double: (d) => { BD.mark = [+d.v, +d.v]; bibleLive(); }, long: (d) => bibleExtend(+d.v) },
  hit: {
    single: (d) => { const h = BD.hits[+d.i]; if (h) bibleGo(h.book, h.chapter, h.verse, h.verse, false); },
    double: (d) => { const h = BD.hits[+d.i]; if (h) bibleGo(h.book, h.chapter, h.verse, h.verse, true); },
  },
  hist: {
    single: (d) => { const h = settings.bible.history[+d.i]; if (h) openPassage(h); },
    long: (d) => { settings.bible.history.splice(+d.i, 1); save(); render(); toast(t.removedHistory); },
  },
  theme: {
    single: (d) => { const th = allThemes().find((x) => x.id === d.id); if (th) { S.draft = Object.assign({}, DEFAULT_STYLE, th.style); render(); refreshSheet(); } },
    long: (d) => { const th = allThemes().find((x) => x.id === d.id); if (th) sheetThemeEditor(th); },
  },
};
function toPreviewItem(it) {
  ensureScripture(it);
  const src = srcOf(it);

function openSheet(title, body, opts = {}) {
  closeSheet(true);
  const bd = document.createElement("div"); bd.className = "backdrop";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true"); sh.setAttribute("aria-label", title);
  const html = () => (typeof body === "function" ? body() : body);
  sh.innerHTML = `<div class="grab"><i></i></div><div class="sh"><h2>${esc(title)}</h2><button class="iconbtn" data-act="closesheet" aria-label="${esc(t.close)}">${ico("close")}</button></div><div class="sb">${html()}</div>`;
  document.body.append(bd, sh);
  bd.addEventListener("click", () => closeSheet());
  gest(sh.querySelector(".grab"), { down: () => closeSheet() });
  requestAnimationFrame(() => { bd.classList.add("on"); sh.classList.add("on"); });
  SHEET = {
    bd, sh, title, auto: !!opts.auto, onClose: opts.onClose,
    refresh() { const sb = sh.querySelector(".sb"); const top = sb.scrollTop; sb.innerHTML = html(); sb.scrollTop = top; fitSlides(sh); if (opts.mount) opts.mount(sh); },
  };
  fitSlides(sh);
  if (opts.mount) opts.mount(sh);
  if (opts.focus) setTimeout(() => { const i = sh.querySelector(opts.focus); if (i) i.focus(); }, 320);
  requestAnimationFrame(() => fitSlides(sh));
}
function closeSheet(now) {

// ——— Полный просмотр: «Сейчас», «Предпросмотр», элемент библиотеки ———
let FULL = null;
function openFull(kind, cue) {
  closeFull(true);
  const el = document.createElement("div");
  el.className = "full"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
  document.body.append(el);
  let local = cue ? Object.assign({}, cue) : null;
  const cur = () => (kind === "live" ? S.live && fresh(S.live) : kind === "pre" ? S.pre && fresh(S.pre) : local && fresh(local));
  const update = () => {
    const r = cur();
    if (!r && kind === "pre" && !S.draft) return closeFull();
    const src = r && r.src;
    let content, m = "NORMAL";
    if (kind === "live") { content = online ? state && state.content : null; m = mode(); }
    else if (kind === "pre") content = r ? contentOf(r, S.draft || styleFor(r)) : S.draft && S.live ? contentOf(S.live, S.draft) : null;
    else content = r ? contentOf(r) : null;
    const count = r && src.slides.length > 1 ? `${r.idx + 1} / ${src.slides.length}` : "";
    const set = activeSet();
    const inSet = src && src.id && set && set.items.includes(src.id);
    const title = kind === "live" ? liveName() : src ? src.title : t.preview;
    el.innerHTML = `<div class="ft"><button class="iconbtn" data-act="closefull" aria-label="${esc(t.close)}">${ico("down")}</button>
      <span class="ttl">${esc(title)}</span>${kind === "live" ? `<span class="tag live">${esc(t.inHallTag)}</span>` : ""}<span class="cnt">${count}</span></div>
      <div class="stage"><div class="fit">${slideHTML(content, { mode: m, empty: t.empty, w: 1280, label: r && slideOf(r) && slideOf(r).label })}</div></div>
      <div class="fb">${kind === "live" ? `<button class="btn" data-act="fstep" data-d="-1">${ico("prev")}${esc(t.prev)}</button><button class="btn" data-act="fstep" data-d="1">${esc(t.next)}${ico("next")}</button>`
        : `<button class="btn tint" data-act="fgo">${ico("up")}${esc(t.toHall)}</button>${kind === "lib" ? `<button class="btn" data-act="fpre">${esc(t.toPreview)}</button>` : `<button class="btn" data-act="fstyle">${ico("brush")}${esc(t.look)}</button>`}
          ${src && src.id && set && !inSet ? `<button class="btn" data-act="addset" data-id="${esc(src.id)}">${esc(t.toSet)}</button>` : ""}`}</div>`;
    fitSlides(el);
    gest(el.querySelector(".stage"), { left: () => move(1), right: () => move(-1), down: () => closeFull(), up: () => kind !== "live" && FULL && FULL.go() });
  };
  const move = (d) => {
    const r = cur();
    if (!r) return;
    const n = r.idx + d;
    if (n < 0 || n >= r.src.slides.length) return;
    if (kind === "live") step(d);
    else if (kind === "pre") { S.pre = Object.assign({}, r, { idx: n }); render(); }
    else { local.idx = n; update(); }
  };
  FULL = {
    el, kind, update, move,
    async go() {
      const r = cur();
      closeFull();
      if (kind === "pre") return preToLive();
      if (!r) return;
      if (await goLive({ src: r.src, idx: r.idx })) toast(t.inHall);
    },
    pre() { const r = cur(); closeFull(); if (r) { if (slideOf(r) && slideOf(r).video) openVideo(r); else toPreview(r); } },
  };
  update();
  requestAnimationFrame(() => { el.classList.add("on"); fitSlides(el); });
}
function closeFull(now) {
  if (!FULL) return;
  const el = FULL.el;
  if (FULL.close) FULL.close();
  FULL = null;
  if (now) return el.remove();
  el.classList.remove("on");
  setTimeout(() => el.remove(), 260);
}

// ——— Предпросмотр видео отдельным экраном: файл играет здесь, в зал — с этого места или с начала ———
function openVideo(cue) {
  closeFull(true);
  const it = cue.src;
  if (!it.ref) return toast(t.notReady);
  S.pre = cue; render();
  const el = document.createElement("div");
  el.className = "full"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
  el.innerHTML = `<div class="ft"><button class="iconbtn" data-act="closefull" aria-label="${esc(t.close)}">${ico("down")}</button><span class="ttl">${esc(it.title)}</span><span class="cnt">${esc(t.preview)}</span></div>
    <div class="stage" style="touch-action:auto"><video class="pv" playsinline preload="metadata" src="${esc(fileUrl(it.ref))}"></video></div>
    <div class="vrow"><span id="pvt">00:00</span><input id="pvr" type="range" min="0" max="1" value="0" step="0.1" aria-label="${esc(t.seek)}"><span id="pvd">${fmt(it.item && it.item.durationMs)}</span></div>
    <div class="fb"><button class="btn" data-act="pvseek" data-d="-10">${ico("back10")}${esc(t.back10)}</button><button class="btn" data-act="pvplay" id="pvp">${ico("play")}${esc(t.play)}</button><button class="btn" data-act="pvseek" data-d="10">${ico("fwd10")}${esc(t.fwd10)}</button></div>
    <div class="fb" style="padding-top:0"><button class="btn" data-act="pvstart">${ico("prev")}${esc(t.fromStart)}</button><button class="btn tint" data-act="pvhere">${ico("up")}${esc(t.fromHere)}</button></div>`;
  document.body.append(el);
  const v = el.querySelector("video"), r = el.querySelector("#pvr");
  const sync = () => {
    $("#pvt") && ($("#pvt").textContent = fmt(v.currentTime * 1000));
    if (isFinite(v.duration)) { r.max = v.duration; $("#pvd").textContent = fmt(v.duration * 1000); }
    if (document.activeElement !== r) r.value = v.currentTime;
    $("#pvp").innerHTML = `${ico(v.paused ? "play" : "pause")}${esc(v.paused ? t.play : t.pause)}`;
  };
  ["timeupdate", "loadedmetadata", "play", "pause"].forEach((ev) => v.addEventListener(ev, sync));
  v.addEventListener("error", () => toast(t.videoNoPreview));
  r.addEventListener("input", () => { v.currentTime = Number(r.value); });
  FULL = {
    el, kind: "video", update() {}, move() {}, go() {},
    close() { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} },
    video: v, cue,
  };
  requestAnimationFrame(() => el.classList.add("on"));
}
async function videoToHall(fromStart) {
  if (!FULL || !FULL.video) return;
  const v = FULL.video, cue = FULL.cue;
  const at = fromStart ? 0 : Math.round(v.currentTime * 1000);
  v.pause();
  closeFull();
  if (await goLive(Object.assign({}, cue, { startMs: at }))) toast(at ? tf("videoFrom", fmt(at)) : t.videoInHall);
}

// ——— Сетлисты ———
function addToSet(id) {
  let s = activeSet();
  if (!s) { s = { id: newId(), title: t.setDefault, date: todayIso(), items: [] }; D.sets.unshift(s); D.active = s.id; }
  if (!s.items.includes(id)) s.items.push(id);
  saveData();
}

// ——— Свой файл с этого устройства ———
let pickToLib = false;
$("#pick").onchange = async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";
  if (!files.length) return;
  closeSheet();
  for (const f of files) {
    try {
      const it = await importFile(f);
      if (!it) continue;
      render();
      if (pickToLib) { toast(tf("addedItem", it.title)); continue; }
      S.open = it.id;
      toPreviewItem(it);
    } catch (err) { toast(err.message || t.failed); }
  }
};
$("#pickModule").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) installModule(f); };
// Фото на фон темы: передаётся на экран сразу, в теме — ссылка на файл.
$("#pickBg").onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = "";

  try {
    const ready = await preparePhoto(f);
    const ref = await upload(ready);
    LOCAL[ref.sha256] = URL.createObjectURL(ready);
    TE.st.backgroundImage = ref;
    refreshSheet();
  } catch (err) { toast(err.message || t.failed); }
};

// Клавиатура и Bluetooth-кликер: стрелки, PageUp/PageDown, пробел; B — чёрный экран.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (SHEET) return closeSheet(); if (FULL) return closeFull(); }
  if (e.key === "Enter" && e.target.id === "pin") return A.pair();
  if (e.key === "Enter" && e.target.id === "lpin") { const b = document.querySelector('[data-act="linkgo"]'); if (b) b.click(); return; }
  if (e.key === "Enter" && e.target.id === "bq") { if (BD.ref) A.bref(); return; }
  if (!everOnline || e.target.matches("input, textarea, select") || !settings.clicker || e.altKey || e.ctrlKey || e.metaKey) return;
  if (FULL && FULL.video) return;
  if (["ArrowRight", "PageDown", " ", "ArrowDown"].includes(e.key)) { e.preventDefault(); step(1); }
  else if (["ArrowLeft", "PageUp", "ArrowUp"].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === "b" || e.key === "B" || e.key === "и" || e.key === "И" || e.key === ".") { e.preventDefault(); setMode("BLACK"); }
});

// Экран телефона не гаснет, пока открыт пульт: Wake Lock (Safari 16.4+, Chrome), а на старых iPhone —
// беззвучное крошечное видео по кругу, его можно запустить только после касания.
let wake = null, awakeVideo = null;
async function keepAwake() {
  if (document.visibilityState !== "visible") return;
  if ("wakeLock" in navigator) { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} return; }
  if (!awakeVideo) {
    awakeVideo = document.createElement("video");
    awakeVideo.src = "/remote/keepawake.mp4";
    awakeVideo.muted = true; awakeVideo.loop = true; awakeVideo.playsInline = true;
    awakeVideo.setAttribute("playsinline", ""); awakeVideo.setAttribute("muted", "");
    awakeVideo.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.append(awakeVideo);
  }
  awakeVideo.play().catch(() => {});
}
document.addEventListener("pointerdown", keepAwake, { passive: true });

// Примеры при первом открытии: песни (общественное достояние), объявления и Писание из встроенных переводов. Файлов нет.
function seedDemo() {
  if (D.seeded || D.items.length) { if (!D.seeded) { D.seeded = true; saveData(); } return; }
  const pick = (book, chapter, from, to) => ({ book, chapter, from, to, modules: DEFAULT_BIBLES.slice(), options: Object.assign({}, BIBLE_OPTIONS, { sideBySide: true, versesPerSlide: 1 }) });
  const items = [
    { id: newId(), type: "song", title: "Коль славен наш Господь в Сионе", texts: [
      "Коль славен наш Господь в Сионе,\nНе может изъяснить язык.\nВелик Он в небесах на троне,\nВ былинках на земле велик.",
      "Везде, Господь, везде Ты славен,\nВо дни, в нощи сияньем равен.",
      "Тебя Твой агнец златорунный\nВ себе изображает нам;\nПсалтирью мы десятиструнной\nТебе приносим фимиам."], labels: [t.verse1, t.chorus, t.verse2] },
    { id: newId(), type: "song", title: "Amazing Grace", texts: [
      "Amazing grace! How sweet the sound\nThat saved a wretch like me!\nI once was lost, but now am found;\nWas blind, but now I see.",
      "’Twas grace that taught my heart to fear,\nAnd grace my fears relieved;\nHow precious did that grace appear\nThe hour I first believed."], labels: ["Verse 1", "Verse 2"] },
    { id: newId(), type: "text", title: t.demoNotices, texts: [t.demoNotice1, t.demoNotice2, t.demoNotice3] },
    { id: newId(), type: "bible", title: "Ин 3:16–17", pick: pick(500, 3, 16, 17) },
    { id: newId(), type: "bible", title: "Пс 22:1–4", pick: pick(230, 22, 1, 4) },
  ];
  D.items = items.concat(D.items);
  const set = { id: newId(), title: t.demoSet, date: todayIso(), items: items.map((x) => x.id) };
  D.sets.push(set);
  D.active = D.active || set.id;
  D.seeded = true;

}
// После перезагрузки страницы «В зале» отмечается снова, если на экране то же, что пульт показывал.
function rememberLive() {
  const c = S.live;
  store.set("live", c ? { id: c.src.id, idx: c.idx, pick: c.src.pick, title: c.src.title, type: c.src.type } : null);
}
async function restoreLive() {
  const l = store.get("live", null);
  if (!l || !state || !state.content || S.live) return;
  try {
    let cue = null;
    if (l.id && item(l.id)) { await ensureScripture(item(l.id)); cue = { src: srcOf(item(l.id)), idx: l.idx }; }
    else if (l.pick) cue = { src: { id: null, title: l.title, type: "bible", slides: await scripture(l.pick), pick: l.pick, style: null }, idx: l.idx };
    if (cue && matches(state.content, contentOf(cue))) { S.live = cue; render(); }
  } catch (e) {}
}
function started() {
  seedDemo();
  const s = activeSet();
  if (s) s.items.forEach((id) => ensureScripture(item(id)));
  if (!S.open && s && s.items.length) S.open = s.items[0];
  if (settings.church) loadModules();
  loadOutputs();
  pollOutputs();
  keepAwake();
  restoreLive();
  render();
}
setInterval(rememberLive, 2000);

// Запуск: PIN из QR-кода, токен в адресе (окно пульта на компьютере) или сохранённый токен.
if (params.get("pin")) connect(params.get("pin"));
else if (token) connect();
renderPair();
</script>
</body>
