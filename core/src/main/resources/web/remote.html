<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Deixis</title>
<link rel="apple-touch-icon" href="/remote/icon.png">
<link rel="manifest" href="/remote/manifest.webmanifest">
<style>
@font-face { font-family: "Deixis Mark"; src: url("/view/assets/GFSDidot-Regular.ttf") format("truetype"); font-display: swap; }
/* Токены DESIGN.md: цвет, размеры, движение. Чисел вне токенов нет. */
:root {
  --bg: #F3F2EE; --cell: #FFFFFF; --ink: #161514; --l2: #87847E; --l3: #C6C3BC;
  --tint: #9C7242; --tint-text: #765A38; --red: #A75750; --live: #A75750;
  --sep: rgba(60,55,45,.15); --fill: rgba(120,115,105,.12); --fill2: rgba(120,115,105,.2);
  --on-color: #FFFFFF; --scrim: rgba(0,0,0,.35);
  --t-fast: 140ms; --t-mid: 240ms; --e-out: cubic-bezier(.2,.8,.2,1); --e-spring: cubic-bezier(.3,1.35,.55,1);
  --r-card: 12px; --r-btn: 14px; --r-seg: 9px; --r-seg-in: 7px; --r-pill: 999px;
  --h-btn: 50px; --h-touch: 44px; --gap: 10px; --pad: 16px;
  --fs: 17px; --fs-s: 14px; --fs-xs: 13px; --fs-title: 20px; --fs-mark: 22px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --cell: #1C1C1E; --ink: #FFFFFF; --l2: #8D8D93; --l3: #48484A;
    --tint: #BC9361; --tint-text: #BC9361; --red: #B96E65; --live: #B96E65;
    --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36);
  }
}
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; --t-mid: 0ms; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: var(--fs)/1.35 -apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif; letter-spacing: -.01em;
       padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: var(--fill); border-radius: var(--r-btn); min-height: var(--h-touch); padding: 0 var(--pad); cursor: pointer;
         transition: transform var(--t-fast) var(--e-spring), background var(--t-fast) var(--e-out); font-weight: 600; }
button:active { transform: scale(.97); }
button:disabled { color: var(--l3); }
button.primary { background: var(--tint); color: var(--on-color); min-height: var(--h-btn); width: 100%; }
button.on { background: var(--ink); color: var(--bg); }
input, textarea { width: 100%; border: 0; border-radius: var(--r-seg); background: var(--fill); padding: 12px; min-height: var(--h-touch); }
textarea { min-height: 160px; resize: vertical; }
header { display: flex; align-items: center; padding: 12px var(--pad); gap: var(--gap); }
.mark { font-family: "Deixis Mark", Georgia, serif; font-size: var(--fs-mark); letter-spacing: .18em; }
#status { margin-left: auto; color: var(--l2); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { padding: 0 var(--pad) calc(150px + env(safe-area-inset-bottom)); }
h2 { font-size: var(--fs-xs); font-weight: 600; color: var(--l2); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
.now { aspect-ratio: 16/9; background: #000; border-radius: var(--r-card); border: 2px solid var(--l3); display: flex; align-items: center; justify-content: center;
       color: #fff; text-align: center; padding: var(--pad); white-space: pre-line; font-weight: 600; overflow: hidden; }
.now.live { border-color: var(--live); }
.now { position: relative; padding: 0; }
.now iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; background: #000; }
.now .touch { position: absolute; inset: 0; }
#nowText { color: var(--l2); font-size: var(--fs-xs); margin-top: 6px; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nowText.warn { color: var(--red); }
#net { display: none; background: var(--fill2); color: var(--ink); border-radius: var(--r-card); padding: 10px 12px; font-size: var(--fs-s); margin-bottom: 8px; }
#net.on { display: block; }
#net button { margin-top: 8px; width: 100%; }
body.offline .bar button, body.offline .tiles button { opacity: .45; }
.dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--l3); display: inline-block; margin-right: 6px; vertical-align: middle; }
.dot.ok { background: var(--tint); }
.now::after { content: attr(data-text); position: relative; padding: var(--pad); }
.now .sub { display: block; font-size: var(--fs-xs); opacity: .7; margin-top: 6px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
.tiles button { min-height: 72px; background: var(--cell); font-size: var(--fs-s); }
#hint { color: var(--l2); font-size: var(--fs-s); margin-top: 8px; }
#progress { color: var(--tint-text); font-size: var(--fs-s); margin-top: 8px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--cell); border-top: 1px solid var(--sep);
       padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: grid; gap: 6px; }
.row { display: flex; gap: 6px; }
.row > button { flex: 1; min-height: var(--h-btn); }
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--t-mid) var(--e-out); }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: var(--r-btn) var(--r-btn) 0 0;
         padding: 8px var(--pad) calc(var(--pad) + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform var(--t-mid) var(--e-out); }
.sheet.open { transform: none; }
@media (min-width: 760px) { .sheet { left: 50%; right: auto; width: 720px; margin-left: -360px; bottom: 5vh; border-radius: var(--r-btn); } }
.handle { width: 36px; height: 5px; border-radius: var(--r-pill); background: var(--l3); margin: 0 auto 10px; }
.sheet h3 { margin: 0 0 10px; font-size: var(--fs-title); }
.seg { display: flex; background: var(--fill); border-radius: var(--r-seg); padding: 2px; gap: 2px; }
.seg button { flex: 1; background: transparent; border-radius: var(--r-seg-in); min-height: 36px; font-weight: 400; font-size: var(--fs-s); }
.seg button.sel { background: var(--cell); font-weight: 600; }
label.opt { display: block; color: var(--l2); font-size: var(--fs-xs); margin: 12px 0 6px; }
.list { background: var(--cell); border-radius: var(--r-card); overflow: hidden; }
.list .it { display: flex; align-items: center; gap: var(--gap); padding: 10px 12px; border-bottom: 1px solid var(--sep); min-height: var(--h-touch); }
.list .it:last-child { border-bottom: 0; }
.list .it .t { flex: 1; min-width: 0; }
.list .it .t small { display: block; color: var(--l2); font-size: var(--fs-xs); }
.list .it .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .it img { width: 80px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: #000; }
.pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.pills button { border-radius: var(--r-pill); white-space: nowrap; font-size: var(--fs-xs); min-height: 36px; }
.pill { border-radius: var(--r-pill); padding: 0 12px; min-height: 36px; font-size: var(--fs-xs); }
.stack { display: grid; gap: 8px; }
.muted { color: var(--l2); font-size: var(--fs-s); }
#toast { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: var(--pad); right: var(--pad); background: var(--ink); color: var(--bg);
         border-radius: var(--r-card); padding: 12px var(--pad); font-size: var(--fs-s); opacity: 0; transform: translateY(-8px); pointer-events: none;
         transition: opacity var(--t-mid) var(--e-out), transform var(--t-mid) var(--e-out); }
#toast.on { opacity: 1; transform: none; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header><span class="mark">ΔΕΙΞΙΣ</span><span id="status"><span class="dot" id="dot"></span><span id="statusText"></span></span></header>

<main id="pair" class="hidden">
  <h2 data-t="pairTitle"></h2>
  <div class="stack">
    <p class="muted" data-t="pairHint"></p>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="PIN">
    <button class="primary" id="pairBtn" data-t="connect"></button>
  </div>
</main>

<main id="app" class="hidden">
  <div id="net"><span id="netText"></span><button id="netAlt" class="hidden"></button></div>
  <h2 data-t="now"></h2>
  <div class="now" id="now"><div class="touch" id="nowTouch"></div></div>
  <div id="nowText"></div>
  <div id="progress" class="hidden"></div>

  <h2 data-t="show"></h2>
  <div class="tiles">
    <button data-act="photo" data-t="photo"></button>
    <button data-act="video" data-t="video"></button>
    <button data-act="pdf" data-t="pdf"></button>
    <button data-act="text" data-t="text"></button>
  </div>
  <h2 data-t="more"></h2>
  <div class="tiles">
    <button data-act="bible" data-t="bible" class="church"></button>
    <button data-act="holyrics" data-t="holyrics" class="church"></button>
    <button data-act="settings" data-t="settings"></button>
    <button data-act="app" data-t="openApp" id="openApp" class="hidden"></button>
  </div>
  <p id="hint" data-t="hint"></p>
</main>

<div class="bar hidden" id="bar">
  <div class="row" id="nav">
    <button id="prev" data-t="prev"></button>
    <button id="next" data-t="next"></button>
  </div>
  <div class="row hidden" id="vnav">
    <button data-v="back" data-t="back10"></button>
    <button data-v="toggle" id="vtoggle"></button>
    <button data-v="fwd" data-t="fwd10"></button>
  </div>
  <div class="row">
    <button data-m="BLACK" data-t="black"></button>
    <button data-m="LOGO" data-t="logo"></button>
    <button data-m="CLEAR" data-t="clear"></button>
  </div>
</div>

<input type="file" id="pickPhoto" accept="image/*" class="hidden">
<input type="file" id="pickVideo" accept="video/*,audio/*" class="hidden">
<input type="file" id="pickPdf" accept="application/pdf,text/plain,.txt" class="hidden">
<input type="file" id="pickModule" accept=".SQLite3,.sqlite3,application/octet-stream,application/x-sqlite3" class="hidden">

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div id="sheetBody"></div></section>
<div id="toast" role="status"></div>

// Строки на трёх языках: русский (основной), узбекский латиницей, английский. Без обращения на «ты» и «вы».

const t = STRINGS[lang.startsWith("uz") ? "uz" : lang.startsWith("en") ? "en" : "ru"];

document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
const $ = (id) => document.getElementById(id);

// Настройки и сопряжение хранятся в браузере этого телефона. Ключ — адрес экрана: у каждого экрана свой токен.
const store = {
  get(k, d) { try { const v = localStorage.getItem(location.host + ":" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(location.host + ":" + k, JSON.stringify(v)); } catch (e) {} },
};
const params = new URLSearchParams(location.search);
let token = store.get("token", null);
let settings = Object.assign({ caps: false, church: true, bible: { selected: [], ref: "", options: { versesPerSlide: 1, refMode: "ONE_LINE", refPosition: "BOTTOM", fullBookName: false, verseNumbers: true, sideBySide: false } }, holyrics: null }, store.get("settings", {}));
const save = () => store.set("settings", settings);
let receiver = null, state = null, item = null, ws = null, viewKey = null, awaiting = null;
// Токен, переданный при переходе на имя экрана в сети (#t=…): сохраняется и убирается из адреса.
if (location.hash.startsWith("#t=")) { token = decodeURIComponent(location.hash.slice(3)); store.set("token", token); history.replaceState(null, "", "/remote"); }

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("on"), 2600);
}

// ——— Связь: тот же протокол, что у приложения Deixis ———
// iPhone обрывает соединение, когда экран гаснет или Safari уходит в фон, а после возврата сокет может
// казаться живым. Поэтому связь проверяется по ответам каждую секунду, а при возврате на страницу,
// появлении сети и восстановлении из кэша — переподключение сразу, без ожидания.
let pause = 500, lastPong = 0, fails = 0, retry = 0, online = false;
function connect(pin) {
  clearTimeout(retry);
  if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch (e) {} }
  setNet(online ? "" : t.connecting);
  const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws = sock;
  // Если за 4 секунды не открылось — Wi-Fi не тот или экран выключен; пробуем снова.
  const openTimer = setTimeout(() => { if (sock.readyState !== 1) sock.close(); }, 4000);
  sock.onopen = () => {
    clearTimeout(openTimer);
    lastPong = performance.now();
    if (token && !pin) sock.send(JSON.stringify({ type: "hello", version: 1, sender: deviceName(), token }));
    else sock.send(JSON.stringify({ type: "pair", version: 1, sender: deviceName(), pin }));
  };
  sock.onmessage = (e) => {
    lastPong = performance.now();
    const m = JSON.parse(e.data);
    if (m.type === "pong") return;
    if (m.type === "paired") { token = m.token; store.set("token", token); if (params.has("pin")) history.replaceState(null, "", "/remote"); }
    else if (m.type === "welcome") { receiver = m.receiver; viewKey = m.viewKey || null; store.set("receiver", { id: receiver.id, port: location.port }); pause = 500; fails = 0; setOnline(true); render(m.state); showApp(); }
    else if (m.type === "status") render(m.state);
    else if (m.type === "error") toast(m.message);
    else if (m.type === "denied") denied(m.reason);
  };
  sock.onclose = () => {
    clearTimeout(openTimer);
    if (ws !== sock) return;
    setOnline(false);
    if (!token) return;
    fails++;
    setNet(fails >= 3 ? t.noNet : t.lost);
    retry = setTimeout(() => connect(), pause);
    pause = Math.min(pause * 2, 4000);
  };
}
function reconnectNow() {
  if (!token) return;
  if (!ws || ws.readyState > 1 || performance.now() - lastPong > 2500) { pause = 500; connect(); }
}
setInterval(() => {
  if (!ws || ws.readyState !== 1) return;
  if (performance.now() - lastPong > 4000) { ws.close(); return; }
  ws.send(JSON.stringify({ type: "ping", t: Date.now() }));
}, 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { reconnectNow(); keepAwake(); } });
addEventListener("pageshow", (e) => { if (e.persisted) reconnectNow(); });
addEventListener("online", () => { pause = 500; reconnectNow(); });
addEventListener("focus", reconnectNow);

function setOnline(on) {
  online = on;
  document.body.classList.toggle("offline", !on);
  $("dot").classList.toggle("ok", on);
  if (on) setNet("");
}
// Полоса о связи. Если адрес экрана сменился (роутер выдал новый), пульт предлагает открыть экран по имени в сети.
function setNet(text) {
  $("net").classList.toggle("on", !!text && !!token);
  $("netText").textContent = text;
  const alt = altUrl();
  $("netAlt").classList.toggle("hidden", !(text && fails >= 3 && alt));
  $("netAlt").textContent = t.byName;
  $("netAlt").onclick = () => { if (alt) location.href = alt; };
}
// Имя экрана в сети, как у приложения: deixis-xxxx.local. Токен уходит в адресе после #, на сервер он не попадает.
function altUrl() {
  const r = store.get("receiver", null);
  if (!r || !token || location.hostname.endsWith(".local")) return null;
  const name = "deixis-" + (r.id.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4) || "tv");
  return `http://${name}.local:${r.port || location.port}/remote#t=${encodeURIComponent(token)}`;
}

function denied(reason) {
  const msg = { WRONG_PIN: t.wrongPin, TOO_MANY_ATTEMPTS: t.tooMany, INCOMPATIBLE_VERSION: t.oldVersion, UNKNOWN_TOKEN: t.forgot }[reason] || t.failed;
  if (reason === "UNKNOWN_TOKEN") { token = null; store.set("token", null); }
  toast(msg);
  showPair();
}
// Команды без связи не копятся: устаревший слайд через минуту хуже, чем ничего (как в приложении).
function send(msg) {
  if (ws && ws.readyState === 1 && online) { ws.send(JSON.stringify(msg)); return true; }
  toast(t.lost); reconnectNow(); return false;
}
function deviceName() { const ua = navigator.userAgent; return /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : "Браузер"; }
function setStatus(s) { $("statusText").textContent = s; }
function authed(path, opts = {}) {
  opts.headers = Object.assign({ Authorization: "Bearer " + token }, opts.headers || {});
  return fetch(path, opts).then(async (r) => { if (!r.ok) throw new Error((await r.text()) || r.status); return r; });
}
const postJson = (path, body) => authed(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

function showPair() {
  $("pair").classList.remove("hidden"); $("app").classList.add("hidden"); $("bar").classList.add("hidden");
  setStatus("");
}
function showApp() {
  $("pair").classList.add("hidden"); $("app").classList.remove("hidden"); $("bar").classList.remove("hidden");
  setStatus(receiver ? receiver.name : "");
  applyChurch();
  keepAwake();
}
$("pairBtn").onclick = () => { const pin = $("pin").value.trim(); if (/^\d{4}$/.test(pin)) connect(pin); else toast(t.wrongPin); };

// ——— Что сейчас на экране ———
// В карточке — живое превью: та же страница, что у зрителей, поэтому видно ровно то, что в зале.
function ensurePreview() {
  const now = $("now");
  let f = now.querySelector("iframe");
  if (!viewKey) { if (f) f.remove(); return; }
  const src = `/view?k=${encodeURIComponent(viewKey)}&preview=1`;
  if (!f) { f = document.createElement("iframe"); f.title = t.now; f.setAttribute("tabindex", "-1"); now.prepend(f); }
  if (f.getAttribute("src") !== src) f.setAttribute("src", src);
}
function render(s) {
  state = s;
  ensurePreview();
  const now = $("now");
  const c = s.content;
  now.classList.toggle("live", !!c && s.mode === "NORMAL");
  // Подпись под превью: что это и какой слайд.
  let cap;
  if (s.mode === "BLACK") cap = t.blackNow;
  else if (s.mode === "LOGO") cap = t.logo;
  else if (!c) cap = t.nothing;
  else if (item && item.kind === "text") cap = `${item.title}${item.labels && item.labels[item.index] ? " · " + item.labels[item.index] : ""} · ${t.slide} ${item.index + 1} ${t.of} ${item.slides.length}`;
  else if (item && item.kind === "scripture") { const sc = item.slides[item.index]; cap = `${sc.ref || sc.blocks[0].ref || t.bible} · ${item.index + 1}/${item.slides.length}`; }
  else if (c.type === "pdf") cap = `${c.file.name} · ${t.page} ${c.page + 1}${item && item.pages ? " " + t.of + " " + item.pages : ""}`;
  else if (c.type === "video") cap = c.file.name + (s.video ? ` · ${Math.floor(s.video.positionMs / 1000)} / ${Math.floor(s.video.durationMs / 1000)} с` : "");
  else if (c.type === "image") cap = c.file.name;
  else if (c.type === "text") cap = c.text.split("\n")[0];
  else cap = "";
  // Без превью (старый экран) — подпись внутри карточки, как раньше.
  if (!viewKey) now.dataset.text = cap;
  $("nowText").textContent = cap;
  if (awaiting && matches(c, awaiting.content)) { clearTimeout(awaiting.timer); awaiting = null; $("nowText").classList.remove("warn"); }
  document.querySelectorAll("[data-m]").forEach((b) => b.classList.toggle("on", s.mode === b.dataset.m));
  const isVideo = c && c.type === "video";
  $("nav").classList.toggle("hidden", isVideo);
  $("vnav").classList.toggle("hidden", !isVideo);
  $("vtoggle").textContent = s.video && s.video.playing ? t.pause : t.play;
  const canStep = item && (item.kind === "text" || item.kind === "scripture" || item.kind === "pdf");
  $("prev").disabled = $("next").disabled = !canStep;
  if (s.error) toast(s.error);
}
// Экран подтвердил показ, если пришло то же содержимое (сравниваются тип, текст, файл и страница).
function matches(a, b) {
  if (!a || !b || a.type !== b.type) return false;
  if (a.type === "text") return a.text === b.text;
  if (a.type === "pdf") return a.file.sha256 === b.file.sha256 && a.page === b.page;
  if (a.file && b.file) return a.file.sha256 === b.file.sha256;
  if (a.type === "scripture") return JSON.stringify(a.blocks) === JSON.stringify(b.blocks);
  return true;
}
// Свайп по карточке «Сейчас»: влево — дальше, вправо — назад (карта жестов DESIGN.md).
(() => { let x0 = null, y0 = 0;
  const el = $("nowTouch");
  el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
})();
function sub(s) { return `<span class="sub">${esc(s)}</span>`; }
function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

// Слайд текущего элемента в протокол показа.
function showItem(it) {
  item = it;
  let content;
  const caps = (st) => settings.caps ? Object.assign({}, st || {}, { caps: true }) : (st || {});
  if (it.kind === "text") content = { type: "text", text: it.slides[it.index], style: caps(it.style) };
  else if (it.kind === "scripture") { const sc = it.slides[it.index]; content = Object.assign({}, sc, { type: "scripture", style: caps(sc.style) }); }
  else if (it.kind === "pdf") content = { type: "pdf", file: it.ref, page: it.index };
  else if (it.kind === "image") content = { type: "image", file: it.ref };
  else if (it.kind === "video") content = { type: "video", file: it.ref };
  if (!send({ type: "show", content })) return;
  // Если экран не подтвердил показ за 4 секунды — подпись красным: оператор видит, что в зале не то.
  if (awaiting) clearTimeout(awaiting.timer);
  awaiting = { content, timer: setTimeout(() => { $("nowText").classList.add("warn"); $("nowText").textContent = t.notConfirmed; awaiting = null; }, 4000) };
  $("nowText").classList.remove("warn");
}
function step(d) {
  if (!item || item.kind === "image" || item.kind === "video") return;
  const n = item.kind === "pdf" ? item.pages : item.slides.length;
  const i = Math.max(0, Math.min(n - 1, item.index + d));
  if (i !== item.index) showItem(Object.assign({}, item, { index: i }));
}
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
document.querySelectorAll("[data-m]").forEach((b) => { b.onclick = () => send({ type: "mode", mode: state && state.mode === b.dataset.m ? "NORMAL" : b.dataset.m }); });
document.querySelectorAll("[data-v]").forEach((b) => {
  b.onclick = () => {
    const v = state && state.video;
    if (b.dataset.v === "toggle") send({ type: "video", action: v && v.playing ? "PAUSE" : "PLAY" });
    else send({ type: "video", action: "SEEK", positionMs: Math.max(0, ((v && v.positionMs) || 0) + (b.dataset.v === "fwd" ? 10000 : -10000)) });
  };
});
// Клавиатура и кликер: стрелки, пробел, PageUp/PageDown.
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); step(1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); step(-1); }
});

// Деление текста на слайды: пустая строка — новый слайд, не больше 4 строк на слайд (как в приложении).
function splitSlides(text) {
  const out = [];
  for (const block of text.replace(/\r\n/g, "\n").split(/\n\s*\n/)) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i += 4) out.push(lines.slice(i, i + 4).join("\n"));
  }
  return out;
}

// ——— Файлы: загрузка с докачкой, хэш считает экран ———
const kindOf = (f) => {
  const n = f.name.toLowerCase();
  if (/\.(pptx?|odp|key)$/.test(n)) return "pptx";
  if (f.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/.test(n)) return "image";
  if (f.type.startsWith("video/") || f.type.startsWith("audio/") || /\.(mp4|mov|mkv|avi|webm|m4v|mp3|wav|m4a)$/.test(n)) return "video";
  if (f.type === "application/pdf" || n.endsWith(".pdf")) return "pdf";
  if (f.type.startsWith("text/") || n.endsWith(".txt")) return "text";
  return null;
};
async function upload(file) {
  if (file.size > 1024 * 1024 * 1024) throw new Error(t.tooBig);
  const key = "up:" + file.name + ":" + file.size + ":" + file.lastModified;
  let id = store.get(key, null);
  if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join(""); store.set(key, id); }
  const p = $("progress");
  p.classList.remove("hidden");
  try {
    let offset = (await (await authed("/upload/" + id)).json()).bytes || 0;
    const CHUNK = 4 * 1024 * 1024;
    for (let attempt = 0; ; ) {
      p.textContent = `«${file.name}»: ${t.sending} ${Math.floor((offset / Math.max(1, file.size)) * 100)}%`;
      try {
        const end = Math.min(file.size, offset + CHUNK);
        const r = await authed(`/upload/${id}?offset=${offset}`, {
          method: "PUT", body: file.slice(offset, end),
          headers: { "Deixis-Size": String(file.size), "Deixis-Name": encodeURIComponent(file.name), "Content-Type": "application/octet-stream" },
        });
        const j = await r.json();
        if (j.file) { store.set(key, null); return j.file; }
        offset = j.bytes;
        attempt = 0;
      } catch (e) {
        // Обрыв Wi-Fi: спросить, сколько дошло, и продолжить с того места.
        if (++attempt > 5) throw e;
        await new Promise((res) => setTimeout(res, 800 * attempt));
        offset = (await (await authed("/upload/" + id)).json()).bytes || 0;
      }
    }
  } finally {
    p.classList.add("hidden");
  }
}
// Фото с iPhone: HEIC переводится в JPEG (его откроет любой экран), снимки больше 4K уменьшаются —
// передача в разы быстрее, а на экране зала разницы не видно. Поворот по EXIF браузер учитывает сам.
async function preparePhoto(file) {
  const heic = /\.(heic|heif)$/i.test(file.name) || /heic|heif/i.test(file.type);
  if (!heic && file.size < 6 * 1024 * 1024) return file;
  const p = $("progress");
  p.classList.remove("hidden"); p.textContent = `«${file.name}»: ${t.preparing}`;
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await img.decode();
    URL.revokeObjectURL(url);
    const MAX = 3840;
    const k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    if (!heic && k === 1) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
    if (!blob) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg", lastModified: file.lastModified });
  } catch (e) {
    return file; // браузер не смог прочитать — отправляем как есть, экран попробует сам
  } finally {
    p.classList.add("hidden");
  }
}

async function pickFile(file) {
  if (!file) return;
  const kind = kindOf(file);
  try {
    if (kind === "pptx") return toast(t.pptx);
    if (!kind) return toast(t.unsupported);
    if (kind === "text") return showText(await file.text());
    const ref = await upload(kind === "image" ? await preparePhoto(file) : file);
    if (kind === "pdf") {
      const pages = (await (await authed(`/pdf/${ref.sha256}/pages`)).json()).pages;
      showItem({ kind: "pdf", ref, pages, index: 0 });
    } else showItem({ kind, ref });
  } catch (e) { toast(e.message || t.failed); }
}
function showText(text, title, style, labels) {
  const slides = splitSlides(text);
  if (slides.length) showItem({ kind: "text", slides, index: 0, title: title || t.text, style: style || null, labels: labels || [] });
}
for (const [id] of [["pickPhoto"], ["pickVideo"], ["pickPdf"]]) $(id).onchange = (e) => { pickFile(e.target.files[0]); e.target.value = ""; };

// ——— Шторки ———
function openSheet(html, init) {
  $("sheetBody").innerHTML = html;
  $("sheet").classList.add("open"); $("scrim").classList.add("open");
  if (init) init($("sheetBody"));
}
function closeSheet() { $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); }
$("scrim").onclick = closeSheet;
// Смахивание шторки вниз закрывает её.
(() => { let y0 = null; const s = $("sheet");
  s.addEventListener("touchstart", (e) => { y0 = s.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  s.addEventListener("touchend", (e) => { if (y0 != null && e.changedTouches[0].clientY - y0 > 80) closeSheet(); y0 = null; }, { passive: true }); })();
const seg = (name, values, sel) => `<div class="seg" data-seg="${name}">${values.map(([v, label]) => `<button data-v="${v}" class="${String(v) === String(sel) ? "sel" : ""}">${esc(label)}</button>`).join("")}</div>`;
function bindSeg(root, onPick) {
  root.querySelectorAll("[data-seg]").forEach((g) => g.querySelectorAll("button").forEach((b) => {
    b.onclick = () => { g.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b)); onPick(g.dataset.seg, b.dataset.v); };
  }));
}

document.querySelectorAll("[data-act]").forEach((b) => { b.onclick = () => actions[b.dataset.act](); });
const actions = {
  photo: () => $("pickPhoto").click(),
  video: () => $("pickVideo").click(),
  pdf: () => $("pickPdf").click(),
  text: () => openSheet(`<h3>${t.textTitle}</h3><textarea id="txt" placeholder="${esc(t.textHint)}"></textarea><div style="height:10px"></div><button class="primary" id="txtGo">${t.showBtn}</button>`,
    (r) => { r.querySelector("#txtGo").onclick = () => { showText(r.querySelector("#txt").value); closeSheet(); }; }),
  settings: () => openSheet(`<h3>${t.settings}</h3>
      <label class="opt">${t.caseLbl}</label>${seg("caps", [["0", t.normal], ["1", t.caps]], settings.caps ? 1 : 0)}
      <p class="muted">${t.autoFit}</p>
      <label class="opt">${t.churchLbl}</label>${seg("church", [["1", t.on], ["0", t.off]], settings.church ? 1 : 0)}
      <p class="muted">${t.churchHint}</p><button class="primary" id="ok">${t.close}</button>`,
    (r) => { bindSeg(r, (k, v) => { settings[k] = v === "1"; save(); applyChurch(); if (k === "caps" && item && (item.kind === "text" || item.kind === "scripture")) showItem(item); });
      r.querySelector("#ok").onclick = closeSheet; }),
  app: () => { location.href = `deixis://${location.host}?pin=${encodeURIComponent(params.get("pin") || "")}`; },
  bible: () => bibleSheet(),
  holyrics: () => holyricsSheet(),
};
function applyChurch() { document.querySelectorAll(".church").forEach((el) => el.classList.toggle("hidden", !settings.church)); }

// ——— Библия: модули MyBible хранятся на экране ———
async function bibleSheet() {
  let mods = [];
  try { mods = await (await authed("/bible")).json(); } catch (e) { toast(e.message); }
  const b = settings.bible;
  b.selected = b.selected.filter((f) => mods.some((m) => m.file === f));
  if (!b.selected.length && mods.length) b.selected = [mods[0].file];
  const o = b.options;
  openSheet(`<h3>${t.bible}</h3>
    <label class="opt">${t.modules}</label>
    <div class="pills" id="mods">${mods.map((m) => { const i = b.selected.indexOf(m.file); return `<button class="${i >= 0 ? "on" : ""}" data-f="${esc(m.file)}">${i >= 0 ? i + 1 + " · " : ""}${esc(m.abbreviation || m.title)}</button>`; }).join("")}<button id="addMod">${t.addModule}</button></div>
    ${mods.length ? "" : `<p class="muted">${t.noModules}</p>`}
    <div style="height:8px"></div><input id="ref" placeholder="${esc(t.place)}" value="${esc(b.ref)}" enterkeyhint="go">
    <label class="opt">${t.verses}</label>${seg("versesPerSlide", [[1, "1"], [2, "2"], [3, "3"]], o.versesPerSlide)}
    <label class="opt">${t.two}</label>${seg("sideBySide", [["false", t.stacked], ["true", t.side]], o.sideBySide)}
    <label class="opt">${t.refLbl}</label>${seg("refMode", [["ONE_LINE", t.refOne], ["PER_TRANSLATION", t.refEach], ["NONE", t.refNone]], o.refMode)}
    <label class="opt">${t.refPos}</label>${seg("refPosition", [["BOTTOM", t.bottom], ["TOP", t.top]], o.refPosition)}
    <label class="opt">${t.bookName}</label>${seg("fullBookName", [["false", t.short], ["true", t.full]], o.fullBookName)}
    <div style="height:12px"></div><button class="primary" id="go">${t.showBtn}</button>
    ${b.selected.length ? `<div style="height:8px"></div><button id="rm">${t.remove}: ${esc(b.selected[0])}</button>` : ""}`,
    (r) => {
      r.querySelectorAll("#mods [data-f]").forEach((el) => {
        el.onclick = () => {
          const f = el.dataset.f, i = b.selected.indexOf(f);
          if (i >= 0) b.selected.splice(i, 1); else b.selected = b.selected.concat(f).slice(-2);
          save(); bibleSheet();
        };
      });
      r.querySelector("#addMod").onclick = () => $("pickModule").click();
      bindSeg(r, (k, v) => { o[k] = k === "versesPerSlide" ? Number(v) : v === "true" ? true : v === "false" ? false : v; save(); });
      const go = async () => {
        b.ref = r.querySelector("#ref").value.trim(); save();
        try {
          const slides = await postJson("/bible/slides", { ref: b.ref, modules: b.selected, options: o, style: {} });
          showItem({ kind: "scripture", slides, index: 0 });
          closeSheet();
        } catch (e) { toast(e.message); }
      };
      r.querySelector("#go").onclick = go;
      r.querySelector("#ref").onkeydown = (e) => { if (e.key === "Enter") go(); };
      const rm = r.querySelector("#rm");
      if (rm) rm.onclick = async () => { await authed("/bible/" + encodeURIComponent(b.selected[0]), { method: "DELETE" }); b.selected.shift(); save(); bibleSheet(); };
    });
}
$("pickModule").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const ref = await upload(f);
    const m = await postJson("/bible/install", ref);
    if (!settings.bible.selected.includes(m.file)) settings.bible.selected.push(m.file);
    save(); toast(`${t.added}: ${m.title}`); bibleSheet();
  } catch (err) { toast(err.message); }
};

// ——— Holyrics на том же компьютере, через экран Deixis ———
let hl = { tab: "playlist", q: "", data: {} };
const hlCall = (action, body = {}) => postJson("/holyrics/call", { port: settings.holyrics.port, token: settings.holyrics.token, action, body });
async function holyricsSheet() {
  if (receiver && !receiver.holyrics) return toast(t.noHolyrics);
  if (!settings.holyrics) {
    return openSheet(`<h3>Holyrics</h3><p class="muted">${t.hlConnect}</p>
      <div class="stack"><input id="hp" inputmode="numeric" placeholder="${t.port}" value="8091"><input id="ht" placeholder="${t.token}" autocomplete="off"><button class="primary" id="hc">${t.connect}</button></div>`,
      (r) => { r.querySelector("#hc").onclick = async () => {
        settings.holyrics = { port: Number(r.querySelector("#hp").value) || 8091, token: r.querySelector("#ht").value.trim(), theme: null };
        try { await hlCall("GetVersion"); save(); holyricsSheet(); } catch (e) { settings.holyrics = null; toast(e.message); }
      }; });
  }
  const tabs = [["playlist", t.playlist], ["songs", t.songs], ["texts", t.texts], ["photos", t.photos], ["videos", t.videos], ["themes", t.themes]];
  const load = { playlist: () => hlCall("GetSongPlaylist"), songs: () => hlCall("GetSongs", { fields: "id,title,artist,key,archived" }), texts: () => hlCall("GetTexts", { fields: "id,title,folder" }),
    photos: () => hlCall("GetImages", { include_thumbnail: true, include_metadata: true }), videos: () => hlCall("GetVideos", { include_thumbnail: true, include_metadata: true }), themes: () => hlCall("GetThemes") };
  try { if (!hl.data[hl.tab]) hl.data[hl.tab] = (await load[hl.tab]()) || []; } catch (e) { toast(e.message); hl.data[hl.tab] = []; }
  const q = hl.q.toLowerCase();
  const list = (hl.data[hl.tab] || []).filter((x) => !x.archived && !x.isDir && (!q || JSON.stringify([x.title, x.name, x.artist]).toLowerCase().includes(q)));
  let rows;
  if (hl.tab === "themes") {
    rows = [{ id: "", name: t.asItem }].concat(list).map((x) => `<div class="it" data-theme="${esc(x.id)}"><span class="t"><b>${esc(x.name || x.id)}</b></span>${(settings.holyrics.theme || "") === x.id ? "✓" : ""}</div>`).join("");
  } else if (hl.tab === "photos" || hl.tab === "videos") {
    rows = list.map((x) => `<div class="it" data-file="${esc(x.name)}">${x.thumbnail ? `<img alt="" src="data:image/jpeg;base64,${x.thumbnail.replace(/^data:[^,]*,/, "")}">` : ""}<span class="t"><b>${esc(x.name)}</b></span></div>`).join("");
  } else {
    rows = list.map((x) => `<div class="it"><span class="t"><b>${esc(x.title || "—")}</b><small>${esc(x.artist || x.folder || x.key || "")}</small></span>
      <button class="pill" data-deixis="${esc(x.id)}">${t.toScreen}</button><button class="pill" data-hl="${esc(x.id)}">${t.toHolyrics}</button></div>`).join("");
  }
  openSheet(`<h3>Holyrics</h3><div class="pills">${tabs.map(([k, l]) => `<button class="${k === hl.tab ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
    ${hl.tab === "themes" ? "" : `<div style="height:8px"></div><input id="hq" placeholder="${t.search}" value="${esc(hl.q)}">`}
    <div style="height:8px"></div><div class="list">${rows || `<div class="it muted">${t.empty}</div>`}</div>
    <div style="height:10px"></div><div class="row"><button id="hpv">${t.hlPrev}</button><button id="hnx">${t.hlNext}</button></div>
    <div style="height:8px"></div><div class="row"><button id="hrf">↻</button><button id="hdc">${t.disconnect}</button><button id="hok">${t.close}</button></div>`,
    (r) => {
      r.querySelectorAll("[data-tab]").forEach((b) => { b.onclick = () => { hl.tab = b.dataset.tab; holyricsSheet(); }; });
      const hq = r.querySelector("#hq");
      if (hq) hq.oninput = () => { hl.q = hq.value; clearTimeout(hq.t); hq.t = setTimeout(holyricsSheet, 350); };
      const kind = hl.tab === "texts" ? "text" : "song";
      r.querySelectorAll("[data-deixis]").forEach((b) => { b.onclick = async () => {
        try {
          const set = await postJson("/holyrics/slides", { port: settings.holyrics.port, token: settings.holyrics.token, [kind]: b.dataset.deixis, theme: settings.holyrics.theme || null });
          showItem({ kind: "text", slides: set.slides, index: 0, title: set.title, style: set.style, labels: set.labels });
          closeSheet();
        } catch (e) { toast(e.message); }
      }; });
      r.querySelectorAll("[data-hl]").forEach((b) => { b.onclick = () => hlCall(kind === "text" ? "ShowText" : "ShowSong", { id: b.dataset.hl }).then(() => toast(t.shownInHolyrics), (e) => toast(e.message)); });
      r.querySelectorAll("[data-theme]").forEach((el) => { el.onclick = () => { settings.holyrics.theme = el.dataset.theme || null; save(); holyricsSheet(); }; });
      r.querySelectorAll("[data-file]").forEach((el) => { el.onclick = async () => {
        const media = hl.tab === "photos" ? "IMAGE" : "VIDEO";
        try {
          const ref = await postJson("/holyrics/media", { port: settings.holyrics.port, token: settings.holyrics.token, kind: media, name: el.dataset.file });
          showItem({ kind: media === "IMAGE" ? "image" : "video", ref });
          closeSheet();
        } catch (e) { toast(e.message); }
      }; });
      r.querySelector("#hpv").onclick = () => hlCall("ActionPrevious").catch((e) => toast(e.message));
      r.querySelector("#hnx").onclick = () => hlCall("ActionNext").catch((e) => toast(e.message));
      r.querySelector("#hrf").onclick = () => { hl.data = {}; holyricsSheet(); };
      r.querySelector("#hdc").onclick = () => { settings.holyrics = null; hl.data = {}; save(); closeSheet(); };
      r.querySelector("#hok").onclick = closeSheet;
    });
}

// Экран телефона не гаснет, пока открыт пульт: Wake Lock (Safari 16.4+, Chrome), а на старых iPhone —
// беззвучное крошечное видео по кругу, его можно запустить только после касания.
let wake = null, awakeVideo = null;
async function keepAwake() {
  if (document.visibilityState !== "visible") return;
  if ("wakeLock" in navigator) { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} return; }
  if (!awakeVideo) {
    awakeVideo = document.createElement("video");
    awakeVideo.src = "/remote/keepawake.mp4";
    awakeVideo.muted = true; awakeVideo.loop = true; awakeVideo.playsInline = true;
    awakeVideo.setAttribute("playsinline", ""); awakeVideo.setAttribute("muted", "");
    awakeVideo.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.append(awakeVideo);
  }
  awakeVideo.play().catch(() => {});
}
document.addEventListener("pointerdown", keepAwake, { passive: true });
if (/Android/.test(navigator.userAgent)) $("openApp").classList.remove("hidden");

// Запуск: PIN из QR-кода или сохранённый токен.
if (params.get("pin")) connect(params.get("pin"));
else if (token) connect();
else showPair();
</script>
</body>
