<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deixis — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
<style>
/* Токены из DESIGN.md */
:root{
  --bg:#F3F2EE; --cell:#FFFFFF; --ink:#161514; --l2:#87847E; --l3:#C6C3BC;
  --tint:#9C7242; --tint-text:#765A38; --red:#A75750; --live:#A75750; --gold:#A87A00;
  --sep:rgba(60,55,45,.15); --fill:rgba(120,115,105,.12); --fill2:rgba(120,115,105,.2);
  --t-fast:140ms; --t-mid:240ms; --t-slow:340ms;
  --e-out:cubic-bezier(.2,.8,.2,1); --e-in:cubic-bezier(.4,0,1,1); --e-spring:cubic-bezier(.3,1.35,.55,1);
  --r-card:12px; --r-btn:14px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --l2:#8D8D93; --l3:#48484A;
  --tint:#BC9361; --tint-text:#BC9361; --red:#B96E65; --live:#B96E65; --gold:#FFD43B;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  color-scheme:dark;
}
[data-theme="paper"]{ --bg:#F4EFE6; --cell:#FBF8F2; --ink:#2B2620; }
[data-theme="oled"]{
  --bg:#000; --cell:#0E0E10; --ink:#FFFFFF; --l2:#8D8D93; --l3:#48484A;
  --tint:#BC9361; --tint-text:#BC9361; --red:#B96E65; --live:#B96E65; --gold:#FFD43B;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:17px/1.35 -apple-system,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  letter-spacing:-.01em; overflow:hidden;
  transition:background var(--t-mid) var(--e-out), color var(--t-mid) var(--e-out);
}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink);letter-spacing:inherit}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Каркас */
.app{display:grid;grid-template-rows:1fr auto;height:100dvh}
main{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.tabs{display:flex;background:var(--cell);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;color:var(--l2);min-height:50px}
.tab[aria-current="page"]{color:var(--tint)}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;min-height:56px}
.top h1{font-size:28px;line-height:1.1;margin:0;font-weight:700;flex:1;letter-spacing:-.02em}
.scroll{overflow:auto;min-height:0;flex:1;-webkit-overflow-scrolling:touch}
.pad{padding:0 16px 24px}

.iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink);transition:transform var(--t-fast) var(--e-spring),background var(--t-fast)}
.iconbtn:active{transform:scale(.92);background:var(--fill)}
.pill{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform var(--t-fast) var(--e-spring)}
.pill:active{transform:scale(.95)}
.pill.tint{background:var(--tint);color:#fff}
.btn{height:50px;border-radius:var(--r-btn);background:var(--fill);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform var(--t-fast) var(--e-spring),background var(--t-fast)}
.btn:active{transform:scale(.97)}
.btn.tint{background:var(--tint);color:#fff}
.btn.red{color:var(--red)}
.btn[disabled]{opacity:.4;pointer-events:none}

.group{background:var(--cell);border-radius:var(--r-card);overflow:hidden;margin:0 0 20px}
.ghead{font-size:13px;color:var(--l2);text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;width:100%;text-align:left;position:relative}
.row+.row::before,.row+.slides+.row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .kind{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--tint-text);flex:none}
.row .kind .ico{width:17px;height:17px}
.row.open{background:var(--fill)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;flex:none}
.tag.live{background:var(--live);color:#fff}
.tag.pre{background:var(--fill2);color:var(--tint-text)}
.chev{color:var(--l3)}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px;font-weight:500;padding:0 10px;white-space:nowrap;transition:background var(--t-fast)}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:40px;margin:0 0 10px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:17px}
.search .ico{color:var(--l2);width:18px;height:18px}

.switch{width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;flex:none;transition:background var(--t-mid) var(--e-out)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform var(--t-mid) var(--e-spring)}
.switch[aria-checked="true"]{background:var(--tint)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:flex;background:var(--fill);border-radius:9px;flex:none}
.stepper button{width:44px;height:32px;font-size:20px}
.stepper span{min-width:32px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:15px}
.swatches{display:flex;gap:8px;flex:none}
.sw{width:30px;height:30px;border-radius:999px;border:.5px solid var(--sep)}
.sw[aria-pressed="true"]{outline:2px solid var(--tint);outline-offset:2px}

/* Слайд: пропорции вывода, размер текста — доля высоты */
.slide{position:relative;aspect-ratio:16/9;width:100%;border-radius:8px;overflow:hidden;background:#000;color:#fff;container-type:inline-size;display:grid;place-items:center;user-select:none}
.slide .txt{padding:5cqw;text-align:center;white-space:pre-line;font-weight:600;line-height:1.2;font-size:calc(var(--fs,8) * .5625cqw);transition:opacity var(--t-mid) var(--e-out)}
.slide.shadow .txt{text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.8)}
.slide.outline .txt{-webkit-text-stroke:.15cqw rgba(0,0,0,.9)}
.slide .ref{position:absolute;right:5cqw;bottom:4cqw;font-size:2.6cqw;opacity:.75;font-weight:500}
.slide.bg-navy{background:linear-gradient(160deg,#18233a,#0b1120)}
.slide.bg-warm{background:linear-gradient(160deg,#4a3420,#1c130b)}
.slide.bg-clouds{background:linear-gradient(120deg,#5d7896,#a3b5c7,#6c86a4,#3f566f);background-size:300% 300%;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}
.slide .page{width:56%;aspect-ratio:1/1.414;background:#fff;border-radius:.6cqw;padding:3cqw;display:flex;flex-direction:column;gap:1.4cqw;color:#222}
.slide .page b{font-size:3cqw}
.slide .page i{display:block;height:.9cqw;background:#ddd;border-radius:1cqw}
.slide .logo{font-size:7cqw;font-weight:700;letter-spacing:.04em;color:#BC9361}
.slide .num{position:absolute;left:6px;top:4px;font-size:11px;color:rgba(255,255,255,.75);font-weight:600}

.mons{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px}
.mon{display:flex;flex-direction:column;gap:6px}
.mon .lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--l2);font-weight:600;min-height:20px}
.mon .lbl .dot{width:8px;height:8px;border-radius:99px;background:var(--live)}
.mon .slide{touch-action:none;cursor:pointer;transition:transform var(--t-fast) var(--e-spring)}
.mon .slide:active{transform:scale(.98)}
.mon.now .slide{outline:2px solid var(--live);outline-offset:2px}
.mon.pre .slide{outline:2px dashed var(--l3);outline-offset:2px}
.mon .hint{font-size:12px;color:var(--l2);min-height:16px}
.mon .go{margin-left:auto;height:26px;padding:0 10px;font-size:13px;border-radius:999px;background:var(--tint);color:#fff;font-weight:600}
.mon .go[disabled]{opacity:.35;pointer-events:none}
.changed{color:var(--tint-text)}

.slides{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 16px 14px}
.slides .slide{cursor:pointer;transition:transform var(--t-fast) var(--e-spring)}
.slides .slide:active{transform:scale(.97)}
.slides .slide.is-live{outline:2px solid var(--live);outline-offset:2px}
.slides .slide.is-pre{outline:2px dashed var(--tint);outline-offset:2px}

.devs{display:flex;align-items:center;gap:2px;margin-left:auto}
.dev{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--ink)}
.dev.offline{color:var(--l3)}
.dev.sync::before{content:"";position:absolute;inset:3px;border-radius:999px;border:2px solid var(--tint);border-right-color:transparent;animation:spin 1.2s linear infinite}
.dev.error::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:99px;background:var(--red);border:2px solid var(--bg)}
.dev .n{position:absolute;bottom:2px;right:0;font-size:10px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:99px;padding:0 4px;line-height:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.setpick{display:flex;align-items:center;gap:4px;font-weight:700;font-size:17px;min-height:44px;min-width:0}
.setpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bar{display:flex;gap:6px;padding:8px 12px;background:var(--cell);border-top:.5px solid var(--sep)}
.bar button{flex:1;min-height:50px;border-radius:var(--r-btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;background:var(--fill);transition:transform var(--t-fast) var(--e-spring),background var(--t-fast)}
.bar button:active{transform:scale(.94)}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar .ico{width:20px;height:20px}

.show{display:flex;flex-direction:column;min-height:0;flex:1}
.show .cols{flex:1;min-height:0;display:flex;flex-direction:column}
.show .cols>.right{flex:1;min-height:0;display:flex;flex-direction:column}
.mark{font-family:"GFS Didot","Gentium Book Plus",Georgia,serif;letter-spacing:.18em;font-weight:400;font-size:22px;line-height:1;color:var(--ink);white-space:nowrap}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 14px;scrollbar-width:none}
.tile{flex:none;width:116px;height:84px;border-radius:var(--r-card);background:var(--cell);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;font-size:14px;font-weight:600;text-align:left;transition:transform var(--t-fast) var(--e-spring)}
.tile:active{transform:scale(.95)}
.tile .ico{color:var(--tint-text);width:24px;height:24px}
.lhead{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.lhead .seg{flex:1}
.vbar{display:flex;flex-direction:column;gap:6px;padding:8px 12px;background:var(--cell);border-top:.5px solid var(--sep)}
.vbar .bar{padding:0;border:0;background:none}
.vrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums}
.vrow input[type=range]{flex:1;accent-color:var(--tint)}
.slide.deck{background:#fff;color:#1d1b18;place-items:stretch}
.slide.deck .dk{padding:6cqw 7cqw;display:flex;flex-direction:column;gap:2.2cqw;text-align:left}
.slide.deck .dk h3{margin:0;font-size:5cqw;line-height:1.1;color:#1d1b18}
.slide.deck .dk h3::after{content:"";display:block;width:8cqw;height:.6cqw;background:#9C7242;margin-top:2cqw}
.slide.deck .dk li{font-size:3cqw;line-height:1.35;color:#3a3732}
.slide.deck .dk ul{margin:0;padding-left:4cqw}
.slide.photo{background:linear-gradient(180deg,#f2b880 0%,#d9825b 38%,#5b4a6b 70%,#2a2238 100%)}
.slide.photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#1b1a24,#0e0d14);clip-path:polygon(0 40%,18% 10%,34% 45%,52% 0,70% 38%,86% 15%,100% 35%,100% 100%,0 100%)}
.slide.video{background:linear-gradient(120deg,#20443a,#4f7a5c,#a1b06a,#2f5a4c);background-size:300% 300%;animation:drift 9s ease-in-out infinite alternate}
.slide.video.paused{animation-play-state:paused}
.slide.mirror .phone{width:22%;aspect-ratio:9/19;border-radius:2.4cqw;background:#F3F2EE;border:.6cqw solid #333;display:flex;flex-direction:column;gap:1cqw;padding:2cqw 1.6cqw}
.slide.mirror .phone i{display:block;height:1.4cqw;border-radius:1cqw;background:#d8d4cc}
.slide.mirror .phone b{display:block;flex:1;border-radius:1cqw;background:#9C7242;opacity:.7}
.slide .mk{font-family:"GFS Didot",Georgia,serif;letter-spacing:.18em;font-size:7cqw;color:#fff;font-weight:400}
.pinbox{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.recv{position:fixed;inset:0;background:#000;color:#fff;display:grid;place-items:center;z-index:50}
.recv .idle{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.recv .idle .mk{font-family:"GFS Didot",Georgia,serif;letter-spacing:.18em;font-size:clamp(40px,9vw,120px)}
.recv .idle .nm{font-size:clamp(16px,2.2vw,26px);opacity:.85}
.recv .idle .meta{display:flex;gap:28px;align-items:center;margin-top:18px;font-size:clamp(12px,1.4vw,17px);opacity:.6;text-align:left}
.recv .idle .meta b{display:block;font-size:clamp(20px,3vw,36px);letter-spacing:.12em;opacity:1;color:#fff;font-weight:600}
.recv .idle .qr{width:clamp(80px,10vw,140px);height:auto;aspect-ratio:1}
.recv .full-slide{width:100vw;height:100vh;display:grid;place-items:center}
.recv .full-slide .slide{border-radius:0;width:min(100vw,calc(100vh*16/9))}
.cn-text{display:none}
.connect{width:44px;height:44px;padding:0;justify-content:center}
.colslides{display:none}

/* Шторки */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity var(--t-mid) var(--e-out);z-index:20}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;background:var(--bg);border-radius:14px 14px 0 0;z-index:21;display:flex;flex-direction:column;transform:translateY(100%);transition:transform var(--t-slow) var(--e-out);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet.closing{transition:transform var(--t-mid) var(--e-in)}
.sheet .grab{padding:8px 0 4px;touch-action:none;cursor:grab}
.sheet .grab i{display:block;width:36px;height:5px;border-radius:99px;background:var(--l3);margin:0 auto}
.sheet .sh{display:flex;align-items:center;padding:4px 16px 12px;gap:8px}
.sheet .sh h2{flex:1;margin:0;font-size:20px;font-weight:700}
.sheet .sb{overflow:auto;padding:0 16px 20px}
textarea.big{width:100%;min-height:150px;border:0;border-radius:var(--r-card);background:var(--cell);padding:12px 14px;resize:vertical;outline:none}
.field{width:100%;height:50px;border:0;border-radius:var(--r-card);background:var(--cell);padding:0 14px;outline:none;font-size:17px}
.code{font-size:28px;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:14px;color:var(--l2);margin:6px 4px 16px}

/* Предпросмотр во весь экран и зритель */
.full{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;opacity:0;transform:translateY(24px) scale(.98);transition:opacity var(--t-slow) var(--e-out),transform var(--t-slow) var(--e-out);color:#fff}
.full.on{opacity:1;transform:none}
.full .ft{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.full .ft .ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .stage{flex:1;display:grid;place-items:center;padding:8px 12px;min-height:0;touch-action:none}
.full .stage .slide{max-width:calc((100dvh - 190px) * 16 / 9);border-radius:4px}
.full .fb{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.full .fb .btn{background:rgba(255,255,255,.14);color:#fff}
.full .fb .btn.tint{background:#BC9361}
.full .cnt{font-size:14px;opacity:.7;font-variant-numeric:tabular-nums}
.full .iconbtn{color:#fff}
.full .iconbtn:active{background:rgba(255,255,255,.15)}
.full .tag.live{background:#B96E65}
.viewer .stage{padding:0}
.viewer .stage .slide{max-width:none;max-height:100dvh;border-radius:0}
.viewer .ft{position:absolute;left:0;right:0;top:0;background:linear-gradient(#000c,#0000);opacity:0;transition:opacity var(--t-mid) var(--e-out);pointer-events:none}
.viewer.ui .ft{opacity:1;pointer-events:auto}
.viewer .lost{position:absolute;right:12px;bottom:12px;font-size:12px;opacity:.7}

.toasts{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin var(--t-mid) var(--e-out);max-width:calc(100% - 32px)}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}

.hero{display:grid;gap:10px;margin:4px 0 20px}
.hero .btn{height:64px;font-size:18px}
.qr{width:148px;height:148px;background:#fff;border-radius:10px;padding:8px;flex:none}
.room{display:flex;gap:16px;align-items:center;padding:16px}
.room .big{font-size:30px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-property:opacity!important}
  .sheet{transform:none;opacity:0}.sheet.on{opacity:1}
  .full{transform:none}
}

/* Телефон горизонтально и половина экрана: две колонки */
@media (min-width:700px){
  .cn-text{display:inline}
  .connect{width:auto;height:36px;padding:0 14px}
  .show .cols>.left{overflow:hidden;min-height:0}
  .lscroll{flex:1}
  .show .cols>.left .tiles{flex-wrap:wrap;overflow:visible}
  .show .cols>.left .tile{width:calc((100% - 20px) / 3)}
  .show .cols{flex-direction:row}
  .show .cols>.left{width:42%;max-width:440px;display:flex;flex-direction:column;border-right:.5px solid var(--sep)}
  .show .cols>.left .mons{grid-template-columns:1fr;padding-top:4px}
  .show .cols>.right{flex:1;min-width:0;display:flex;flex-direction:column}
}
@media (min-width:700px) and (max-height:500px){
  .show .cols>.left .mons{grid-template-columns:1fr 1fr}
}
/* Планшет и окно от 1024: полоса слева 92 px, три колонки */
@media (min-width:1024px){
  .app{grid-template-columns:92px 1fr;grid-template-rows:1fr}
  .tabs{order:-1;flex-direction:column;border-top:0;border-right:.5px solid var(--sep);padding:12px 0;justify-content:flex-start;gap:6px}
  .tab{flex:none;min-height:64px}
  .show .cols>.left{order:3;border-right:0;border-left:.5px solid var(--sep);width:380px}
  .show .cols>.right{order:1;flex:none;width:360px;border-right:.5px solid var(--sep)}
  .colslides{display:block;order:2;flex:1;overflow:auto}

  let x0 = null, y0, moved;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; moved = false; });
  el.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0, ax = Math.abs(dx), ay = Math.abs(dy); x0 = null;
    if (ax < 10 && ay < 10) return h.tap && h.tap();
    if (ax > ay && ax > 40) (dx < 0 ? h.left : h.right)?.();
    else if (ay > 40) (dy < 0 ? h.up : h.down)?.();

/* Устройства */
function qrSVG(seed){
  let x = seed, n = 25, cells = '';
  const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const finder = (r,c) => [[0,0],[0,n-7],[n-7,0]].some(([a,b]) => r>=a && r<a+7 && c>=b && c<b+7);
  const fcell = (r,c) => { for (const [a,b] of [[0,0],[0,n-7],[n-7,0]]) if (r>=a&&r<a+7&&c>=b&&c<b+7){ const i=r-a,j=c-b; return i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);} };
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (finder(r,c) ? fcell(r,c) : rnd() > .52) cells += `<rect x="${c}" y="${r}" width="1" height="1"/>`;
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" role="img" aria-label="QR-код комнаты"><g fill="#161514">${cells}</g></svg>`;
}

}
function sheetMirror(){
  openSheet('Экран телефона', `<p class="note" style="margin-top:0">Всё, что на экране телефона, уйдёт в зал. Подходит для презентаций с анимацией в PowerPoint или Google Slides и для любого приложения. Android спросит разрешение.</p>
    <button class="btn tint" data-act="mirrorgo">${ico('phone')}Начать трансляцию</button>`);
}
function sheetJoin(code=''){
  let role = 'viewer';
  const body = () => `<div class="stack">
    <input class="field code" id="jcode" inputmode="numeric" placeholder="000 000" value="${esc(code)}" aria-label="Код комнаты">
    <button class="btn" data-act="qrscan">${ico('search')}Сканировать QR</button>
    <div class="seg"><button data-act="jrole" data-r="viewer" aria-pressed="${role==='viewer'}">Зритель</button><button data-act="jrole" data-r="operator" aria-pressed="${role==='operator'}">Оператор</button></div>
    ${role==='operator'?'<input class="field" id="jpass" type="password" placeholder="Пароль операторов" aria-label="Пароль">':''}
    <p class="note" style="margin:0 4px">${role==='viewer'?'Зритель только смотрит показ на своём экране. Пароль не нужен.':'Оператор управляет показом вместе с ведущим. Пароль проверяет телефон ведущего.'}</p>
    <button class="btn tint" data-act="jgo">Присоединиться</button></div>`;
  openSheet('Присоединиться', `<div id="jbody">${body()}</div>`);
  JOIN = { setRole:r => { code = $('#jcode').value; role = r; $('#jbody').innerHTML = body(); }, role:() => role };
}
let JOIN = null;
function sheetSettings(){
  const st = S.settings;
  const html = () => `<div class="ghead">Тема</div><div class="seg" style="margin-bottom:18px">${[['light','Светлая'],['dark','Тёмная'],['paper','Бумага'],['oled','OLED']].map(([v,t]) => `<button data-act="theme" data-v="${v}" aria-pressed="${st.theme===v}">${t}</button>`).join('')}</div>
    <div class="ghead">Показ</div><div class="group">
      <div class="row"><span class="main"><div>Всегда через предпросмотр</div><div class="s">Любой слайд сначала идёт в предпросмотр</div></span>${toggle(st.alwaysPre,'set_alwaysPre','Всегда через предпросмотр')}</div>
      <div class="row"><span class="main"><div>Тёмная тема во время показа</div><div class="s">Яркий экран не мешает в зале</div></span>${toggle(st.darkLive,'set_darkLive','Тёмная тема во время показа')}</div>
      <div class="row"><span class="main">Bluetooth-кликер и педаль</span>${toggle(st.clicker,'set_clicker','Кликер')}</div>
      <div class="row"><span class="main">Кнопки громкости листают слайды</span>${toggle(st.volume,'set_volume','Кнопки громкости')}</div></div>
    <div class="ghead">Язык</div><div class="seg" style="margin-bottom:18px">${[['ru','Русский'],['uz','Oʻzbekcha'],['en','English']].map(([v,t]) => `<button data-act="lang" data-v="${v}" aria-pressed="${st.lang===v}">${t}</button>`).join('')}</div>
    <div class="ghead">Прототип</div><div class="group"><button class="row" data-act="tvdemo"><span class="kind">${ico('tv')}</span><span class="main"><div class="t">Открыть экран приёмника</div><div class="s">Во втором окне: так выглядит Deixis TV</div></span><span class="chev">${ico('chev')}</span></button></div>
    <p class="note"><span class="mark" style="font-size:15px">ΔΕΙΞΙΣ</span> · GPL-3.0 · без рекламы, аналитики и трекеров.</p>`;
  openSheet('Настройки', `<div id="setbody">${html()}</div>`);
  SET_RERENDER = () => { const b = $('#setbody'); if (b) b.innerHTML = html(); };
}
let SET_RERENDER = null;

/* Предпросмотр во весь экран и зритель */
let FULL = null;
function openFull(kind, ref){
  closeFull(true);
  const el = document.createElement('div'); el.className = 'full' + (kind==='viewer'?' viewer':''); el.setAttribute('role','dialog');
  document.body.append(el);
  let local = ref ? {...ref} : null;            // для библиотеки: свой указатель, вывод не трогается
  const cur = () => kind==='live' || kind==='viewer' ? S.live : kind==='pre' ? S.pre : local;
  const update = () => {
    const r = cur(); if (!r && kind!=='viewer' && kind!=='live') return closeFull();
    const src = srcOf(r), sl = r ? src.slides[r.idx] : null;
    const mode = kind==='live'||kind==='viewer' ? S.mode : 'normal';
    const st = kind==='pre' ? style() : S.style;
    const count = r ? `${r.idx+1} / ${src.slides.length}` : '';
    const inSet = r && r.itemId && activeSet().items.includes(r.itemId);
    if (kind === 'viewer') {
      el.innerHTML = `<div class="ft"><span class="ttl">Воскресное служение · Зал 1</span><button class="pill" data-act="leaveview" style="background:rgba(255,255,255,.18);color:#fff">Выйти</button></div>
        <div class="stage">${slideHTML(sl, st, {mode})}</div>`;
    } else {
      el.innerHTML = `<div class="ft"><button class="iconbtn" data-act="closefull" aria-label="Закрыть">${ico('down')}</button>
        <span class="ttl">${esc(src ? src.title : 'Сейчас')}</span>${kind==='live'?'<span class="tag live">В зале</span>':''}<span class="cnt">${count}</span></div>
        <div class="stage">${slideHTML(sl, st, {mode})}</div>
        <div class="fb">${kind==='live' ? `<button class="btn" data-act="fstep" data-d="-1">Назад</button><button class="btn" data-act="fstep" data-d="1">Дальше</button>`
          : `<button class="btn tint" data-act="fgo">${ico('up')}В зал</button><button class="btn" data-act="fstyle">${ico('brush')}Вид</button>${r && r.itemId && !inSet ? `<button class="btn" data-act="addset" data-id="${r.itemId}">В сетлист</button>` : ''}`}</div>`;
    }
    const stage = el.querySelector('.stage');
    const move = d => { const rr = cur(); if (!rr) return; const n = rr.idx + d; if (n < 0 || n >= srcOf(rr).slides.length) return;
      if (kind==='live') step(d); else if (kind==='pre') { S.pre = {...rr, idx:n}; render(); } else { local.idx = n; update(); } };
    if (kind === 'viewer') {
      let t; gest(stage, {tap:() => { el.classList.add('ui'); clearTimeout(t); t = setTimeout(() => el.classList.remove('ui'), 3000); }});
    } else gest(stage, {left:() => move(1), right:() => move(-1), down:() => closeFull(), up:() => kind!=='live' && FULL && FULL.go()});
    FULL.move = move;
  };
  FULL = {el, kind, update, go:() => {
    const r = cur(); if (!r) return;
    if (kind==='pre') preToLive(); else { if (S.draft){ S.style = S.draft; S.draft = null; } goLive(r.itemId ? {itemId:r.itemId, idx:r.idx} : {...r}); toast('В зале'); }
    closeFull();
  }};
  update();
  requestAnimationFrame(() => el.classList.add('on'));
}
function closeFull(now){
  if (!FULL) return; const el = FULL.el; FULL = null;
  if (now) return el.remove();
  el.classList.remove('on'); setTimeout(() => el.remove(), 260);
}

/* Обработчик всех действий */
const A = {
  lseg:d => { S.listSeg = d.v; render(); },
  recentpre:d => { S.pre = {itemId:d.id, idx:0}; render(); },
  pickpre:d => { S.pre = {itemId:d.id, idx:0}; S.open = d.id; closeSheet(); render(); },
  tile:d => d.k==='text' ? sheetText() : d.k==='mirror' ? sheetMirror() : sheetPick(d.k),
  mirrorgo:() => { closeSheet(); goLive({title:'Экран телефона', slides:[{mirror:true}], idx:0}); toast('Трансляция экрана идёт'); },
  mirrorstop:() => { S.live = null; render(); toast('Трансляция остановлена'); },
  fstep2:d => step(+d.d),
  vplay:() => { S.video.playing = !S.video.playing; render(); },
  vseek:d => { const dur = lib(S.live.itemId).slides[0].dur; S.video.t = Math.min(dur, Math.max(0, S.video.t + +d.d)); render(); },
  vloop:() => { S.video.loop = !S.video.loop; render(); },
  vvol:() => { S.video.vol = S.video.vol >= 100 ? 0 : S.video.vol + 20; render(); },
  pair:d => sheetPair(S.found.find(x=>x.id===d.id)),
  pairgo:d => { if (!/^\d{4}$/.test($('#pin').value)) return toast('PIN — 4 цифры');
    const x = S.found.find(v=>v.id===d.id); S.found = S.found.filter(v=>v.id!==d.id);
    S.devices.push({id:x.id, icon:x.icon, name:x.name, via:x.via.split(' · ')[0], state:'sync'}); closeSheet(); render(); toast(x.name + ': подключено');
    setTimeout(() => { const y = S.devices.find(v=>v.id===x.id); if (y) { y.state = 'online'; render(); } }, 1500); },
  manual:() => openSheet('Адрес приёмника', `<input class="field" id="addr" inputmode="decimal" placeholder="192.168.1.20" aria-label="Адрес"><div style="height:12px"></div><button class="btn tint" data-act="soon">Подключить</button><p class="note">Адрес показан внизу экрана приёмника.</p>`),
  tvdemo:() => { window.open(location.pathname + '#tv', 'deixis-tv'); },
  tab:d => { S.tab = d.id; render(); },
  open:d => { S.open = S.open === d.id && !isWide() ? null : d.id; render(); },
  slide:d => tapSlide(d.id, +d.i),
  preLive:() => preToLive(),
  mode:d => { S.mode = S.mode === d.m ? 'normal' : d.m; render(); },
  text:sheetText, find:sheetFind, style:sheetStyle, setpick:sheetSetpick, connect:sheetConnect, settings:sheetSettings,
  closesheet:() => closeSheet(),
  pickset:d => { S.active = d.id; S.open = activeSet().items[0]; closeSheet(); S.tab = 'show'; render(); toast('На главном: ' + activeSet().title + ', ' + activeSet().date); },
  newset:() => { const id = 'n' + Date.now(); S.setlists.unshift({id,title:'Новый сетлист',date:'1 ноября',items:[],past:false}); S.active = id; closeSheet(); render(); toast('Сетлист создан'); },
  setmore:d => { const s = S.setlists.find(x=>x.id===d.id); openSheet(s.title + ', ' + s.date, `<div class="stack"><button class="btn" data-act="pickset" data-id="${s.id}">На главный</button><button class="btn" data-act="dup" data-id="${s.id}">Дублировать</button><button class="btn red" data-act="delset" data-id="${s.id}">Удалить</button></div>`); },
  dup:d => { const s = S.setlists.find(x=>x.id===d.id); S.setlists.unshift({...s,id:'d'+Date.now(),date:'1 ноября',past:false,items:[...s.items]}); closeSheet(); render(); toast('Копия создана на 1 ноября'); },
  delset:d => { if (d.id === S.active) { closeSheet(); return toast('Сетлист на главном удалить нельзя'); } S.setlists = S.setlists.filter(x=>x.id!==d.id); closeSheet(); render(); toast('Сетлист удалён'); },
  libseg:d => { S.libSeg = d.id; render(); },
  libopen:d => openFull('lib', {itemId:d.id, idx:0}),
  import:() => openSheet('Добавить', `<div class="group">${['Новая песня','Новый текст','Место из Библии','Импорт: TXT, DOCX, OpenLyrics, OpenLP','Импорт: PDF, PPTX, PPT, ODP','Картинки и видео'].map(t => `<button class="row" data-act="soon"><span class="main">${t}</span><span class="chev">${ico('chev')}</span></button>`).join('')}</div>`),
  qrscan:() => toast('Камера в прототипе не работает'),
  soon:() => { closeSheet(); toast('В прототипе не работает'); },
  textpre:() => { const t = $('#ftext').value.trim(); if (!t) return; S.pre = {title:'Текст', slides:splitText(t), idx:0}; closeSheet(); render(); },
  textlive:() => { const t = $('#ftext').value.trim(); if (!t) return; goLive({title:'Текст', slides:splitText(t), idx:0}); closeSheet(); toast('В зале'); },
  tsave:(d, el) => el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'),
  findpre:d => { S.pre = {itemId:d.id, idx:0}; closeSheet(); S.tab = 'show'; render(); },
  addset:d => { const s = activeSet(); if (!s.items.includes(d.id)) s.items.push(d.id); render(); toast('Добавлено в сетлист'); if (SHEET && $('#fq')) $('#fq').dispatchEvent(new Event('input')); if (FULL) FULL.update(); },
  st:d => { S.draft[d.k] = d.v; render(); STYLE_RERENDER(); },
  fs:d => { S.draft.fs = Math.min(14, Math.max(4, S.draft.fs + +d.d)); render(); STYLE_RERENDER(); },
  stt:() => { S.draft.shadow = !S.draft.shadow; render(); STYLE_RERENDER(); },
  sto:() => { S.draft.outline = !S.draft.outline; render(); STYLE_RERENDER(); },
  stcancel:() => { S.draft = null; closeSheet(); render(); },
  stapply:() => { S.style = S.draft; S.draft = null; closeSheet(); render(); toast('Оформление в зале'); },
  dev:() => { S.tab = 'devices'; render(); },
  tabdev:() => { closeSheet(); S.tab = 'devices'; render(); },
  retry:d => { const x = S.devices.find(v=>v.id===d.id); x.state = 'sync'; render(); setTimeout(() => { x.state = 'online'; render(); toast(x.name + ': на связи'); }, 1500); },
  check:() => { const bad = S.devices.filter(d=>d.state!=='online'); toast(bad.length ? 'Требует внимания: ' + bad.map(d=>d.name).join(', ') : 'Все выводы готовы'); },
  start:() => { S.session = {role:'host', code:'482 913', pass:'2580', viewers:['Телефон · Анна','Планшет · звукорежиссёр','Телефон · гость']}; closeSheet(); S.tab = 'devices'; render(); toast('Показ начат'); },
  join:d => sheetJoin(d.code || ''),
  jrole:d => JOIN.setRole(d.r),
  jgo:() => {
    const code = $('#jcode').value.replace(/\D/g,'');
    if (code.length !== 6) return toast('Код — 6 цифр');
    if (JOIN.role() === 'operator') {
      if (!$('#jpass').value) return toast('Нужен пароль');
      S.session = {role:'operator', code:code.replace(/(\d{3})(\d{3})/,'$1 $2'), pass:'', viewers:['Телефон · гость']};
      closeSheet(); S.tab = 'show'; render(); toast('Подключено как оператор');
    } else { closeSheet(); openFull('viewer'); toast('Касание показывает «Выйти»'); }
  },
  leaveview:() => closeFull(),
  qrhall:() => toast('QR выведен в зал'),
  kick:d => { S.session.viewers.splice(+d.i, 1); render(); toast('Зритель отключён'); },
  end:() => openSheet('Завершить показ?', `<p class="note">Комната закроется, зрители и операторы отключатся. Экран зала станет чёрным.</p><div class="two"><button class="btn" data-act="closesheet">Отмена</button><button class="btn tint" data-act="endyes" style="background:var(--red)">Завершить</button></div>`),
  endyes:() => { S.session = null; S.mode = 'black'; closeSheet(); render(); toast('Показ завершён'); },
  leave:() => { S.session = null; render(); toast('Отключено'); },
  closefull:() => closeFull(),
  fstep:d => FULL && FULL.move(+d.d),
  fgo:() => FULL && FULL.go(),
  fstyle:() => { closeFull(); sheetStyle(); },
  theme:d => { S.settings.theme = d.v; render(); SET_RERENDER(); },
  lang:d => { if (d.v !== 'ru') toast('В прототипе только русский'); },
};
['alwaysPre','darkLive','clicker','volume'].forEach(k => A['set_'+k] = () => { S.settings[k] = !S.settings[k]; render(); SET_RERENDER(); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
/* Клавиши кликера: вперёд и назад, B — чёрный экран */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || !S.settings.clicker) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); step(1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === 'b' || e.key === 'и') A.mode({m:'black'});
  else if (e.key === 'Escape') { closeSheet(); closeFull(); }
});
const IS_TV = location.hash === '#tv';
function renderTV(msg){
  const el = $('#recv');
  if (!msg || !msg.live && msg.mode === 'normal') {
    el.innerHTML = `<div class="idle"><div class="mk">ΔΕΙΞΙΣ</div><div class="nm">ТВ в холле</div>
      <div class="meta">${qrSVG(9137)}<div>PIN для подключения<b>7 2 4 1</b>192.168.1.23 · Deixis TV</div></div>
      <div class="nm" style="opacity:.5;font-size:clamp(12px,1.4vw,17px);margin-top:10px">Откройте Deixis на телефоне и выберите это устройство</div></div>`;
    return;
  }
  S.video.playing = msg.playing;
  el.innerHTML = `<div class="full-slide">${slideHTML(msg.slide, msg.style, {mode:msg.mode})}</div>`;
}
if (IS_TV) {
  document.title = 'Deixis TV — прототип';
  $('#app').remove();
  const el = document.createElement('div'); el.className = 'recv'; el.id = 'recv'; document.body.append(el);
  renderTV(null);
  if (BC) BC.onmessage = e => renderTV(e.data);
} else {
  matchMedia('(min-width:1024px)').addEventListener('change', render);
  render();
}
</script>
</body>
</html>
