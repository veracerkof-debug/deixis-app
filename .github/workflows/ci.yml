name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  core-desktop:
    name: Ядро и компьютер
    runs-on: ubuntu-latest
    env:
      DEIXIS_SKIP_ANDROID: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Тесты и сборка
        run: ./gradlew :diag:test :core:test :desktop:test :desktop:distZip -Ddeixis.outputsPng=$PWD/build/frames --stacktrace
      - name: Кадры всех форматов экрана
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frames
          path: build/frames/
      - name: Что упало
        if: failure()
        run: python3 tools/test-failures.py
      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deixis-desktop
          path: desktop/build/distributions/*.zip

  desktop-gui:
    # Настоящие окна на настоящих системах: окно оператора не запирает экран, отвечает мыши и клавишам.
    name: Окна компьютера (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      DEIXIS_SKIP_ANDROID: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: VLC и ffmpeg (видео на настоящем VLC)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vlc ffmpeg > /dev/null
      - name: VLC и ffmpeg на Windows (слой поверх VLC в отдельном окне)
        if: runner.os == 'Windows'
        run: choco install vlc ffmpeg -y --no-progress > /dev/null
      - name: VLC и ffmpeg на macOS (кадры через память, слой поверх)
        if: runner.os == 'macOS'
        run: brew install --cask vlc > /dev/null && brew install ffmpeg > /dev/null
      - name: Проверка окон
        run: |
          tests=(--tests '*DesktopWindowTest*' --tests '*KeyActionTest*' --tests '*DesktopUpdatesTest*' --tests '*VideoFitGuiTest*' --tests '*BackdropGuiTest*' --tests '*OverlayGuiTest*' --tests '*ScreenCaptureTest*' --tests '*MacVirtualScreenTest*' --tests '*PultWindowTest*')
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :desktop:test -Ddeixis.gui=1 "${tests[@]}" --stacktrace
          else
            ./gradlew :desktop:test -Ddeixis.gui=1 "${tests[@]}" --stacktrace
          fi
          # «Наложение» — отдельно и последним: окно поверх всех и щелчок сквозь него не должны задеть другие проверки.
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :desktop:test -Ddeixis.gui=1 --tests '*OverlayWindowGuiTest*' --stacktrace
          else
            ./gradlew :desktop:test -Ddeixis.gui=1 --tests '*OverlayWindowGuiTest*' --stacktrace
          fi
          # Проверка не должна пропуститься молча: без экрана она помечается пропущенной.
          if grep -l '<skipped' desktop/build/test-results/test/TEST-app.deixis.desktop.DesktopWindowTest.xml; then
            echo "::error::Проверка окон пропущена: нет экрана"; exit 1
          fi
          grep -h -A6 '<system-out>' desktop/build/test-results/test/TEST-app.deixis.desktop.DesktopWindowTest.xml || true
      - name: Что упало
        if: failure()
        run: python3 tools/test-failures.py
      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-reports-${{ matrix.name }}
          path: "**/build/reports/tests/"

  android:
    name: Android (телефон и ТВ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Сборка APK
        run: ./gradlew :android:phone:testDebugUnitTest :android:phone:assembleDebug :android:tv:assembleDebug --continue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deixis-android
          path: |
            android/phone/build/outputs/apk/debug/*.apk
            android/tv/build/outputs/apk/debug/*.apk
