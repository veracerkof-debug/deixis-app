name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-desktop:
    name: Ядро и компьютер
    runs-on: ubuntu-latest
    env:
      DEIXIS_SKIP_ANDROID: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты и сборка
        run: ./gradlew :core:test :desktop:test :desktop:distZip --stacktrace
      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - uses: actions/upload-artifact@v4
        with:
          name: deixis-desktop
          path: desktop/build/distributions/*.zip

  android:
    name: Android (телефон и ТВ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка APK
        run: ./gradlew :android:phone:assembleDebug :android:tv:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deixis-android
          path: |
            android/phone/build/outputs/apk/debug/*.apk
            android/tv/build/outputs/apk/debug/*.apk
