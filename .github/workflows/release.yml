name: Release

# Релиз: метка vX.Y.Z или ручной запуск с версией и галочкой «Опубликовать».
# Ручной запуск без галочки собирает те же файлы без релиза — для проверки.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 0.1.0"
        required: false
        default: ""
      publish:
        description: "Опубликовать релиз"
        type: boolean
        default: false
      test:
        description: "Пробная сборка (только для тестеров: канал «Пробные»)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VLC_VERSION: "3.0.21"
  RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}

jobs:
  android:
    name: APK телефона и ТВ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Версия
        shell: bash
        run: echo "DEIXIS_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"
        if: env.RELEASE_VERSION != ''
      - name: Ключ подписи
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DEIXIS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::Нет секрета DEIXIS_KEYSTORE_BASE64: релиз без постоянного ключа подписи выпускать нельзя"
              exit 1
            fi
            echo "::warning::Ключа подписи нет, APK будут неподписанными (только для проверки сборки)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deixis-release.jks"
          echo "DEIXIS_KEYSTORE_FILE=$RUNNER_TEMP/deixis-release.jks" >> "$GITHUB_ENV"
      - name: Проверка ключа
        if: env.DEIXIS_KEYSTORE_FILE != ''
        shell: bash
        env:
          PASS: ${{ secrets.DEIXIS_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.DEIXIS_KEY_ALIAS }}
        run: |
          # Понятная ошибка вместо длинного отчёта Gradle; значения секретов не печатаются.
          if ! keytool -list -keystore "$DEIXIS_KEYSTORE_FILE" -storepass "$PASS" > /dev/null 2>&1; then
            [ "$PASS" != "$(echo "$PASS" | xargs)" ] && echo "::error::В секрете DEIXIS_KEYSTORE_PASSWORD лишний пробел в начале или в конце"
            echo "::error::Пароль из DEIXIS_KEYSTORE_PASSWORD не подходит к ключу из DEIXIS_KEYSTORE_BASE64"
            exit 1
          fi
          if ! keytool -list -keystore "$DEIXIS_KEYSTORE_FILE" -storepass "$PASS" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::В ключе нет имени из DEIXIS_KEY_ALIAS (должно быть deixis)"
            exit 1
          fi
          echo "Ключ и пароль подходят друг к другу"
      - name: Сборка
        env:
          DEIXIS_KEYSTORE_PASSWORD: ${{ secrets.DEIXIS_KEYSTORE_PASSWORD }}
          DEIXIS_KEY_ALIAS: ${{ secrets.DEIXIS_KEY_ALIAS }}
          DEIXIS_KEY_PASSWORD: ${{ secrets.DEIXIS_KEY_PASSWORD }}
        # Сначала проверки, в том числе чтение данных прошлых версий: если что-то не читается, выпуск не выходит.
        run: ./gradlew :core:test :android:phone:testReleaseUnitTest :android:phone:assembleRelease :android:tv:assembleRelease --continue
      - name: Имена файлов
        shell: bash
        run: |
          v="${DEIXIS_VERSION:-dev}"
          mkdir -p out
          for app in phone tv; do
            name=$([ "$app" = phone ] && echo "Deixis" || echo "Deixis-TV")
            for f in android/$app/build/outputs/apk/release/*.apk; do
              abi=$(basename "$f" .apk | sed -E "s/^$app-//; s/-release(-unsigned)?$//")
              [ "$abi" = universal ] && abi="all"
              cp "$f" "out/$name-$v-$abi.apk"
            done
          done
          ls -la out
          rm -f "$RUNNER_TEMP/deixis-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  smoke:
    # Ровно те APK, что уйдут в выпуск: ставятся на эмуляторы Android 8 и 13, открываются, пульт проходит все вкладки.
    # Без этой проверки выпуск не выходит.
    name: Проверка APK на Android ${{ matrix.api }}
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_DIR: apk
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tools/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ matrix.api }}
          path: smoke/

  desktop:
    name: Установщик ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, type: msi }
          - { name: macOS, os: macos-latest, type: dmg }
          - { name: Linux, os: ubuntu-latest, type: deb }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Версия
        run: |
          v="${RELEASE_VERSION#v}"
          [ -n "$v" ] || v="0.1.0"
          v="${v%%-*}"
          # macOS не принимает версию с нулём в начале: 0.Y.Z превращается в 1.0.(Y*100+Z) только для пакета Mac.
          if [ "${{ runner.os }}" = macOS ] && [ "${v%%.*}" = 0 ]; then
            IFS=. read -r _ minor patch <<< "$v"
            v="1.0.$(( ${minor:-0} * 100 + ${patch:-0} ))"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Сборка программы
        env:
          DEIXIS_SKIP_ANDROID: "1"
        run: |
          # Настоящая версия выпуска внутри программы (на Маке у пакета она другая: 1.0.N).
          v="${RELEASE_VERSION#v}"
          DEIXIS_VERSION="${v:-0.1.0}" ./gradlew :desktop:installDist
      - name: VLC для Windows
        if: runner.os == 'Windows'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o vlc.zip "https://get.videolan.org/vlc/$VLC_VERSION/win64/vlc-$VLC_VERSION-win64.zip"
          7z x -y vlc.zip > /dev/null
          mkdir -p content/vlc
          cp vlc-$VLC_VERSION/libvlc.dll vlc-$VLC_VERSION/libvlccore.dll content/vlc/
          cp -r vlc-$VLC_VERSION/plugins content/vlc/
          echo "VLC_OPT=-Djna.library.path=\$APPDIR\\..\\vlc" >> "$GITHUB_ENV"
          # WiX 3 обычно уже есть на машинах GitHub; ставим, только если его нет.
          wix=$(ls -d "/c/Program Files (x86)"/WiX\ Toolset\ v3*/bin 2>/dev/null | head -1)
          if [ -z "$wix" ]; then
            choco install wixtoolset -y --no-progress
            wix=$(ls -d "/c/Program Files (x86)"/WiX\ Toolset\ v3*/bin | head -1)
          fi
          cygpath -w "$wix" >> "$GITHUB_PATH"
      - name: VLC для macOS
        if: runner.os == 'macOS'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o vlc.dmg "https://get.videolan.org/vlc/$VLC_VERSION/macosx/vlc-$VLC_VERSION-arm64.dmg"
          hdiutil attach -nobrowse -mountpoint /tmp/vlc vlc.dmg
          mkdir -p content/vlc
          cp -R /tmp/vlc/VLC.app/Contents/MacOS/lib content/vlc/lib
          cp -R /tmp/vlc/VLC.app/Contents/MacOS/plugins content/vlc/plugins
          hdiutil detach /tmp/vlc
          echo "VLC_OPT=-Djna.library.path=\$APPDIR/../vlc/lib" >> "$GITHUB_ENV"
      - name: Установщик
        run: |
          args=(
            --type "${{ matrix.type }}"
            --name Deixis
            --app-version "$APP_VERSION"
            --vendor "Deixis"
            --description "Показ с телефона на любой экран"
            --input desktop/build/install/deixis/lib
            --main-jar desktop.jar
            --main-class app.deixis.desktop.MainKt
            --java-options "-Dfile.encoding=UTF-8"
            --dest out
          )
          [ -n "$VLC_OPT" ] && args+=(--java-options "$VLC_OPT" --app-content content/vlc)
          case "${{ runner.os }}" in
            Windows) args+=(--icon desktop/packaging/deixis.ico --win-menu --win-shortcut --win-dir-chooser --win-upgrade-uuid 6f3c1a52-8d0b-4c1e-9a77-2b5e4d1c9f10) ;;
            # Полный экран macOS (MacScreen) и имя в меню программы.
            macOS) args+=(--icon desktop/packaging/deixis.icns --java-options "--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED" --mac-package-name Deixis) ;;
            Linux) args+=(--icon desktop/packaging/deixis.png --linux-shortcut --linux-package-name deixis --linux-package-deps "libvlc5, vlc-plugin-base, vlc-plugin-video-output, libreoffice-impress-nogui | libreoffice-impress, libreoffice-writer-nogui | libreoffice-writer, libreoffice-calc-nogui | libreoffice-calc, fonts-crosextra-carlito, fonts-crosextra-caladea, fonts-liberation2 | fonts-liberation") ;;
          esac
          jpackage "${args[@]}"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*

  release:
    name: Релиз
    # Mac-машины GitHub иногда так и не выдаются; релиз выходит и без .dmg, если APK собраны.
    if: always() && needs.android.result == 'success' && needs.smoke.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
    needs: [android, smoke, desktop]
    runs-on: ubuntu-latest
    steps:
      # Только файлы выпуска: снимки экранов проверки (release-smoke-*) в выпуск не попадают.
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: files
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: files
          merge-multiple: true
      - name: Номер версии
        id: ver
        shell: bash
        run: |
          v="${RELEASE_VERSION#v}"
          echo "v=${v:-0.1.0}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: CHANGELOG.md
      - name: Описание и контрольные суммы
        shell: bash
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          # «Что нового» — раздел этой версии из CHANGELOG.md (тот же текст приложения показывают после обновления).
          notes=$(awk -v v="$V" '/^## /{p=($2==v)} p && /^- /' src/CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::В CHANGELOG.md нет раздела «## $V»: опишите, что нового"
            exit 1
          fi
          {
            echo "**Что нового в $V:**"
            echo "$notes"
            echo
            echo "**Обновление:** в Deixis 0.10 и новее — «Настройки → Обновления» на телефоне, «Устройства → экран» для ТВ и проектора, «Обновления…» в меню компьютера."
            echo
            echo '**Deixis — универсальная версия для любого Android:** пульт и экран сразу. На телефоне открывается пультом (плитка «Стать экраном» делает экраном само устройство), на телевизоре и приставке — сразу экраном. `Deixis-…-all.apk` подходит любому устройству; `…-arm64-v8a.apk` — современным телефонам, `…-armeabi-v7a.apk` — большинству ТВ и проекторов, оба меньше.'
            echo '**Deixis TV — облегчённая версия «только экран»:** для телевизора, приставки, проектора или доски, где пульт не нужен. `Deixis-TV-…-armeabi-v7a.apk` или `…-arm64-v8a.apk`; если не уверены — `Deixis-TV-…-all.apk`.'
            echo '**Компьютер:** `.msi` для Windows, `.dmg` для Mac на Apple Silicon, `.deb` для Ubuntu и Debian.'
          } > notes.md
          # Контрольные суммы: приложения не ставят файл, сумма которого не совпала.
          (cd files && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Описание выпуска файлом, в том же виде, что ответ API GitHub: приложения берут его, когда API
          # упёрся в лимит (60 запросов в час на адрес, у мобильных операторов адрес общий).
          python3 - "$V" "$GITHUB_REPOSITORY" "${{ inputs.test == true }}" <<'PY'
          import json, os, sys
          v, repo, test = sys.argv[1], sys.argv[2], sys.argv[3] == "true"
          sums = {}
          for line in open("files/SHA256SUMS.txt", encoding="utf-8"):
              h, name = line.split(None, 1)
              sums[name.strip().lstrip("*")] = h
          assets = [{"name": n, "size": os.path.getsize(f"files/{n}"),
                     "browser_download_url": f"https://github.com/{repo}/releases/download/v{v}/{n}",
                     **({"digest": "sha256:" + sums[n]} if n in sums else {})}
                    for n in sorted(os.listdir("files"))]
          body = open("notes.md", encoding="utf-8").read()
          json.dump([{"tag_name": f"v{v}", "prerelease": test, "draft": False, "body": body, "assets": assets}],
                    open("files/release.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Deixis v${{ steps.ver.outputs.v }}
          # Пробные сборки видят только тестеры (канал «Пробные»); стабильные — все.
          prerelease: ${{ inputs.test == true }}
          files: files/*
          body_path: notes.md
