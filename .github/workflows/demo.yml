name: Demo

# Веб-демо на GitHub Pages: настоящие пульт и экран на демо-данных (tools/demo).
# Запуск вручную; в настройках репозитория Pages → Source должен стоять «GitHub Actions».
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Демо на GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Сборка демо
        run: python3 tools/demo/build.py
      # Короткие прямые ссылки на APK последнего выпуска: встроенные браузеры ТВ и проекторов
      # плохо переносят перенаправления GitHub и сохраняют вместо файла страницу.
      - name: APK последнего выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          v=${tag#v}
          mkdir -p dl && cd dl
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "Deixis-TV-$v-armeabi-v7a.apk" --pattern "Deixis-TV-$v-arm64-v8a.apk" --pattern "Deixis-$v-arm64-v8a.apk" --pattern "Deixis-$v-armeabi-v7a.apk"
          cp "Deixis-TV-$v-armeabi-v7a.apk" ../build/demo/tv.apk
          cp "Deixis-TV-$v-arm64-v8a.apk" ../build/demo/tv64.apk
          cp "Deixis-$v-arm64-v8a.apk" ../build/demo/deixis.apk
          cp "Deixis-$v-armeabi-v7a.apk" ../build/demo/deixis32.apk
          ls -la ../build/demo/*.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/demo
      - id: deployment
        uses: actions/deploy-pages@v4
