name: Виртуальный монитор Windows

# Драйвер Deixis Display: сборка, подпись своим сертификатом и проверка на настоящей Windows —
# после установки система должна увидеть монитор «Deixis», после удаления — нет.
on:
  push:
    paths: ['windows-display/**', '.github/workflows/windows-display.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Сборка
        shell: pwsh
        run: ./windows-display/build.ps1
      - name: Установка и проверка
        shell: pwsh
        run: |
          $out = "windows-display/out"
          function Monitors { (Get-CimInstance -Namespace root\wmi -ClassName WmiMonitorID -ErrorAction SilentlyContinue | ForEach-Object { -join ($_.ManufacturerName | Where-Object { $_ -ne 0 } | ForEach-Object { [char]$_ }) }) }
          "До: $(Monitors)"
          # Журнал драйвера по шагам: папка открыта на запись всем (драйвер работает как LocalService).
          New-Item -ItemType Directory -Force C:\ProgramData\Deixis\display-log | Out-Null
          icacls C:\ProgramData\Deixis\display-log /grant '*S-1-1-0:(OI)(CI)F' | Out-Null
          # Дамп процесса драйвера при падении: потом его разберёт отладчик с нашими символами.
          New-Item -ItemType Directory -Force C:\dumps | Out-Null
          $ld = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WUDFHost.exe"
          New-Item -Force $ld | Out-Null
          Set-ItemProperty $ld DumpFolder 'C:\dumps'; Set-ItemProperty $ld DumpType 2 -Type DWord; Set-ItemProperty $ld DumpCount 3 -Type DWord
          # Проверщик WDF для нашего драйвера: при нарушении он пишет, какой вызов неверен.
          New-Item -Force "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\DeixisDisplay\Parameters\Wdf" | Out-Null
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\DeixisDisplay\Parameters\Wdf" VerifierOn 1
          & "$out/deixis-display.exe" install (Resolve-Path "$out/DeixisDisplay.inf") (Resolve-Path "$out/DeixisDisplay.cer") --log "$env:RUNNER_TEMP\helper.log"
          $code = $LASTEXITCODE
          "--- шаги помощника:"; Get-Content "$env:RUNNER_TEMP\helper.log"
          if ($code -ne 0) { throw "установка: код $code" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\helper.log" -Pattern "драйвер: установлен" -Quiet)) { throw "в журнале помощника нет шага установки драйвера" }
          & "$out/deixis-display.exe" status; if ($LASTEXITCODE -ne 0) { throw "устройство не заведено" }
          $seen = $false
          for ($i = 0; $i -lt 30 -and -not $seen; $i++) { Start-Sleep 1; $seen = (Monitors) -contains 'DXS' }
          Get-PnpDevice -Class Display | Format-Table -AutoSize FriendlyName, Status, InstanceId
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-Table DeviceName, Bounds, Primary
          if (-not $seen) {
            # Почему: код проблемы устройства, журнал установки и журнал UMDF.
            Get-PnpDevice -Class Display | Where-Object FriendlyName -like 'Deixis*' | ForEach-Object {
              Get-PnpDeviceProperty -InstanceId $_.InstanceId -KeyName DEVPKEY_Device_ProblemCode, DEVPKEY_Device_ProblemStatus, DEVPKEY_Device_DriverVersion | Format-Table -AutoSize KeyName, Data
            }
            pnputil /enum-devices /class Display /problem
            "--- журнал драйвера ---"
            Get-Content C:\ProgramData\Deixis\display-log\driver.log -ErrorAction SilentlyContinue
            # Разбор дампа: исключение, стек с нашими символами, журнал WDF.
            $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $pdb = (Get-ChildItem -Recurse windows-display/driver -Filter DeixisDisplay.pdb | Select-Object -First 1).DirectoryName
            $dump = Get-ChildItem C:\dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
            "дамп: $($dump.FullName); отладчик: $($cdb.FullName); символы: $pdb"
            if ($cdb -and $dump) {
              & $cdb.FullName -z $dump.FullName -y "$pdb;srv*C:\symbols*https://msdl.microsoft.com/download/symbols" -c ".ecxr; kb 30; !analyze -v; !wdfkd.wdflogdump DeixisDisplay; q" 2>&1 | Select-Object -Last 160
            }
            throw "Windows не увидела монитор Deixis"
          }
          & "$out/deixis-display.exe" remove
          if ($LASTEXITCODE -ne 0) { throw "удаление: код $LASTEXITCODE" }
          "После удаления: $(Monitors)"
      - uses: actions/upload-artifact@v4
        with:
          name: deixis-display
          path: windows-display/out/

