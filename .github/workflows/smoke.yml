name: Android smoke

# Запуск релизных Deixis TV и Deixis на эмуляторах Android 8, 11 и 13: ловит падения при старте, которых не видно при сборке.
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "core/src/main/**", ".github/workflows/smoke.yml", "tools/android-smoke.sh"]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Запуск на Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 33]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка APK
        run: ./gradlew :android:phone:assembleRelease :android:tv:assembleRelease
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tools/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-${{ matrix.api }}
          path: smoke/
