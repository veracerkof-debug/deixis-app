name: Android smoke

# Запуск релизных Deixis TV и Deixis на эмуляторах Android 8, 11 и 13: ловит падения при старте, которых не видно при сборке.
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "core/src/main/**", "diag/**", "desktop/**", "pult/**", ".github/workflows/smoke.yml", "tools/android-smoke.sh"]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  smoke:
    name: Запуск на Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 33]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Сборка APK
        # --stacktrace: packageRelease изредка падает без причины в журнале («IncrementalSplitterRunnable»), со стеком причина будет видна.
        run: ./gradlew --stacktrace :android:phone:assembleRelease :android:tv:assembleRelease :android:tv:assembleDebug :desktop:installDist
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: DEIXIS_CLI=$PWD/desktop/build/install/deixis/bin/deixis ./tools/android-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-smoke-${{ matrix.api }}
          path: smoke/
