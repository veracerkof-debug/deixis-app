name: Запуск программы для компьютера

# Собранная, как для установщика (jpackage), программа запускается на настоящей системе:
# какие окна открылись (зал и пульт), снимок экрана и журнал программы. Ловит то, чего не видят
# проверки из Gradle: другая Java внутри программы, запуск без консоли.
on:
  workflow_dispatch:
  push:
    paths: [ "desktop/**", "pult/**", "core/**", ".github/workflows/desktop-smoke.yml" ]

jobs:
  run:
    name: Запуск (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2022 }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Сборка программы
        env:
          DEIXIS_SKIP_ANDROID: "1"
        run: ./gradlew :desktop:installDist
      # Драйвер виртуального монитора Deixis Display — как в установщике (release.yml).
      - name: Виртуальный монитор для Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./windows-display/build.ps1
          New-Item -ItemType Directory -Force content/deixis-display | Out-Null
          Copy-Item windows-display/out/* content/deixis-display/
      - name: Программа как в установщике
        run: |
          extra=()
          if [ -d content/deixis-display ]; then
            extra=(--app-content content/deixis-display --java-options '-Ddeixis.display=$APPDIR\..\deixis-display')
          fi
          jpackage --type app-image --name Deixis --input desktop/build/install/deixis/lib --main-jar desktop.jar \
            --main-class app.deixis.desktop.MainKt --java-options "-Dfile.encoding=UTF-8" "${extra[@]}" --dest out
          ls out
      - name: Запуск и окна (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          # Как после установщика: путь с пробелом («Program Files»). Без пробела ошибка 0.10.30–0.10.33 не видна (KNOWLEDGE 1.2).
          $app = "$env:RUNNER_TEMP\Program Files\Deixis"
          New-Item -ItemType Directory -Force (Split-Path $app) | Out-Null
          Copy-Item out\Deixis $app -Recurse
          $data = "$env:RUNNER_TEMP\deixis-data"
          # Тот же запуск, что из меню «Пуск»: без консоли, через запускатель jpackage.
          $p = Start-Process -FilePath "$app\Deixis.exe" -ArgumentList @("receive", "--role", "both", "--data", $data) -PassThru
          Start-Sleep -Seconds 60
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices; using System.Collections.Generic;
          public static class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static List<string> Titles(uint pid) {
              var r = new List<string>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); var s = new StringBuilder(256); GetWindowText(h, s, 256);
                if (IsWindowVisible(h) && s.Length > 0) r.Add(p + " " + s); return true; }, IntPtr.Zero);
              return r;
            }
          }
          "@
          Get-Process | Where-Object { $_.ProcessName -like "Deixis*" -or $_.ProcessName -like "java*" } | Format-Table Id, ProcessName, MainWindowTitle
          "--- видимые окна:"
          [Win]::Titles(0) | Where-Object { $_ -match "Deixis" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("smoke\windows.png")
          "--- журнал программы:"
          Get-Content "$data\log.txt" -ErrorAction SilentlyContinue
          Copy-Item "$data\log.txt" smoke\ -ErrorAction SilentlyContinue
          $titles = [Win]::Titles(0) -join "`n"
          "--- мониторы: " + [System.Windows.Forms.Screen]::AllScreens.Count
          [System.Windows.Forms.Screen]::AllScreens | Format-Table DeviceName, Primary, Bounds
          if ($titles -notmatch "Deixis — (пульт|remote|pult)") { Write-Error "Окно пульта не открылось"; exit 1 }
          if ([System.Windows.Forms.Screen]::AllScreens.Count -lt 2) { Write-Error "Виртуального монитора нет в системе"; exit 1 }
          # Один дисплей у «Пульта и экрана»: Deixis сам создаёт виртуальный монитор и выводит зал туда.
          if (-not (Select-String -Path "$data\log.txt" -Pattern "зал — на виртуальном мониторе" -Quiet)) { Write-Error "Зал не ушёл на виртуальный монитор"; exit 1 }
          # Повторный запуск при работающей программе открывает её пульт, а не молчит.
          & "$app\Deixis.exe" receive --role both --data $data
          Start-Sleep -Seconds 3
          Copy-Item "$data\log.txt" smoke\log-after.txt -ErrorAction SilentlyContinue
          "--- после повторного запуска:"
          [Win]::Titles(0) | Where-Object { $_ -match "Deixis" }
          Get-Process | Where-Object { $_.ProcessName -like "Deixis*" } | Stop-Process -Force
          & "$app\deixis-display\deixis-display.exe" remove
      - name: Запуск и окна (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p smoke
          data="$RUNNER_TEMP/deixis-data"
          out/Deixis.app/Contents/MacOS/Deixis receive --role both --data "$data" &
          sleep 60
          screencapture -x smoke/macos.png || true
          echo "--- журнал программы:"; cat "$data/log.txt" || true
          cp "$data/log.txt" smoke/ || true
          # Где стоит программа, если пульт не открылся: потоки Java — в лог проверки.
          if ! grep -q "Окно пульта: открыто" "$data/log.txt"; then
            for p in $(pgrep -f "Deixis.app/Contents/MacOS/Deixis"); do "$JAVA_HOME/bin/jstack" "$p" || true; done
          fi
          pkill -f Deixis || true
          grep -q "Окно пульта: открыто" "$data/log.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: smoke/

  # Linux (X11): проектор повторяет рабочий стол — Deixis считает его одним монитором, сам включает свободный
  # выход видеокарты как виртуальный монитор и выводит зал туда; после выхода монитор убирается.
  linux:
    name: Запуск (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Сборка программы
        env:
          DEIXIS_SKIP_ANDROID: "1"
        run: ./gradlew :desktop:installDist
      - name: Xorg с драйвером-заглушкой
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils openbox wmctrl
          sudo Xorg :5 -config "$PWD/tools/smoke/xorg-dummy.conf" -noreset -logfile "$RUNNER_TEMP/xorg.log" &
          sleep 3
          export DISPLAY=:5
          openbox &
          # Проектор в режиме «повтор»: второй выход на том же месте.
          xrandr --addmode DUMMY1 1920x1080
          xrandr --output DUMMY1 --mode 1920x1080 --pos 0x0
          xrandr --listmonitors
      - name: Запуск, зал на виртуальном мониторе, уборка
        env:
          DISPLAY: ":5"
          LC_ALL: C.UTF-8
        run: |
          mkdir -p smoke
          data="$RUNNER_TEMP/deixis-data"
          desktop/build/install/deixis/bin/deixis receive --role both --data "$data" &
          sleep 30
          echo "--- журнал программы:"; cat "$data/log.txt" || true
          cp "$data/log.txt" smoke/ || true
          echo "--- окна:"; wmctrl -lG || true
          xrandr --listmonitors | tee smoke/monitors.txt
          grep -q "Окно пульта: открыто" "$data/log.txt"
          grep -q "зал — на виртуальном мониторе" "$data/log.txt"
          grep -q "Monitors: 3" smoke/monitors.txt
          pkill -TERM -f "deixis.*receive"
          sleep 8
          xrandr --listmonitors | tee smoke/monitors-after.txt
          grep -q "Monitors: 2" smoke/monitors-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-smoke-Linux
          path: smoke/
