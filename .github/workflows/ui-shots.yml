name: Снимки интерфейса

# Снимки пульта на эмуляторе Android 13: телефон и планшет, экран в зале 16:9 и вертикальный.
# Уменьшенные снимки кладутся в служебную ссылку refs/ci/ui-shots (не ветка; каждый запуск её
# перезаписывает): git fetch origin refs/ci/ui-shots — и они на месте. Полные PNG — в архиве ui-shots.
on:
  workflow_dispatch:
    inputs:
      extra:
        description: "Дополнительные сцены: имя:вкладка через пробел"
        required: false
        default: ""
  push:
    paths: ["android/phone/**", "android/receiver/**", ".github/workflows/ui-shots.yml", "tools/android-shots.sh"]

concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    name: Снимки
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка APK
        run: ./gradlew :android:phone:assembleDebug
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Снимки
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tools/android-shots.sh ${{ github.event.inputs.extra }}
      - name: Снимки в refs/ci/ui-shots
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d shots/view ] || exit 0
          cd shots/view
          git init -q
          git -c user.name="CI" -c user.email="ci@deixis.invalid" add -A
          git -c user.name="CI" -c user.email="ci@deixis.invalid" commit -q -m "Снимки интерфейса: ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots/
